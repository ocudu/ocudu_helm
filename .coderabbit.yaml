# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Repo config; overrides the org-level UI settings for this repo.

inheritance: true
language: en-US
tone_instructions: "Terse and technical; no praise or emojis. Withdraw a finding on counter-evidence (code, config, spec) or if you can't back it; else restate yours. In threads, reply only to add information or confirm a fix; never offer issues or unavailable features."

reviews:
  profile: chill
  high_level_summary: false
  high_level_summary_in_walkthrough: false
  review_status: false
  review_info: false
  review_details: false
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: false
  commit_status: true
  fail_commit_status: false

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    ignore_title_keywords: ["WIP", "[skip review]"]

  path_filters:
    - "!LICENSES/**"

  path_instructions:
    - path: "**"
      instructions: |
        Use Major only for issues reachable with the chart defaults or a values file in this repo; if an issue depends on another setting, mark it Minor and name that setting.
        Report a finding only with a concrete failure scenario (values or cluster state leading to the wrong outcome); drop speculative ones.
    - path: "charts/**/templates/**"
      instructions: |
        Go-templated Kubernetes manifests, not plain YAML. CI runs `helm lint --strict` and kubeconform on the rendered defaults and the ci/ values files; skip what those catch.
        Check that optional values are accessed nil-safely, that indentation helpers (`nindent`, `toYaml`) produce valid output, and that selector labels stay unchanged, since a changed Deployment selector breaks `helm upgrade`.
        Privileged containers, added capabilities, hostNetwork, hugepages, SR-IOV resources and CPU pinning are intended in the RAN and timing charts (ocudu-*, ru_emulator, linuxptp, tuned, rt-tests); do not flag them.
    - path: "charts/ocudu-{gnb,cu,du,cu-cp,cu-up}/**"
      instructions: |
        These five charts share most templates and values by copy. When a change fixes or adds something in one of them, check whether the others need the same change and name the ones that do.
    - path: "charts/**"
      instructions: |
        A change to a chart's templates, values or resources needs an entry under `## Unreleased` in that chart's CHANGELOG.md. New or changed values keys need the chart README updated.
    - path: ".gitlab/**"
      instructions: |
        GitLab CI. Check rules/needs/extends correctness and that jobs still run on the intended pipelines (MR, default branch, schedules), including the child pipelines each chart and image triggers.
    - path: "images/**"
      instructions: |
        Check image size, layer caching and pinned versions.

  tools:
    # Templates are Go templates, not YAML; helm lint and kubeconform cover them in CI.
    yamllint:
      enabled: false
    # Overlaps trivy; both flag the privileges the RAN charts need by design.
    checkov:
      enabled: false
    trivy:
      enabled: true
    shellcheck:
      enabled: true
    hadolint:
      enabled: true
    markdownlint:
      enabled: true
    ruff:
      enabled: true
    gitleaks:
      enabled: true
    languagetool:
      enabled: false

  finishing_touches:
    autofix:
      enabled: false
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

  pre_merge_checks:
    title:
      mode: "off"
    description:
      mode: "off"
    docstrings:
      mode: "off"
    issue_assessment:
      mode: "off"

chat:
  art: false
  auto_reply: true
  allow_non_org_members: false

knowledge_base:
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local
