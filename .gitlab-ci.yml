################################################################################
## Charts
################################################################################

.helm chart:
  stage: child
  rules:
    # Package changes must be validated against the immutable registry version.
    - if: $ON_MR
      changes:
        paths: &helm_package_paths
          - $CHART_PATH/Chart.yaml
          - $CHART_PATH/values*.yaml
          - $CHART_PATH/templates/**/*
          - $CHART_PATH/resources/**/*
          - $CHART_PATH/charts/**/*
          - $CHART_PATH/crds/**/*
          - $CHART_PATH/.helmignore
      variables:
        CHART_PACKAGE_CHANGED: "true"
    # CI and documentation changes still exercise the child pipeline without requiring
    # a chart version bump.
    - if: $ON_MR
      changes:
        paths:
          - .gitlab/ci/helm_*
          - .gitlab/cnti/$CHART_NAME/**/*
          - $CHART_PATH/**/*
      variables:
        CHART_PACKAGE_CHANGED: "false"
    # Never publish a production chart for a CI-only change.
    - if: $ON_DEFAULT_BRANCH
      changes:
        paths: *helm_package_paths
  needs: []

grafana-ocudu chart:
  extends: .helm chart
  variables:
    CHART_NAME: grafana-ocudu
    CHART_PATH: charts/grafana-ocudu
  trigger:
    strategy: mirror
    include: charts/grafana-ocudu/.gitlab-ci.yml

