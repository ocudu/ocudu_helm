spec:
  inputs:
    ocudu_path:
      type: string
      default: ocudu/ocudu
      description: "OCUDU repository path."
    ocudu_ref:
      type: string
      default: dev
      description: "OCUDU reference branch or tag."
---
include:
  - project: $[[ inputs.ocudu_path ]]
    ref: $[[ inputs.ocudu_ref ]]
    file: .gitlab/ci-shared/workflow.yml
  - project: $[[ inputs.ocudu_path ]]
    ref: $[[ inputs.ocudu_ref ]]
    file: .gitlab/ci-shared/static.yml
  - project: $[[ inputs.ocudu_path ]]
    ref: $[[ inputs.ocudu_ref ]]
    file: .gitlab/ci-shared/gitlab_settings/.gitlab-ci.yml
    inputs:
      ocudu_path: $[[ inputs.ocudu_path ]]
      ocudu_ref: $[[ inputs.ocudu_ref ]]

variables:
  OCUDU_REGISTRY_URI: ${CI_TEMPLATE_REGISTRY_HOST}/$[[ inputs.ocudu_path ]]

stages:
  - ci
  - static
  - child
  - publish

headers:
  stage: ci
  extends: .headers

################################################################################
## Images
################################################################################

ipsec-sidecar image:
  stage: child
  variables:
    STRONGSWAN_VERSION: "6.0.4"
    CT_VERSION: "1.0.0"
  rules:
    - if: $ON_MR
      changes:
        paths:
          - .gitlab/ci/image_utils.yml
          - images/ipsec-sidecar/**/*
    - if: $ON_DEFAULT_BRANCH
      changes:
        paths:
          - images/ipsec-sidecar/**/*
  trigger:
    strategy: mirror
    include:
      - local: images/ipsec-sidecar/.gitlab-ci.yml
        inputs:
          ocudu_path: $[[ inputs.ocudu_path ]]
          ocudu_ref: $[[ inputs.ocudu_ref ]]
  needs: []

