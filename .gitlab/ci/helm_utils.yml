.helm lint:
  image:
    name: alpine/helm:3.15.2
    entrypoint: ["/bin/sh", "-c"]
  stage: static
  retry: 2
  variables:
    CHART_PATH: ${CI_PROJECT_DIR}
    LINT_VALUES_FILE: ""
  rules:
    - if: $ON_MR
  script:
    - |
      # Installing kubeconform
      cd /tmp
      apk add --no-cache curl unzip
      curl -LO https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
      tar -xzf kubeconform-linux-amd64.tar.gz
      mv kubeconform /usr/local/bin/
      chmod +x /usr/local/bin/kubeconform
      cd ${CI_PROJECT_DIR}
    - helm dependency update ${CHART_PATH}/
    - helm lint --strict --with-subcharts ${CHART_PATH}/ ${LINT_VALUES_FILE:+-f $LINT_VALUES_FILE}
    - helm template --debug ${CHART_PATH}/ ${LINT_VALUES_FILE:+-f $LINT_VALUES_FILE} | kubeconform --debug --strict
    - helm template ${CHART_PATH}/ ${LINT_VALUES_FILE:+-f $LINT_VALUES_FILE}

.helm version check:
  image:
    name: alpine/helm:3.16.2
    entrypoint: ["/bin/sh", "-c"]
  stage: static
  retry: 2
  variables:
    CHART_PATH: ${CI_PROJECT_DIR}
    CHART_NAME: ""
  rules:
    - if: $ON_MR
  before_script:
    - apk add --no-cache yq git
    - helm registry login -u $CI_REGISTRY_USER -p $CI_JOB_TOKEN $CI_REGISTRY
  script:
    - echo "Checking chart version availability"
    - echo "Chart $CHART_NAME"
    - echo "Path $CHART_PATH"
    - echo "Registry $CI_REGISTRY/$CI_PROJECT_PATH"
    - BASE_VERSION=$(yq eval '.version' ${CHART_PATH}/Chart.yaml)
    - echo "Base version from Chart.yaml $BASE_VERSION"
    - |
      # Changes collect under "## Unreleased" in the chart's CHANGELOG.md, so an MR
      # does not have to bump the version. An MR that does bump it must raise it to
      # one the registry does not have yet.
      git config --global --add safe.directory "$CI_PROJECT_DIR"
      git fetch --depth=1 origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      TARGET_VERSION=$(git show "FETCH_HEAD:${CHART_PATH}/Chart.yaml" 2>/dev/null | yq eval '.version' -)
      if [ "$BASE_VERSION" = "$TARGET_VERSION" ]; then
        echo "Version $BASE_VERSION is unchanged, nothing to check"
        exit 0
      fi
    - |
      # For MR: Check if clean version exists (would conflict on merge)
      if [ -n "$CI_MERGE_REQUEST_IID" ]; then
        VERSION="$BASE_VERSION"
        echo "Checking if clean version $VERSION exists (would conflict on merge)"
        if helm pull oci://$CI_REGISTRY/$CI_PROJECT_PATH/$(yq eval '.name' ${CHART_PATH}/Chart.yaml) --version $VERSION 2>/dev/null; then
          echo "WARNING: Version $VERSION already exists in registry"
          echo "Please bump the version before merging"
          exit 1
        else
          echo "Version $VERSION is available"
          echo "This version can be published when merged to default branch"
        fi
      fi

.helm publish-dev:
  image:
    name: alpine/helm:3.16.2
    entrypoint: ["/bin/sh", "-c"]
  stage: publish
  retry: 2
  variables:
    CHART_PATH: ${CI_PROJECT_DIR}
    CHART_NAME: ""
  rules:
    - if: $ON_MR
      when: manual
      allow_failure: true
  before_script:
    - apk add --no-cache yq
    - helm registry login -u $CI_REGISTRY_USER -p $CI_JOB_TOKEN $CI_REGISTRY
  script:
    - |
      echo "Publishing Development Helm Chart to OCI Registry"
      echo "Chart $CHART_NAME"
      echo "Path $CHART_PATH"
      echo "Registry $CI_REGISTRY/$CI_PROJECT_PATH"
      BASE_VERSION=$(yq eval '.version' ${CHART_PATH}/Chart.yaml)
      echo "Base version from Chart.yaml $BASE_VERSION"
      VERSION="${BASE_VERSION}-dev"
      echo "Using development version $VERSION (allows overwrite)"
      yq eval ".version = \"$VERSION\"" -i ${CHART_PATH}/Chart.yaml
      if grep -q "^dependencies:" ${CHART_PATH}/Chart.yaml 2>/dev/null; then
        echo "Updating chart dependencies"
        helm dependency update ${CHART_PATH}/
      fi
      echo "Packaging chart with version $VERSION"
      PACKAGE_FILE=$(helm package ${CHART_PATH}/ --destination . | grep -oE '[^ ]+\.tgz$')
      echo "Chart packaged $PACKAGE_FILE"
      CHART_NAME=$(basename $PACKAGE_FILE .tgz | sed "s/-${VERSION}$//")
      echo "Chart name $CHART_NAME"
      echo "Publishing to OCI registry"
      helm push $PACKAGE_FILE oci://$CI_REGISTRY/$CI_PROJECT_PATH
      echo "Successfully published $CHART_NAME:$VERSION"
      echo "Verifying published chart"
      helm pull oci://$CI_REGISTRY/$CI_PROJECT_PATH/$CHART_NAME --version $VERSION --destination /tmp
      echo "Verification successful"
      echo "Install with: helm install <name> oci://$CI_REGISTRY/$CI_PROJECT_PATH/$CHART_NAME --version $VERSION"

.helm publish-prod:
  image:
    name: alpine/helm:3.16.2
    entrypoint: ["/bin/sh", "-c"]
  stage: publish
  retry: 2
  variables:
    CHART_PATH: ${CI_PROJECT_DIR}
    CHART_NAME: ""
  rules:
    - if: $ON_DEFAULT_BRANCH
  before_script:
    - apk add --no-cache yq
    - helm registry login -u $CI_REGISTRY_USER -p $CI_JOB_TOKEN $CI_REGISTRY
  script:
    - |
      echo "Publishing Production Helm Chart to OCI Registry"
      echo "Chart $CHART_NAME"
      echo "Path $CHART_PATH"
      echo "Registry $CI_REGISTRY/$CI_PROJECT_PATH"
      VERSION=$(yq eval '.version' ${CHART_PATH}/Chart.yaml)
      echo "Using production version $VERSION"
      # A merge without a version bump only adds to "## Unreleased": never
      # overwrite the release that is already in the registry.
      if helm pull oci://$CI_REGISTRY/$CI_PROJECT_PATH/$(yq eval '.name' ${CHART_PATH}/Chart.yaml) --version $VERSION --destination /tmp 2>/dev/null; then
        echo "Version $VERSION is already published, nothing to release"
        exit 0
      fi
      if grep -q "^dependencies:" ${CHART_PATH}/Chart.yaml 2>/dev/null; then
        echo "Updating chart dependencies"
        helm dependency update ${CHART_PATH}/
      fi
      echo "Packaging chart with version $VERSION"
      PACKAGE_FILE=$(helm package ${CHART_PATH}/ --destination . | grep -oE '[^ ]+\.tgz$')
      echo "Chart packaged $PACKAGE_FILE"
      CHART_NAME=$(basename $PACKAGE_FILE .tgz | sed "s/-${VERSION}$//")
      echo "Chart name $CHART_NAME"
      echo "Publishing to OCI registry"
      helm push $PACKAGE_FILE oci://$CI_REGISTRY/$CI_PROJECT_PATH
      echo "Successfully published $CHART_NAME:$VERSION"
      echo "Verifying published chart"
      helm pull oci://$CI_REGISTRY/$CI_PROJECT_PATH/$CHART_NAME --version $VERSION --destination /tmp
      echo "Verification successful"
      echo "Install with: helm install <name> oci://$CI_REGISTRY/$CI_PROJECT_PATH/$CHART_NAME --version $VERSION"
  artifacts:
    paths:
      - "*.tgz"
    expire_in: 2 days
    when: always

# Extended next to the CNTi Test Suite component's job: when the run fails, print
# what the suite's own report leaves out, the pods' state and events and the logs
# of their containers, including the last instance of one that crashed. The kind
# cluster lives until the job ends, so it is still there in after_script.
.cnti diagnostics:
  after_script:
    - |
      if [ "$CI_JOB_STATUS" != "success" ]; then
        export PATH="$HOME/.cnti-testsuite/bin:$PATH"
        kubectl get nodes,pods -A -o wide
        kubectl describe pods -n cnti-default
        for pod in $(kubectl get pods -n cnti-default -o name); do
          echo "----- $pod"
          kubectl logs -n cnti-default "$pod" --all-containers --tail=200 || true
          echo "----- $pod (previous)"
          kubectl logs -n cnti-default "$pod" --all-containers --previous --tail=200 || true
        done
      fi

# Extended next to the CNTi Test Suite component's job, for the on-prem runners
# (Kubernetes executor), which also pick up jobs tagged for the gitlab.com ones.
# They start the job without waiting for the dind service, so kind could not
# reach dockerd: repeat the component's before_script, then wait for dockerd.
# The job pod also carries the runner's service account, and kubescape prefers
# that in-cluster config over ~/.kube/config: point KUBECONFIG at the file kind
# writes, or kubescape scans the runner's cluster instead of the kind cluster.
.cnti runner setup:
  before_script:
    - if command -v apk >/dev/null; then apk add --no-cache bash curl git tar >/dev/null; fi
    - export KUBECONFIG="$HOME/.kube/config"
    - |
      i=0
      while ! docker info >/dev/null 2>&1; do
        i=$((i+1))
        if [ "$i" -ge 60 ]; then
          echo "ERROR: dockerd not ready after 60s"
          docker info
          exit 1
        fi
        sleep 1
      done
