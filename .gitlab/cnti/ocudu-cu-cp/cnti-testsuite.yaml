# CNTi Test Suite configuration for the ocudu-cu-cp chart in this repository:
# the CU-CP without a core (cu_cp.amf.no_core) and without a CU-UP or DU, so it
# runs on a plain Kubernetes cluster.
# Used by the cnti-testsuite-cu-cp job of charts/ocudu-cu-cp/.gitlab-ci.yml.
---
config_version: "v2"
deployments:
  helm_dirs:
    - name: ocudu-cu-cp
      helm_directory: ../../../charts/ocudu-cu-cp
      helm_values: -f .gitlab/cnti/ocudu-cu-cp/values.yaml
