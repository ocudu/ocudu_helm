# CNTi Test Suite configuration for the ocudu-cu chart in this repository: the
# CU without a core (cu_cp.amf.no_core), so it runs on a plain Kubernetes
# cluster.
# Used by the cnti-testsuite-cu job of charts/ocudu-cu/.gitlab-ci.yml.
---
config_version: "v2"
deployments:
  helm_dirs:
    - name: ocudu-cu
      helm_directory: ../../../charts/ocudu-cu
      helm_values: -f .gitlab/cnti/ocudu-cu/values.yaml
