apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "influxdb3.fullname" . }}
  labels:
    app: influxdb3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: influxdb3
  template:
    metadata:
      labels:
        app: influxdb3
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if or (and .Values.auth.enabled .Values.auth.adminToken.existingSecret) .Values.tls.enabled }}
      initContainers:
        {{- if .Values.tls.enabled }}
        - name: prepare-tls
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              cp /tls-source/tls.crt /tls-source/tls.key /tls-source/ca.crt \
                "{{ .Values.tls.mountPath }}/"
              chmod 0600 "{{ .Values.tls.mountPath }}"/tls.crt \
                "{{ .Values.tls.mountPath }}"/tls.key \
                "{{ .Values.tls.mountPath }}"/ca.crt
          volumeMounts:
            - name: tls-source
              mountPath: /tls-source
              readOnly: true
            - name: tls
              mountPath: {{ .Values.tls.mountPath }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
        {{- end }}
        {{- if and .Values.auth.enabled .Values.auth.adminToken.existingSecret }}
        - name: prepare-admin-token
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              cp "/bootstrap-source/{{ .Values.auth.adminToken.key }}" \
                "{{ .Values.auth.adminToken.mountPath }}/admin-token.json"
              chmod 0600 "{{ .Values.auth.adminToken.mountPath }}/admin-token.json"
          volumeMounts:
            - name: admin-token-source
              mountPath: /bootstrap-source
              readOnly: true
            - name: admin-token
              mountPath: {{ .Values.auth.adminToken.mountPath }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
        {{- end }}
      {{- end }}
      containers:
        - name: influxdb3
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: LOG_FILTER
              value: "{{ .Values.env.LOG_FILTER }}"
            - name: INFLUXDB_NODE_ID
              value: "{{ .Values.env.INFLUXDB_NODE_ID }}"
          command: ["influxdb3", "serve"]
          args:
            {{- toYaml .Values.args | nindent 12 }}
            {{- if not .Values.auth.enabled }}
            - --without-auth
            {{- else if .Values.auth.adminToken.existingSecret }}
            - --admin-token-file={{ .Values.auth.adminToken.mountPath }}/admin-token.json
            {{- end }}
            {{- if .Values.tls.enabled }}
            - --tls-cert={{ .Values.tls.mountPath }}/tls.crt
            - --tls-key={{ .Values.tls.mountPath }}/tls.key
            - --tls-minimum-version={{ .Values.tls.minimumVersion }}
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: api
          readinessProbe:
            tcpSocket:
              port: api
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: api
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            - name: plugins
              mountPath: {{ .Values.persistence.pluginMountPath }}
            {{- if and .Values.auth.enabled .Values.auth.adminToken.existingSecret }}
            - name: admin-token
              mountPath: {{ .Values.auth.adminToken.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.tls.enabled }}
            - name: tls
              mountPath: {{ .Values.tls.mountPath }}
              readOnly: true
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      volumes:
        {{- if and .Values.auth.enabled .Values.auth.adminToken.existingSecret }}
        - name: admin-token-source
          secret:
            secretName: {{ required "auth.adminToken.existingSecret is required when admin-token bootstrap is configured" .Values.auth.adminToken.existingSecret }}
            items:
              - key: {{ .Values.auth.adminToken.key }}
                path: {{ .Values.auth.adminToken.key }}
        - name: admin-token
          emptyDir: {}
        {{- end }}
        {{- if .Values.tls.enabled }}
        # Mounted secrets are owned by root, so a group-restricted mode is
        # unreadable to this image's unprivileged influxdb3 user unless the
        # platform happens to inject a matching fsGroup. The source is mounted
        # world-readable and copied to an emptyDir at 0600 by an init container,
        # the same approach the admin token uses.
        - name: tls-source
          secret:
            secretName: {{ required "tls.existingSecret is required when tls.enabled=true" .Values.tls.existingSecret }}
            defaultMode: 0444
            items:
              - key: {{ .Values.tls.certKey }}
                path: tls.crt
              - key: {{ .Values.tls.privateKeyKey }}
                path: tls.key
              - key: {{ .Values.tls.caKey }}
                path: ca.crt
        - name: tls
          emptyDir: {}
        {{- end }}
        - name: data
{{- if .Values.persistence.enabled }}
  {{- if eq .Values.persistence.type "pvc" }}
          persistentVolumeClaim:
            claimName: {{ include "influxdb3.fullname" . }}-data
  {{- else if eq .Values.persistence.type "hostPath" }}
          hostPath:
            path: {{ .Values.persistence.hostPath.path }}
            type: {{ .Values.persistence.hostPath.pathType }}
  {{- end }}
{{- else }}
          emptyDir: {}
{{- end }}
        - name: plugins
{{- if .Values.persistence.enabled }}
  {{- if eq .Values.persistence.type "pvc" }}
          persistentVolumeClaim:
            claimName: {{ include "influxdb3.fullname" . }}-plugins
  {{- else if eq .Values.persistence.type "hostPath" }}
          hostPath:
            path: {{ .Values.persistence.hostPath.path }}-plugins
            type: {{ .Values.persistence.hostPath.pathType }}
  {{- end }}
{{- else }}
          emptyDir: {}
{{- end }}
