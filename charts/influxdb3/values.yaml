# -- Override the name of the chart
# @default -- Chart name
nameOverride: ""

# -- Override the full name of resources
# @default -- Release name + chart name
fullnameOverride: ""

# -- Additional pod annotations
# @default -- `{}` (no additional annotations)
podAnnotations: {}

# -- Pod-level security context
# @default -- `{}` (no pod security context)
podSecurityContext: {}

# -- Container-level security context
# @default -- `{}` (no security context)
securityContext: {}

# -- Resource requests and limits
# Example:
# ```yaml
# resources:
#   limits:
#     cpu: 2
#     memory: 4Gi
#   requests:
#     cpu: 1
#     memory: 2Gi
# ```
# @default -- `{}` (no resource constraints)
resources: {}

# -- Node selector for pod assignment
# Schedule pods only on nodes with matching labels
# @default -- `{}` (no node selector)
nodeSelector: {}

# -- Tolerations for pod assignment
# Allows pods to be scheduled on nodes with matching taints
# @default -- `[]` (no tolerations)
tolerations: []

# -- Pod affinity configuration for advanced scheduling
# @default -- `{}` (no affinity rules)
affinity: {}

# -- Container image configuration
image:
  # -- Container image repository
  repository: influxdb
  # -- Image tag
  # @default -- Chart appVersion
  tag: "3.1.0-core"
  # -- Image pull policy
  pullPolicy: IfNotPresent

# -- Service configuration
service:
  # -- Service type (ClusterIP, NodePort, or LoadBalancer)
  type: ClusterIP
  # -- Service port for HTTP API
  port: 8081
  # -- NodePort for external access (only used when type: NodePort)
  # Required when type is NodePort and you want a fixed port number.
  # If omitted while type is NodePort, Kubernetes assigns a random port.
  # @default -- none (Kubernetes auto-assigns)
  nodePort: null

# -- Persistence configuration
# InfluxDB3 stores time-series data and requires persistent storage
persistence:
  # -- Enable persistent storage
  enabled: true
  
  # -- Storage type: 'pvc' for PersistentVolumeClaim or 'hostPath' for direct host access
  # - pvc: Use for cloud environments with dynamic provisioning
  # - hostPath: Use for bare-metal with direct host access
  type: hostPath
  
  # -- Mount path for data directory inside container
  mountPath: /var/lib/influxdb3
  # -- Mount path for plugins directory inside container
  pluginMountPath: /var/lib/influxdb3-plugins
  
  # PVC configuration (when type: pvc)
  pvc:
    # -- Storage class for dynamic provisioning (empty uses cluster default)
    storageClassName: ""
    # -- Access mode for PersistentVolumeClaim
    accessMode: ReadWriteOnce
    # -- Size of the data persistent volume
    size: 50Gi
    # -- Size of the plugins persistent volume
    pluginsSize: 1Gi
    # -- PVC annotations. Set helm.sh/resource-policy: keep to retain data when
    # the Helm release is removed.
    annotations: {}
  
  # hostPath configuration (when type: hostPath)
  hostPath:
    # -- Path on host for data directory
    path: /mnt/influxdb3
    # -- hostPath type
    pathType: DirectoryOrCreate

# -- Environment variables for InfluxDB3 configuration
env:
  # -- Log level filter (error, warn, info, debug, trace)
  LOG_FILTER: error
  # -- Unique node identifier for distributed deployments
  INFLUXDB_NODE_ID: node0

# -- Authentication configuration
auth:
  # -- Enable InfluxDB3 authorization. Off by default to preserve this chart's
  # demo behaviour; set true together with adminToken.existingSecret for a
  # production deployment.
  enabled: false
  # -- Secret key holding the raw administrator token used by clients, including
  # the retention hook. Must be the same credential as the bootstrap JSON.
  tokenKey: token
  adminToken:
    # -- Existing Secret containing the preconfigured admin-token JSON file
    existingSecret: ""
    # -- Secret key containing the JSON document accepted by --admin-token-file
    key: admin-token.json
    # -- Writable in-container path used after copying the Secret with mode 0600
    mountPath: /etc/influxdb3-auth

# -- TLS configuration for the InfluxDB3 API
tls:
  enabled: false
  # -- Existing kubernetes.io/tls-compatible Secret
  existingSecret: ""
  certKey: tls.crt
  privateKeyKey: tls.key
  caKey: ca.crt
  mountPath: /etc/influxdb3-tls
  minimumVersion: tls-1.2

# -- Database created by the retention hook. InfluxDB3 Core only accepts a
# retention period at database-creation time, so this is the database the
# retention period below is applied to. Set to "" to skip creating one.
database: ""

# -- Retention period applied to the database above when it is created.
# InfluxDB3 Core cannot change retention on an existing database.
retentionPeriod: ""

# -- Command-line arguments for InfluxDB3 server
# These configure core database behavior
# @default -- See values.yaml
args:
  # Use in-memory object store (no persistent object storage)
  - --object-store=memory
  # Data directory for local storage
  - --data-dir=/var/lib/influxdb3
  # Plugin directory for extensions
  - --plugin-dir=/var/lib/influxdb3-plugins
  # Node identifier (must match INFLUXDB_NODE_ID)
  - --node-id=node0
  # HTTP API bind address and port
  - --http-bind=0.0.0.0:8081

# -- Additional server arguments appended after the chart-managed auth, TLS,
# persistence, and retention arguments
extraArgs: []
