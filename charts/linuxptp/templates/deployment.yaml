{{- if and .Values.ptp4l.authentication.enabled (not .Values.ptp4l.authentication.existingSecret) }}
{{- fail "ptp4l.authentication.existingSecret must be set when ptp4l.authentication.enabled=true" }}
{{- end }}
{{- if and .Values.ptp4l.grandmasterAllowList.enabled (empty .Values.ptp4l.grandmasterAllowList.allowedSourceMacs) }}
{{- fail "ptp4l.grandmasterAllowList.allowedSourceMacs must contain at least one MAC address when enabled" }}
{{- end }}
{{- if and .Values.ptp4l.grandmasterAllowList.enabled (ne (.Values.config.network_transport | default "UDPv4") "L2") }}
{{- fail "ptp4l.grandmasterAllowList requires config.network_transport=L2: the tc filters match the L2 PTP ethertype and provide no protection for UDP transports" }}
{{- end }}
{{- if and .Values.ptp4l.grandmasterAllowList.enabled (gt (len .Values.ptp4l.grandmasterAllowList.allowedSourceMacs) 99) }}
{{- fail "ptp4l.grandmasterAllowList.allowedSourceMacs supports at most 99 entries (tc filter preferences 38000-38098; 38099 is reserved for the drop rule)" }}
{{- end }}
{{- $gmAllowListInterface := default ((split ";" .Values.interfaceNameList)._0) .Values.ptp4l.grandmasterAllowList.interface }}

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "linuxptp.fullname" . }}
  labels:
    {{- include "linuxptp.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "linuxptp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "linuxptp.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "linuxptp.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      hostNetwork: true
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "linuxptp.configmapName" . }}
        - name: ts2phc-config-volume
          configMap:
            name: {{ include "linuxptp.ts2phcConfigmapName" . }}
        - name: ts2phc-leapseconds-volume
          configMap:
            name: {{ include "linuxptp.ts2phcLeapfileConfigmapName" . }}
        - name: entrypoint-volume-ts2phc
          configMap:
            name: {{ include "linuxptp.ts2phcEntrypointConfigmapName" . }}
            defaultMode: 0777
        - name: entrypoint-volume-phc2sys
          configMap:
            name: {{ include "linuxptp.phc2sysEntrypointConfigmapName" . }}
            defaultMode: 0777
        - name: ptp4l-run-volume
          hostPath:
            path: "/var/run"
        - name: dev
          hostPath:
            path: "/dev"
        {{- if .Values.ptp4l.authentication.enabled }}
        - name: linuxptp-sa
          secret:
            secretName: {{ required "ptp4l.authentication.existingSecret is required when authentication.enabled=true" .Values.ptp4l.authentication.existingSecret }}
            items:
              - key: {{ .Values.ptp4l.authentication.secretKey }}
                path: {{ base .Values.ptp4l.authentication.saFile }}
            defaultMode: 0400
        {{- end }}
      containers:
        - name: {{ .Chart.Name }}-ptp4l
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          command: [ "/usr/local/bin/entrypoint-ptp4l.sh" ]
          args:
            {{- $ifaces := split ";" .Values.interfaceNameList }}
            {{- range $ifaces }}
            - "-i"
            - "{{ . }}"
            {{- end }}
            - "-f"
            - "/etc/config/linuxptp.cfg"
            - "-m"
          env:
            - name: PTP4L_OFFSET_LIMIT
              value: "{{ .Values.ptp4l.offsetLimitNs }}"
            {{- if .Values.ptp4l.grandmasterAllowList.enabled }}
            - name: PTP4L_GM_ALLOWLIST_ENABLED
              value: "true"
            - name: PTP4L_GM_ALLOWLIST_MODE
              value: {{ .Values.ptp4l.grandmasterAllowList.mode | quote }}
            - name: PTP4L_GM_ALLOWLIST_INTERFACE
              value: {{ $gmAllowListInterface | quote }}
            - name: PTP4L_GM_ALLOWLIST_PTP_ETHERTYPE
              value: {{ .Values.ptp4l.grandmasterAllowList.ptpEthertype | quote }}
            - name: PTP4L_GM_ALLOWLIST_ALLOWED_SOURCE_MACS
              value: {{ join "," .Values.ptp4l.grandmasterAllowList.allowedSourceMacs | quote }}
            {{- end }}
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config
            - name: ptp4l-run-volume
              mountPath: "/var/run"
              readOnly: false
            {{- if .Values.ptp4l.authentication.enabled }}
            - name: linuxptp-sa
              mountPath: {{ .Values.ptp4l.authentication.mountPath }}
              readOnly: true
            {{- end }}
          {{- if and (.Values.livenessProbe.enabled) (ne (default "0" (.Values.config.serverOnly | toString)) "1") }}
          livenessProbe:
            exec:
              command:
              - cat
              - /tmp/ptp4l-healthy
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          {{- end }}
          {{- if and (.Values.startupProbe.enabled) (ne (default "0" (.Values.config.serverOnly | toString)) "1") }}
          startupProbe:
            exec:
              command:
              - cat
              - /tmp/ptp4l-healthy
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
          {{- end }}
          {{- if and (.Values.readinessProbe.enabled) (ne (default "0" (.Values.config.serverOnly | toString)) "1") }}
          readinessProbe:
            exec:
              command:
              - cat
              - /tmp/ptp4l-healthy
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          {{- end }}
        - name: {{ .Chart.Name }}-phc2sys
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          command:
            - "/etc/entrypoint/entrypoint-phc2sys.sh"
          args:
            - {{ (split ";" .Values.interfaceNameList)._0 }}
            {{- if .Values.ntp.enabled }}
            - "{{ .Values.ntp.server }}"
            {{- end }}
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config
            - name: entrypoint-volume-phc2sys
              mountPath: /etc/entrypoint
            - name: ptp4l-run-volume
              mountPath: "/var/run"
              readOnly: false
            {{- if .Values.ptp4l.authentication.enabled }}
            # phc2sys parses the same linuxptp.cfg and calls sad_create(), which
            # fails hard when the configured sa_file is missing
            - name: linuxptp-sa
              mountPath: {{ .Values.ptp4l.authentication.mountPath }}
              readOnly: true
            {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            exec:
              command:
              - cat
              - /tmp/phc2sys-healthy
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            exec:
              command:
              - cat
              - /tmp/phc2sys-healthy
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            exec:
              command:
              - cat
              - /tmp/phc2sys-healthy
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          {{- end }}
        {{- if .Values.config.ts2phc.enabled }}
        - name: {{ .Chart.Name }}-ts2phc
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          command: [ "/etc/entrypoint/entrypoint-ts2phc.sh" ]
          args:
            - {{ (split ";" .Values.interfaceNameList)._0 }}
          volumeMounts:
            - name: ts2phc-config-volume
              mountPath: /etc/config
            - name: entrypoint-volume-ts2phc
              mountPath: /etc/entrypoint
            - name: ts2phc-leapseconds-volume
              mountPath: /etc/leapseconds
            - name: ptp4l-run-volume
              mountPath: "/var/run"
              readOnly: false
            - name: dev
              mountPath: /dev
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            exec:
              command:
              - cat
              - /tmp/ts2phc-healthy
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            exec:
              command:
              - cat
              - /tmp/ts2phc-healthy
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            exec:
              command:
              - cat
              - /tmp/ts2phc-healthy
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          {{- end }}
        {{- end }}
      priorityClassName: system-node-critical
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
