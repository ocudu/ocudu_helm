{{- if and .Values.ptp4l.authentication.enabled (not .Values.ptp4l.authentication.existingSecret) }}
{{- fail "ptp4l.authentication.existingSecret must be set when ptp4l.authentication.enabled=true" }}
{{- end }}
{{- if and .Values.ptp4l.authentication.enabled (ne (int .Values.ptp4l.authentication.ptpMinorVersion) 1) }}
{{- fail "ptp4l.authentication.ptpMinorVersion must be 1: Authentication TLV requires PTPv2.1" }}
{{- end }}
{{- if and .Values.ptp4l.authentication.enabled (ne (toString (.Values.config.ignore_source_id | default 0)) "0") }}
{{- fail "config.ignore_source_id must be 0 when ptp4l.authentication.enabled=true" }}
{{- end }}
{{- if and .Values.ptp4l.authentication.enabled (or (lt (int .Values.ptp4l.authentication.spp) 0) (gt (int .Values.ptp4l.authentication.spp) 255)) }}
{{- fail "ptp4l.authentication.spp must be between 0 and 255" }}
{{- end }}
{{- if and .Values.ptp4l.authentication.enabled (lt (int .Values.ptp4l.authentication.activeKeyId) 1) }}
{{- fail "ptp4l.authentication.activeKeyId must be 1 or higher" }}
{{- end }}
{{- if and .Values.ptp4l.authentication.enabled (has (.Values.config.time_stamping | default "hardware") (list "onestep" "p2p1step")) }}
{{- fail "ptp4l.authentication does not support one-step time stamping (config.time_stamping)" }}
{{- end }}
{{- if and .Values.ptp4l.authentication.enabled (ne (dir .Values.ptp4l.authentication.saFile) (clean .Values.ptp4l.authentication.mountPath)) }}
{{- fail "ptp4l.authentication.saFile must be a file in ptp4l.authentication.mountPath" }}
{{- end }}
{{- if lt (int .Values.ptp4l.meanPathDelayLimitNs) 0 }}
{{- fail "ptp4l.meanPathDelayLimitNs must not be negative" }}
{{- end }}

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "linuxptp.fullname" . }}
  labels:
    {{- include "linuxptp.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "linuxptp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "linuxptp.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "linuxptp.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      hostNetwork: true
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "linuxptp.configmapName" . }}
        - name: ts2phc-config-volume
          configMap:
            name: {{ include "linuxptp.ts2phcConfigmapName" . }}
        - name: ts2phc-leapseconds-volume
          configMap:
            name: {{ include "linuxptp.ts2phcLeapfileConfigmapName" . }}
        - name: entrypoint-volume-ts2phc
          configMap:
            name: {{ include "linuxptp.ts2phcEntrypointConfigmapName" . }}
            defaultMode: 0777
        - name: entrypoint-volume-phc2sys
          configMap:
            name: {{ include "linuxptp.phc2sysEntrypointConfigmapName" . }}
            defaultMode: 0777
        - name: ptp4l-run-volume
          hostPath:
            path: "/var/run"
        - name: dev
          hostPath:
            path: "/dev"
        {{- if .Values.ptp4l.authentication.enabled }}
        - name: linuxptp-sa
          secret:
            secretName: {{ required "ptp4l.authentication.existingSecret is required when authentication.enabled=true" .Values.ptp4l.authentication.existingSecret }}
            items:
              - key: {{ .Values.ptp4l.authentication.secretKey }}
                path: {{ base .Values.ptp4l.authentication.saFile }}
            defaultMode: 0400
        {{- end }}
      containers:
        - name: {{ .Chart.Name }}-ptp4l
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          command: [ "/usr/local/bin/entrypoint-ptp4l.sh" ]
          args:
            {{- $ifaces := split ";" .Values.interfaceNameList }}
            {{- range $ifaces }}
            - "-i"
            - "{{ . }}"
            {{- end }}
            - "-f"
            - "/etc/config/linuxptp.cfg"
            - "-m"
          env:
            - name: PTP4L_OFFSET_LIMIT
              value: "{{ .Values.ptp4l.offsetLimitNs }}"
            {{- if .Values.ptp4l.meanPathDelayLimitNs }}
            - name: PTP4L_MEAN_PATH_DELAY_LIMIT
              value: "{{ int .Values.ptp4l.meanPathDelayLimitNs }}"
            {{- end }}
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config
            - name: ptp4l-run-volume
              mountPath: "/var/run"
              readOnly: false
            {{- if .Values.ptp4l.authentication.enabled }}
            - name: linuxptp-sa
              mountPath: {{ .Values.ptp4l.authentication.mountPath }}
              readOnly: true
            {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            exec:
              command:
              - cat
              - /tmp/ptp4l-alive
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if and (.Values.startupProbe.enabled) (ne (default "0" (.Values.config.serverOnly | toString)) "1") }}
          startupProbe:
            exec:
              command:
              - cat
              - /tmp/ptp4l-healthy
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
          {{- end }}
          {{- if and (.Values.readinessProbe.enabled) (ne (default "0" (.Values.config.serverOnly | toString)) "1") }}
          readinessProbe:
            exec:
              command:
              - cat
              - /tmp/ptp4l-healthy
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
          {{- end }}
        - name: {{ .Chart.Name }}-phc2sys
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          command:
            - "/etc/entrypoint/entrypoint-phc2sys.sh"
          args:
            - {{ (split ";" .Values.interfaceNameList)._0 }}
            {{- if .Values.ntp.enabled }}
            - "{{ .Values.ntp.server }}"
            {{- end }}
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config
            - name: entrypoint-volume-phc2sys
              mountPath: /etc/entrypoint
            - name: ptp4l-run-volume
              mountPath: "/var/run"
              readOnly: false
            {{- if .Values.ptp4l.authentication.enabled }}
            # phc2sys parses the same linuxptp.cfg and calls sad_create(), which
            # fails hard when the configured sa_file is missing
            - name: linuxptp-sa
              mountPath: {{ .Values.ptp4l.authentication.mountPath }}
              readOnly: true
            {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            exec:
              command:
              - cat
              - /tmp/phc2sys-alive
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            exec:
              command:
              - cat
              - /tmp/phc2sys-healthy
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            exec:
              command:
              - cat
              - /tmp/phc2sys-healthy
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
          {{- end }}
        {{- if .Values.config.ts2phc.enabled }}
        - name: {{ .Chart.Name }}-ts2phc
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          command: [ "/etc/entrypoint/entrypoint-ts2phc.sh" ]
          args:
            - {{ (split ";" .Values.interfaceNameList)._0 }}
          volumeMounts:
            - name: ts2phc-config-volume
              mountPath: /etc/config
            - name: entrypoint-volume-ts2phc
              mountPath: /etc/entrypoint
            - name: ts2phc-leapseconds-volume
              mountPath: /etc/leapseconds
            - name: ptp4l-run-volume
              mountPath: "/var/run"
              readOnly: false
            - name: dev
              mountPath: /dev
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            exec:
              command:
              - cat
              - /tmp/ts2phc-alive
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            exec:
              command:
              - cat
              - /tmp/ts2phc-healthy
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            exec:
              command:
              - cat
              - /tmp/ts2phc-healthy
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
          {{- end }}
        {{- end }}
      priorityClassName: system-node-critical
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
