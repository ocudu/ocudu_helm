include:
  - local: .gitlab/ci/helm_utils.yml
  # CNTi Test Suite essential tests of the chart: install it on a kind cluster
  # on the runner without a core network and run the essential tests.
  - component: $CI_SERVER_FQDN/lfn-cnti/testsuite-component/cnti-testsuite@1.2.0
    inputs:
      stage: static
      version: v2.2.0
      cnf_config: .gitlab/cnti/ocudu-cu-cp/cnti-testsuite.yaml
      install_timeout: "900"
      # Runs on main publish the badge to the package registry under this name.
      badge_name: ocudu-cu-cp
      # The CU-CP opens SCTP listeners (F1-C, E1) at startup and exits when the
      # kernel has no SCTP; only the on-prem runners have the module loaded.
      runner_tags: [on-prem-linux-amd64, sctp]

stages:
  - static
  - publish

# Each chart runs the component's job under its own name, which tells the
# charts' CNTi jobs apart across the pipeline.
# The component's job has no rules of its own, and a job without rules does
# not run in merge request pipelines. Run it on merge requests and on main.
cnti-testsuite:
  rules:
    - when: never

# The CU and CU-CP runs both land on the few on-prem runners with SCTP, and two
# kind clusters on one host fail to come up. Run one at a time, across pipelines.
cnti-testsuite-cu-cp:
  extends: [cnti-testsuite, .cnti diagnostics, .cnti runner setup]
  resource_group: cnti-sctp
  rules:
    - if: $ON_MR
    - if: $ON_DEFAULT_BRANCH

helm lint:
  extends: .helm lint
  variables:
    CHART_PATH: charts/ocudu-cu-cp

# The default values leave the ipsec sidecar off, so the job above never renders any of it.
helm lint ipsec:
  extends: .helm lint
  variables:
    CHART_PATH: charts/ocudu-cu-cp
    LINT_VALUES_FILE: charts/ocudu-cu-cp/ci/lint-values-ipsec.yaml

helm version check:
  extends: .helm version check
  variables:
    CHART_PATH: charts/ocudu-cu-cp
    CHART_NAME: ocudu-cu-cp

helm publish-dev:
  extends: .helm publish-dev
  variables:
    CHART_PATH: charts/ocudu-cu-cp
    CHART_NAME: ocudu-cu-cp
  needs:
    - job: helm lint
    - job: helm lint ipsec
    - job: helm version check

helm publish-prod:
  extends: .helm publish-prod
  variables:
    CHART_PATH: charts/ocudu-cu-cp
    CHART_NAME: ocudu-cu-cp
