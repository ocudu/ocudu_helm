# Minimal values for linting the IPsec path. `ipsec.enabled` is false in the shipped
# defaults, so without this file none of the IPsec templates is ever rendered and none of
# the render-time guards is ever reached.
#
# This is a lint fixture, not a deployment example. The application config below carries
# only the keys the guards read; `docs/ipsec.md` has the worked example.
#
# cert-manager stays off on purpose: its custom resource definitions have no schema here,
# and an unknown kind fails the manifest check.

# Both publish an unprotected path to the pod address, so the chart refuses to render
# while either is on. n2Service stays enabled: N2 is not protected here, so its service is
# not a bypass of anything.
f1cService:
  enabled: false
e1Service:
  enabled: false

networkPolicy:
  enabled: true

ipsec:
  enabled: true
  certSecret: ocudu-cu-cp-ipsec
  localId: cu-cp.example.com
  # Two peers, which is the case this chart exists to cover: the DU brings F1-C and the
  # CU-UP brings E1, and they are different pods with different identities.
  peers:
    du:
      id: du.example.com
      # No address on either: the CU-CP is the side both others dial.
    cuup:
      id: cu-up.example.com
    xn:
      id: gnb-b.example.com
      # Set, so this side starts the Xn connection. The peer leaves it empty and waits,
      # with `cu_cp.xnap.no_connection_init` set to match.
      address: ocudu-gnb-ipsec
  connections:
    f1c:
      peer: du
      protocol: sctp
      local: 100.64.10.1
      remote: 100.64.10.2
    e1:
      peer: cuup
      protocol: sctp
      local: 100.64.20.1
      remote: 100.64.20.2
    xnc:
      peer: xn
      protocol: sctp
      local: 100.64.40.1
      remote: 100.64.40.2

config:
  cu-cp-config.yml: |-
    cu_cp:
      e1ap:
        bind_addrs: 100.64.20.1

      f1ap:
        bind_addrs: 100.64.10.1

      # Xn-C is shaped as a list of gateways, each with a list of peer connections, and
      # the addresses inside are lists too. Written here in that form on purpose: an
      # address on its own line is checked the same as one written beside its key.
      xnap:
        gateways:
          - bind_addrs:
              - 100.64.40.1
            connections:
              - peer_addrs:
                  - 100.64.40.2
