apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ocudu-cu-cp.fullname" . }}
  labels:
    {{- include "ocudu-cu-cp.labels" . | nindent 4 }}
  annotations:
    description: "Network policy for CU-CP (only effective when hostNetwork: false)"
spec:
  podSelector:
    matchLabels:
      {{- include "ocudu-cu-cp.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    {{- if .Values.networkPolicy.ingress.fiveGCore.enabled }}
    {{- if and .Values.ipsec.enabled .Values.ipsec.protectN2 }}
    # With N2 protected, the core may exchange nothing but the tunnel itself. The
    # plaintext N2 port is deliberately absent here.
    - from:
      {{- toYaml .Values.networkPolicy.ingress.fiveGCore.from | nindent 6 }}
      {{- if eq .Values.ipsec.encapsulation "udp" }}
      ports:
        {{- if not .Values.ipsec.ikeOnNatTPortOnly }}
        - protocol: UDP
          port: 500   # IKE
        {{- end }}
        - protocol: UDP
          port: 4500  # IKE, and ESP once either end is behind address translation
      {{- else }}
      # Native ESP is IP protocol 50, and a policy can only name TCP, UDP and SCTP, so
      # this rule has to permit every protocol to the peer — including the plaintext
      # ports. That is the cost of `native`, and why `udp` is the default.
      {{- end }}
    {{- else }}
    # Allow traffic from 5G core (N2 interface)
    - from:
      {{- toYaml .Values.networkPolicy.ingress.fiveGCore.from | nindent 6 }}
      ports:
        - protocol: SCTP
          port: 38412  # N2 interface (NGAP)
    {{- end }}
    {{- end }}

    {{- if .Values.networkPolicy.ingress.cuUp.enabled }}
    {{- if .Values.ipsec.enabled }}
    # With IPsec on, the peer may exchange nothing but the tunnel itself. The plaintext
    # E1 port is deliberately absent here: leaving it open would keep alive the
    # exact path this feature exists to close.
    - from:
      {{- toYaml .Values.networkPolicy.ingress.cuUp.from | nindent 6 }}
      {{- if eq .Values.ipsec.encapsulation "udp" }}
      ports:
        {{- if not .Values.ipsec.ikeOnNatTPortOnly }}
        - protocol: UDP
          port: 500   # IKE
        {{- end }}
        - protocol: UDP
          port: 4500  # IKE, and ESP once either end is behind address translation
      {{- else }}
      # Native ESP is IP protocol 50, and a policy can only name TCP, UDP and SCTP, so
      # this rule has to permit every protocol to the peer — including the plaintext
      # ports. That is the cost of `native`, and why `udp` is the default.
      {{- end }}
    {{- else }}
    # Allow traffic from CU-UP (E1 interface)
    - from:
      {{- toYaml .Values.networkPolicy.ingress.cuUp.from | nindent 6 }}
      ports:
        - protocol: SCTP
          port: 38462  # E1 interface (E1AP)
    {{- end }}
    {{- end }}

    {{- if .Values.networkPolicy.ingress.du.enabled }}
    {{- if .Values.ipsec.enabled }}
    # With IPsec on, the peer may exchange nothing but the tunnel itself. The plaintext
    # F1-C port is deliberately absent here: leaving it open would keep alive the
    # exact path this feature exists to close.
    - from:
      {{- toYaml .Values.networkPolicy.ingress.du.from | nindent 6 }}
      {{- if eq .Values.ipsec.encapsulation "udp" }}
      ports:
        {{- if not .Values.ipsec.ikeOnNatTPortOnly }}
        - protocol: UDP
          port: 500   # IKE
        {{- end }}
        - protocol: UDP
          port: 4500  # IKE, and ESP once either end is behind address translation
      {{- else }}
      # Native ESP is IP protocol 50, and a policy can only name TCP, UDP and SCTP, so
      # this rule has to permit every protocol to the peer — including the plaintext
      # ports. That is the cost of `native`, and why `udp` is the default.
      {{- end }}
    {{- else }}
    # Allow traffic from DU (F1-C interface)
    - from:
      {{- toYaml .Values.networkPolicy.ingress.du.from | nindent 6 }}
      ports:
        - protocol: SCTP
          port: 38472  # F1-C interface (F1AP)
    {{- end }}
    {{- end }}

    {{- if .Values.networkPolicy.ingress.xn.enabled }}
    {{- if .Values.ipsec.enabled }}
    # With IPsec on, the peer may exchange nothing but the tunnel itself. The plaintext
    # Xn ports are deliberately absent here: leaving them open would keep alive the
    # exact path this feature exists to close.
    - from:
      {{- toYaml .Values.networkPolicy.ingress.xn.from | nindent 6 }}
      {{- if eq .Values.ipsec.encapsulation "udp" }}
      ports:
        {{- if not .Values.ipsec.ikeOnNatTPortOnly }}
        - protocol: UDP
          port: 500   # IKE
        {{- end }}
        - protocol: UDP
          port: 4500  # IKE, and ESP once either end is behind address translation
      {{- else }}
      # Native ESP is IP protocol 50, and a policy can only name TCP, UDP and SCTP, so
      # this rule has to permit every protocol to the peer — including the plaintext
      # ports. That is the cost of `native`, and why `udp` is the default.
      {{- end }}
    {{- else }}
    # Allow traffic from an Xn peer (Xn-C)
    - from:
      {{- toYaml .Values.networkPolicy.ingress.xn.from | nindent 6 }}
      ports:
        - protocol: SCTP
          port: 38422  # Xn-C (XnAP)
    {{- end }}
    {{- end }}

    {{- if and .Values.metricsService.enabled .Values.networkPolicy.ingress.monitoring.enabled }}
    # Allow traffic from monitoring systems (Telegraf)
    - from:
      {{- toYaml .Values.networkPolicy.ingress.monitoring.from | nindent 6 }}
      ports:
        - protocol: TCP
          port: {{ .Values.metricsService.port }}
    {{- end }}

    {{- range .Values.networkPolicy.ingress.custom }}
    # Custom ingress rule
    - {{ toYaml . | nindent 6 }}
    {{- end }}

  egress:
    {{- if .Values.networkPolicy.egress.fiveGCore.enabled }}
    {{- if and .Values.ipsec.enabled .Values.ipsec.protectN2 }}
    # With N2 protected, the core may exchange nothing but the tunnel itself. The
    # plaintext N2 port is deliberately absent here.
    - to:
      {{- toYaml .Values.networkPolicy.egress.fiveGCore.to | nindent 6 }}
      {{- if eq .Values.ipsec.encapsulation "udp" }}
      ports:
        {{- if not .Values.ipsec.ikeOnNatTPortOnly }}
        - protocol: UDP
          port: 500   # IKE
        {{- end }}
        - protocol: UDP
          port: 4500  # IKE, and ESP once either end is behind address translation
      {{- else }}
      # Native ESP is IP protocol 50, and a policy can only name TCP, UDP and SCTP, so
      # this rule has to permit every protocol to the peer — including the plaintext
      # ports. That is the cost of `native`, and why `udp` is the default.
      {{- end }}
    {{- else }}
    # Allow traffic to 5G core (N2)
    - to:
      {{- toYaml .Values.networkPolicy.egress.fiveGCore.to | nindent 6 }}
      ports:
        - protocol: SCTP
          port: 38412  # N2 (NGAP)
    {{- end }}
    {{- end }}

    {{- if .Values.networkPolicy.egress.cuUp.enabled }}
    {{- if .Values.ipsec.enabled }}
    # With IPsec on, the peer may exchange nothing but the tunnel itself. The plaintext
    # E1 port is deliberately absent here: leaving it open would keep alive the
    # exact path this feature exists to close.
    - to:
      {{- toYaml .Values.networkPolicy.egress.cuUp.to | nindent 6 }}
      {{- if eq .Values.ipsec.encapsulation "udp" }}
      ports:
        {{- if not .Values.ipsec.ikeOnNatTPortOnly }}
        - protocol: UDP
          port: 500   # IKE
        {{- end }}
        - protocol: UDP
          port: 4500  # IKE, and ESP once either end is behind address translation
      {{- else }}
      # Native ESP is IP protocol 50, and a policy can only name TCP, UDP and SCTP, so
      # this rule has to permit every protocol to the peer — including the plaintext
      # ports. That is the cost of `native`, and why `udp` is the default.
      {{- end }}
    {{- else }}
    # Allow traffic to CU-UP (E1)
    - to:
      {{- toYaml .Values.networkPolicy.egress.cuUp.to | nindent 6 }}
      ports:
        - protocol: SCTP
          port: 38462  # E1 (E1AP)
    {{- end }}
    {{- end }}

    {{- if .Values.networkPolicy.egress.du.enabled }}
    {{- if .Values.ipsec.enabled }}
    # With IPsec on, the peer may exchange nothing but the tunnel itself. The plaintext
    # F1-C port is deliberately absent here: leaving it open would keep alive the
    # exact path this feature exists to close.
    - to:
      {{- toYaml .Values.networkPolicy.egress.du.to | nindent 6 }}
      {{- if eq .Values.ipsec.encapsulation "udp" }}
      ports:
        {{- if not .Values.ipsec.ikeOnNatTPortOnly }}
        - protocol: UDP
          port: 500   # IKE
        {{- end }}
        - protocol: UDP
          port: 4500  # IKE, and ESP once either end is behind address translation
      {{- else }}
      # Native ESP is IP protocol 50, and a policy can only name TCP, UDP and SCTP, so
      # this rule has to permit every protocol to the peer — including the plaintext
      # ports. That is the cost of `native`, and why `udp` is the default.
      {{- end }}
    {{- else }}
    # Allow traffic to DU (F1-C)
    - to:
      {{- toYaml .Values.networkPolicy.egress.du.to | nindent 6 }}
      ports:
        - protocol: SCTP
          port: 38472  # F1-C (F1AP)
    {{- end }}
    {{- end }}

    {{- if .Values.networkPolicy.egress.xn.enabled }}
    {{- if .Values.ipsec.enabled }}
    # With IPsec on, the peer may exchange nothing but the tunnel itself. The plaintext
    # Xn ports are deliberately absent here: leaving them open would keep alive the
    # exact path this feature exists to close.
    - to:
      {{- toYaml .Values.networkPolicy.egress.xn.to | nindent 6 }}
      {{- if eq .Values.ipsec.encapsulation "udp" }}
      ports:
        {{- if not .Values.ipsec.ikeOnNatTPortOnly }}
        - protocol: UDP
          port: 500   # IKE
        {{- end }}
        - protocol: UDP
          port: 4500  # IKE, and ESP once either end is behind address translation
      {{- else }}
      # Native ESP is IP protocol 50, and a policy can only name TCP, UDP and SCTP, so
      # this rule has to permit every protocol to the peer — including the plaintext
      # ports. That is the cost of `native`, and why `udp` is the default.
      {{- end }}
    {{- else }}
    # Allow traffic to an Xn peer (Xn-C)
    - to:
      {{- toYaml .Values.networkPolicy.egress.xn.to | nindent 6 }}
      ports:
        - protocol: SCTP
          port: 38422  # Xn-C (XnAP)
    {{- end }}
    {{- end }}

    {{- if .Values.networkPolicy.egress.dnsTo }}
    # Allow DNS resolution
    - to:
        {{- toYaml .Values.networkPolicy.egress.dnsTo | nindent 8 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- else }}
    # Allow DNS resolution. No destination is named, so this is port 53 to anywhere.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}

    {{- if .Values.networkPolicy.egress.monitoring.enabled }}
    # Allow traffic to monitoring systems
    - to:
      {{- toYaml .Values.networkPolicy.egress.monitoring.to | nindent 6 }}
      ports:
        - protocol: TCP
          port: 8086  # InfluxDB
    {{- end }}

    {{- range .Values.networkPolicy.egress.custom }}
    # Custom egress rule
    - {{ toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
