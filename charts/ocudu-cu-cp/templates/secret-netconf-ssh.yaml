{{- $ssh := ((.Values.o1).netconfServer).ssh | default dict }}
{{- if and (.Values.o1).enable_ocudu_o1 $ssh.username (not $ssh.passwordSecret) }}
{{- $name := include "ocudu-cu-cp.netconfSshCredentialsSecretName" . }}
{{- $password := $ssh.password }}
{{- if not $password }}
{{- $password = dig "data" "password" "" (lookup "v1" "Secret" .Release.Namespace $name) | b64dec }}
{{- end }}
{{- if not $password }}
{{- $password = randAlphaNum 32 }}
{{- end }}

# SPDX-FileCopyrightText: Copyright (C) 2021-2026 Software Radio Systems Limited
# SPDX-License-Identifier: BSD-3-Clause-Open-MPI

# The chart's own Secret, used when o1.netconfServer.ssh.passwordSecret is empty.
# Without o1.netconfServer.ssh.password it holds a random password, generated on
# install and read back from the existing Secret on upgrade. Production should pass
# a pre-provisioned Secret via passwordSecret, keeping the password out of the
# chart's values and helm metadata entirely.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ocudu-cu-cp.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ $password | quote }}
{{- end }}
