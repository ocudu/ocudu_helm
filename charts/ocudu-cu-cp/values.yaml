# -- Container image configuration
image:
  # -- Container image repository
  repository: registry.gitlab.com/ocudu/ocudu/images/cu-cp
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image tag. Always quote in values files — tags like ubuntu-24.04-avx2-20260624_2b3cf68e are parsed as floats by YAML.
  # @default -- Chart appVersion
  tag: ""

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- Override the name of the chart
nameOverride: ""

# -- Override the full name of resources
fullnameOverride: ""

# -- ConfigMap name overrides
configmap:
  main: { nameOverride: "" }
  entrypoint: { nameOverride: "" }

# -- Service account configuration
serviceAccount:
  create: true
  annotations: {}
  name: ""

# -- RBAC configuration
rbac:
  create: true
  extraRules: []

# -- Pod Disruption Budget configuration
podDisruptionBudget:
  enabled: true
  minAvailable: 0
  unhealthyPodEvictionPolicy: AlwaysAllow

# -- Additional pod annotations
podAnnotations: {}

# -- Extra labels applied to the Deployment and Pod template
extraLabels: {}

# -- CU-CP liveness probe configuration
livenessProbe:
  enabled: true
  initialDelaySeconds: 90
  periodSeconds: 30
  timeoutSeconds: 1
  failureThreshold: 3
  successThreshold: 1

# -- CU-CP readiness probe configuration
readinessProbe:
  enabled: true
  initialDelaySeconds: 15
  periodSeconds: 5
  timeoutSeconds: 1
  failureThreshold: 30
  successThreshold: 1

# -- Pod-level security context. Runs the container as a non-root user by default.
# @default -- see below
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# -- Container-level security context
securityContext:
  allowPrivilegeEscalation: true
  privileged: false
  capabilities:
    drop: ["ALL"]
    add:
      - SYS_NICE
      - IPC_LOCK

# -- Resource requests and limits
resources: {}

# -- Network configuration
network:
  # -- Enable host network mode
  # false (default): Uses CNI network (NetworkPolicy supported)
  # true: Uses host network namespace directly (NetworkPolicy NOT supported)
  # @default -- `false`
  hostNetwork: false

# -- Node selector for pod assignment
nodeSelector: {}

# -- Tolerations for pod assignment
tolerations: {}

# -- Pod affinity configuration
affinity: {}

# -- Metrics service configuration
# Exposes CU-CP metrics endpoint for Telegraf collection
metricsService:
  # -- Enable metrics service
  enabled: false
  # -- Enable power consumption metrics via RAPL
  # @default -- `false`
  powercap:
    enabled: false
  # -- Service type (ClusterIP, NodePort, or LoadBalancer)
  # @default -- `ClusterIP`
  type: ClusterIP
  # -- LoadBalancer IP address (optional, when type is LoadBalancer)
  # @default -- `""` (auto-assign)
  loadBalancerIP: ""
  # -- LoadBalancer class (optional, for clusters with multiple LB implementations)
  # @default -- `""` (use default)
  loadBalancerClass: ""
  # -- External traffic policy (Cluster or Local)
  # @default -- `Cluster`
  externalTrafficPolicy: Cluster
  # -- Session affinity (None or ClientIP)
  # @default -- `None`
  sessionAffinity: None
  # -- NodePort (optional, only used when type is NodePort)
  # @default -- `""` (auto-assign)
  nodePort: ""
  # -- Service port (must match the port in cu-cp-config.yml)
  port: 8001
  # -- Target port (container port)
  targetPort: 8001

# -- N2 service configuration (NGAP toward AMF, SCTP port 38412)
n2Service:
  # -- Enable N2 service
  enabled: true
  # -- Service type (ClusterIP, NodePort, or LoadBalancer)
  # @default -- `ClusterIP`
  type: ClusterIP
  loadBalancerIP: ""
  loadBalancerClass: ""
  externalTrafficPolicy: Cluster
  sessionAffinity: None
  nodePort: ""
  # -- Service port
  port: 38412

# -- E1 service configuration (E1AP toward CU-UP, SCTP port 38462)
e1Service:
  # -- Enable E1 service
  enabled: false
  # -- Service type (ClusterIP, NodePort, or LoadBalancer)
  # @default -- `ClusterIP`
  type: ClusterIP
  loadBalancerIP: ""
  loadBalancerClass: ""
  externalTrafficPolicy: Cluster
  sessionAffinity: None
  nodePort: ""
  # -- Service port
  port: 38462

# -- F1-C service configuration (F1AP toward DU, SCTP port 38472)
f1cService:
  # -- Enable F1-C service
  enabled: true
  # -- Service type (ClusterIP, NodePort, or LoadBalancer)
  # @default -- `ClusterIP`
  type: ClusterIP
  loadBalancerIP: ""
  loadBalancerClass: ""
  externalTrafficPolicy: Cluster
  sessionAffinity: None
  nodePort: ""
  # -- Service port
  port: 38472

# -- NetworkPolicy configuration
# Restricts network traffic to/from the CU-CP pod for enhanced security.
# IMPORTANT: NetworkPolicy only works when network.hostNetwork is false.
networkPolicy:
  # -- Enable NetworkPolicy (only effective when network.hostNetwork is false)
  # @default -- `false`
  enabled: false

  ingress:
    # -- Allow ingress from 5G core (N2/NGAP)
    fiveGCore:
      enabled: true
      from:
        - ipBlock:
            cidr: 10.0.0.0/8
    # -- Allow ingress from CU-UP (E1AP)
    cuUp:
      enabled: true
      from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ocudu-cu-up
        - ipBlock:
            cidr: 10.0.0.0/8
    # -- Allow ingress from DU (F1-C/F1AP)
    du:
      enabled: true
      from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ocudu-du
        - ipBlock:
            cidr: 10.0.0.0/8
    # -- Allow ingress from monitoring systems
    monitoring:
      enabled: true
      from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
        - podSelector:
            matchLabels:
              app: telegraf
    # -- Custom ingress rules
    custom: []

  egress:
    # -- Allow egress to 5G core (N2/NGAP)
    fiveGCore:
      enabled: true
      to:
        - ipBlock:
            cidr: 10.0.0.0/8
    # -- Allow egress to CU-UP (E1AP)
    cuUp:
      enabled: true
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ocudu-cu-up
        - ipBlock:
            cidr: 10.0.0.0/8
    # -- Allow egress to DU (F1-C/F1AP)
    du:
      enabled: true
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ocudu-du
        - ipBlock:
            cidr: 10.0.0.0/8
    # -- Allow egress to monitoring systems
    monitoring:
      enabled: true
      to:
        - namespaceSelector:
            matchLabels:
              name: monitoring
        - podSelector:
            matchLabels:
              app: influxdb
    # -- Custom egress rules
    custom: []

# -- Persistent storage configuration
persistence:
  enabled: true
  # -- Storage type: "pvc" or "hostPath"
  type: hostPath
  pvc:
    storageClassName: ""
    accessMode: ReadWriteOnce
    size: 10Gi
  hostPath:
    path: "/mnt/debugging-logs"
    type: DirectoryOrCreate
  mountPath: "/var/log/ocudu"
  preserveOldLogs: false

# -- CU-CP configuration file
config:
  cu-cp-config.yml: |-
    cu_cp:
      amf:
        addrs: 127.0.1.100
        bind_addrs: 127.0.0.1
        supported_tracking_areas:
          - tac: 7
            plmn_list:
              - plmn: "00101"
                tai_slice_support_list:
                  - sst: 1
      e1ap:
        bind_addrs: 127.0.20.1
      f1ap:
        bind_addrs: 127.0.10.1

    log:
      filename: /var/log/ocudu/cu_cp.log
      all_level: warning

    pcap:
      ngap_enable: false
      ngap_filename: /var/log/ocudu/cu_cp_ngap.pcap
      f1ap_enable: false
      f1ap_filename: /var/log/ocudu/cu_cp_f1ap.pcap
      e1ap_enable: false
      e1ap_filename: /var/log/ocudu/cu_cp_e1ap.pcap
