# -- Container image configuration
image:
  # -- Container image repository
  repository: registry.gitlab.com/ocudu/ocudu/images/cu-cp
  # -- Image pull policy. `Always`, because the default tag moves
  pullPolicy: Always
  # -- Image tag, `ubuntu-24.04-<avx512|avx2|neon>-latest`: the newest nightly build. Pin a
  # `-<date>_<commit>` or `-<date>_<commit>-stable` tag in production. Pick the CPU variant
  # the node supports. Always quote in values files.
  tag: "ubuntu-24.04-avx2-latest"

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- Number of CU-CP replicas
# The CU-CP is stateful and instances do not coordinate with each other — keep
# this at 1 unless running several CU-CPs behind the same Services has been
# validated.
replicaCount: 1

# -- Override the name of the chart
nameOverride: ""

# -- Override the full name of resources
fullnameOverride: ""

# -- ConfigMap name overrides
configmap:
  main: { nameOverride: "" }
  entrypoint: { nameOverride: "" }

# -- Service account configuration
# The chart always creates a ServiceAccount for the CU-CP pod, named after the
# release, so the pod never runs as the namespace's default account. Nothing in
# the pod (entrypoint.sh, the ocucp binary) uses the Kubernetes API, so the token
# is never mounted and no Role or RoleBinding is created.
serviceAccount:
  # -- Additional service account annotations, e.g. a cloud identity binding
  # @default -- `{}` (no annotations)
  annotations: {}

# -- Pod Disruption Budget configuration
podDisruptionBudget:
  enabled: true
  minAvailable: 0
  unhealthyPodEvictionPolicy: AlwaysAllow

# -- Additional pod annotations
podAnnotations: {}

# -- Extra labels applied to the Deployment and Pod template
extraLabels: {}

# -- Deployment update strategy
# OCUDU CU-CP is stateful and normally should not run overlapping old/new pods.
# Use RollingUpdate only when the runtime/config/storage behavior has been validated
# for overlapping pods.
deploymentStrategy:
  type: Recreate

# -- CU-CP startup probe configuration
# Holds off the liveness and readiness probes until ocucp is running, so neither
# of them needs padding on initialDelaySeconds and the pod reports Ready within
# one probe period of the process appearing. Startup budget is
# periodSeconds * failureThreshold (180s by default), which also covers O1 mode
# where the entrypoint waits for the adapter-generated config first.
startupProbe:
  enabled: true
  periodSeconds: 2
  timeoutSeconds: 1
  failureThreshold: 90

# -- CU-CP liveness probe configuration
# initialDelaySeconds stays at 90 even though startupProbe already gates this
# probe. It costs nothing while the startup probe is enabled, and it preserves
# the original tolerance if someone disables it — at 0 the thresholds below would
# kill a still-starting container ~60s after start (probes at 0s/30s/60s), which
# is tighter than the pre-startupProbe behaviour rather than looser.
livenessProbe:
  enabled: true
  initialDelaySeconds: 90
  periodSeconds: 30
  timeoutSeconds: 1
  failureThreshold: 3
  successThreshold: 1

# -- CU-CP readiness probe configuration
# startupProbe gates this probe, so initialDelaySeconds is not needed. The
# timeout and failureThreshold are deliberately not minimal: this is an exec
# probe, and under node pressure spawning pgrep can exceed a 1s timeout. With a
# single replica there is no second endpoint, so flapping readiness is a real
# N2/E1/F1-C outage rather than a cosmetic blip. 6 * 5s gives ~30s of tolerance
# while still detecting a dead process far sooner than the old 150s.
readinessProbe:
  enabled: true
  initialDelaySeconds: 0
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 6
  successThreshold: 1

# -- Pod-level security context. Runs the container as a non-root user by default.
# @default -- see below
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# -- Init process command used as container PID 1.
# Reaps zombie processes and forwards signals to the CU-CP process.
# @default -- `["/usr/bin/catatonit", "-g", "--"]`
initCommand:
  - /usr/bin/catatonit
  - -g
  - --

# -- Container-level security context
# ocucp needs SYS_NICE for the SCHED_FIFO priority of its worker pool and I/O
# thread; without it, it warns and runs them at normal priority. It uses PERFMON
# only to read the RAPL power metric, and runs without it.
#
# The image bakes both into /usr/local/bin/ocucp as permitted-only file
# capabilities (setcap cap_sys_nice,cap_perfmon+p). ocucp starts with whichever
# of them the container grants, so either can be removed below. File
# capabilities need allowPrivilegeEscalation: true; NO_NEW_PRIVS
# (allowPrivilegeEscalation: false) makes the kernel ignore them altogether.
#
# PERFMON is on kubescape's insecure-capability list: remove it to pass the CNTI
# insecure_capabilities check, at the cost of the power metric. The
# privilege_escalation check fails regardless.
securityContext:
  allowPrivilegeEscalation: true
  privileged: false
  capabilities:
    drop: ["ALL"]
    add:
      - SYS_NICE
      - PERFMON

# -- Resource requests and limits. Required: requests and limits must each set cpu and memory.
# The default 4Gi leaves room for the 2 GiB buffer pool OCUDU allocates at startup.
resources:
  limits:
    cpu: 1
    memory: 4Gi
  requests:
    cpu: 1
    memory: 4Gi

# -- Network configuration
network:
  # -- Enable host network mode
  # false (default): Uses CNI network (NetworkPolicy supported)
  # true: Uses host network namespace directly (NetworkPolicy NOT supported)
  # @default -- `false`
  hostNetwork: false

# -- Node selector for pod assignment
# Prefer a capability label (e.g. a node labelled for real-time workloads) over
# `kubernetes.io/hostname`: pinning to a single host means the pod cannot be
# rescheduled when that node is drained.
nodeSelector: {}

# -- Tolerations for pod assignment
tolerations: {}

# -- Pod affinity configuration
affinity: {}

# -- Topology spread constraints for pod assignment
topologySpreadConstraints: []

# -- Priority class assigned to the pod
# A high-priority class helps the CU-CP get rescheduled ahead of best-effort
# workloads after a node drain or under node pressure.
priorityClassName: ""

# -- Metrics service configuration
# Exposes CU-CP metrics endpoint for Telegraf collection
metricsService:
  # -- Enable metrics service
  enabled: false
  # -- Service type (ClusterIP, NodePort, or LoadBalancer)
  # @default -- `ClusterIP`
  type: ClusterIP
  # -- LoadBalancer IP address (optional, when type is LoadBalancer)
  # @default -- `""` (auto-assign)
  loadBalancerIP: ""
  # -- LoadBalancer class (optional, for clusters with multiple LB implementations)
  # @default -- `""` (use default)
  loadBalancerClass: ""
  # -- External traffic policy (Cluster or Local)
  # @default -- `Cluster`
  externalTrafficPolicy: Cluster
  # -- Session affinity (None or ClientIP)
  # @default -- `None`
  sessionAffinity: None
  # -- NodePort (optional, only used when type is NodePort)
  # @default -- `""` (auto-assign)
  nodePort: ""
  # -- Service port (must match the port in cu-cp-config.yml)
  port: 8001
  # -- Target port (container port)
  targetPort: 8001

# -- N2 service configuration (NGAP toward AMF, SCTP port 38412)
n2Service:
  # -- Enable N2 service
  enabled: true
  # -- Service type (ClusterIP, NodePort, or LoadBalancer)
  # @default -- `ClusterIP`
  type: ClusterIP
  loadBalancerIP: ""
  loadBalancerClass: ""
  externalTrafficPolicy: Cluster
  sessionAffinity: None
  nodePort: ""
  # -- Service port
  port: 38412

# -- E1 service configuration (E1AP toward CU-UP, SCTP port 38462)
e1Service:
  # -- Enable E1 service
  enabled: false
  # -- Service type (ClusterIP, NodePort, or LoadBalancer)
  # @default -- `ClusterIP`
  type: ClusterIP
  loadBalancerIP: ""
  loadBalancerClass: ""
  externalTrafficPolicy: Cluster
  sessionAffinity: None
  nodePort: ""
  # -- Service port
  port: 38462

# -- F1-C service configuration (F1AP toward DU, SCTP port 38472)
f1cService:
  # -- Enable F1-C service
  enabled: true
  # -- Service type (ClusterIP, NodePort, or LoadBalancer)
  # @default -- `ClusterIP`
  type: ClusterIP
  loadBalancerIP: ""
  loadBalancerClass: ""
  externalTrafficPolicy: Cluster
  sessionAffinity: None
  nodePort: ""
  # -- Service port
  port: 38472

# -- NetworkPolicy configuration
# Restricts network traffic to/from the CU-CP pod for enhanced security.
# IMPORTANT: NetworkPolicy only works when network.hostNetwork is false.
networkPolicy:
  # -- Enable NetworkPolicy (only effective when network.hostNetwork is false)
  # @default -- `false`
  enabled: false

  ingress:
    # -- Allow ingress from 5G core (N2/NGAP)
    fiveGCore:
      enabled: true
      from:
        - ipBlock:
            cidr: 10.0.0.0/8
    # -- Allow ingress from CU-UP (E1AP)
    cuUp:
      enabled: true
      from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ocudu-cu-up
        - ipBlock:
            cidr: 10.0.0.0/8
    # -- Allow ingress from DU (F1-C/F1AP)
    du:
      enabled: true
      from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ocudu-du
        - ipBlock:
            cidr: 10.0.0.0/8
    # -- Allow ingress from an Xn peer (Xn-C/XnAP).
    # Off by default, because most deployments have no Xn peer and a rule for one that
    # does not exist opens a port for nothing. The selectors name the charts that
    # terminate Xn in the same namespace; a peer elsewhere needs its own selector.
    xn:
      enabled: false
      from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ocudu-gnb
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ocudu-cu-cp
    # -- Allow ingress from monitoring systems
    monitoring:
      enabled: true
      from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
        - podSelector:
            matchLabels:
              app: telegraf
    # -- Custom ingress rules
    custom: []

  egress:
    # -- Allow egress to 5G core (N2/NGAP)
    fiveGCore:
      enabled: true
      to:
        - ipBlock:
            cidr: 10.0.0.0/8
    # -- Allow egress to CU-UP (E1AP)
    cuUp:
      enabled: true
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ocudu-cu-up
        - ipBlock:
            cidr: 10.0.0.0/8
    # -- Allow egress to DU (F1-C/F1AP)
    du:
      enabled: true
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ocudu-du
        - ipBlock:
            cidr: 10.0.0.0/8
    # -- Allow egress to an Xn peer (Xn-C/XnAP).
    # Off by default, because most deployments have no Xn peer and a rule for one that
    # does not exist opens a port for nothing. The selectors name the charts that
    # terminate Xn in the same namespace; a peer elsewhere needs its own selector.
    xn:
      enabled: false
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ocudu-gnb
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ocudu-cu-cp
    # -- Where the cluster DNS lives.
    # The default names the cluster DNS pods. That is the narrow answer, and it works on a
    # CNI that translates a service address before it applies policy. Some CNIs apply
    # policy to the service address itself; there this rule matches nothing, every name
    # lookup fails, and anything that resolves a name at startup never starts. Set it to
    # `[]` to allow port 53 to any destination instead: wider on destinations, still only
    # port 53.
    # @default -- the cluster DNS pods
    dnsTo:
      - namespaceSelector: {}
        podSelector:
          matchLabels:
            k8s-app: kube-dns

    # -- Allow egress to monitoring systems
    monitoring:
      enabled: true
      to:
        - namespaceSelector:
            matchLabels:
              name: monitoring
        - podSelector:
            matchLabels:
              app: influxdb
    # -- Custom egress rules
    custom: []

# -- IPsec protection for the F1-C and E1 interfaces.
# Adds a strongSwan sidecar to this pod. The pod becomes its own IPsec endpoint: one
# daemon, one IKE association, and one child association per protected interface. Every
# pod has its own network namespace, so two pods on the same node are still two separate
# endpoints and the traffic between them is still encrypted.
#
# The application is not modified and never sees the private key. It binds to the
# protected addresses listed under `connections`, and that is what sends its traffic
# through the tunnel.
ipsec:
  # -- Enable the IPsec sidecar.
  # Requires Kubernetes 1.29 or newer, `network.hostNetwork: false`, and a node whose
  # kernel provides XFRM interfaces and ESP.
  # @default -- `false`
  enabled: false

  image:
    # -- Container image repository
    repository: registry.gitlab.com/ocudu/ocudu_elements/ocudu_helm/ipsec-sidecar
    # -- Image tag, `<strongSwan version>_<image version>`
    tag: "6.0.4_1.0.0"
    # -- Image pull policy
    pullPolicy: IfNotPresent

  # -- Secret holding this pod's identity: `tls.crt`, `tls.key` and `ca.crt`.
  # Bring your own, or have `certManager` below issue it. It is mounted read-only into the
  # sidecar and nowhere else.
  certSecret: ""

  certManager:
    # -- Issue `certSecret` with cert-manager instead of bringing your own.
    # Off by default. It renders a `Certificate`, so the cert-manager custom resource
    # definitions have to be installed on the cluster first. The secret cert-manager
    # writes holds `tls.crt`, `tls.key` and `ca.crt`, which is what the sidecar reads.
    # The sidecar reads them once, at start: a renewal replaces the secret but does not
    # restart the daemon, so restart the pod to pick a renewed certificate up.
    # @default -- `false`
    enabled: false

    issuerRef:
      # -- Issuer to sign with. Required when `certManager.enabled` is true.
      name: ""
      # -- `Issuer` for one namespace, or `ClusterIssuer` for the whole cluster
      kind: Issuer
      # -- API group of the issuer
      group: cert-manager.io

    # -- How long an issued certificate is valid for
    duration: 2160h
    # -- How long before expiry it is renewed
    renewBefore: 360h

    privateKey:
      # -- Key algorithm. The default matches the elliptic-curve group in `ike.proposal`.
      algorithm: ECDSA
      # -- Key size
      size: 256
      # -- Whether a renewal also makes a new private key
      rotationPolicy: Always

    # -- Subject alternative names to request.
    # The default asks for `localId`, which is the identity the peer checks, and is right
    # whenever that identity is a name. Where it is not — a distinguished name or an email
    # address — leave this empty and put the matching field in `extraSpec` instead.
    # @default -- `[localId]`
    dnsNames: []

    # -- Extra fields merged into the `Certificate` spec, for anything the keys above do
    # not name, such as `subject`, `emailAddresses` or `ipAddresses`.
    extraSpec: {}

  # -- IKE identity this pod presents. It must match a subject or subject alternative
  # name of `tls.crt` in `certSecret`.
  localId: ""

  # -- The peers this pod builds an IKE association with, keyed by a name you choose.
  # One association per peer, each carrying the connections that name it. Required when
  # `enabled` is true. For example:
  #
  #   peers:
  #     du:
  #       id: du.ocudu.example
  #       address: ""
  #     cuup:
  #       id: cu-up.ocudu.example
  #       address: ""
  #
  # `id` is the identity the peer must present, and the connection is refused if it
  # presents anything else. `address` is the peer's outer endpoint: set it and this side
  # starts the connection, leave it empty and this side waits for the peer, which is what
  # a side with no stable peer address should do. Use a headless service name, never a
  # cluster IP service: a cluster IP forwards only the ports it declares and rewrites
  # addresses, which breaks address detection.
  # @default -- `{}`
  peers: {}

  # -- How ESP is carried: `udp` (ESP inside UDP port 4500) or `native` (IP protocol 50).
  # `udp` is the default because every CNI carries UDP, and because a NetworkPolicy cannot
  # name IP protocol 50. With `native` the policy has to allow every protocol to the peer,
  # which re-opens the plaintext path this feature exists to close.
  # @default -- `udp`
  encapsulation: udp

  # -- The address range the protected addresses are taken from.
  # The sidecar installs a route that refuses this whole range before any tunnel exists,
  # so a protected address is never reachable by another path, not even for a moment.
  protectedSupernet: 100.64.0.0/16

  # -- Move IKE off the privileged port so the sidecar can drop `NET_BIND_SERVICE`.
  # With this on, IKE is carried on UDP 4500 only and UDP 500 is never bound, so the
  # capability that exists to bind a privileged port is not needed. **Both ends have to
  # agree**: a peer still expecting UDP 500 will not connect.
  # @default -- `false`
  ikeOnNatTPortOnly: false

  credentialReload:
    # -- Pick up a renewed certificate without a pod restart.
    # The sidecar watches the mounted secret. When it changes it loads the new credentials
    # and closes the IKE association, so the next traffic authenticates with the new
    # certificate. The child policies stay installed throughout, so protected traffic is
    # encrypted or dropped while the association is rebuilt, never sent in clear.
    # @default -- `true`
    enabled: true
    # -- How often the mounted secret is checked, in seconds.
    intervalSeconds: 60

  # -- The interfaces to protect: one child association each, carried by the peer it
  # names. Required when `enabled` is true. For example:
  #
  #   connections:
  #     f1c:
  #       peer: du
  #       protocol: sctp
  #       local: 100.64.10.1
  #       remote: 100.64.10.2
  #     e1:
  #       peer: cuup
  #       protocol: sctp
  #       local: 100.64.20.1
  #       remote: 100.64.20.2
  #       espProposal: aes256gcm16-ecp256-esn-noesn
  #
  # `peer` is a key from `peers`. It may be left out while there is exactly one peer, and
  # is required as soon as there is a second.
  # `protocol` narrows the tunnel to what that interface actually speaks: `sctp` for F1-C
  # and E1, `udp` for F1-U. Traffic between the two protected addresses that is not that
  # protocol then matches no policy, so it is dropped rather than encrypted and delivered.
  # Leave it out to admit any protocol, which also admits ICMP and so path-MTU discovery.
  # `ifName` and `ifId` are both derived from the connection name and are only worth setting
  # where a specific value is required. `ifId` is a local number: nothing about it is
  # negotiated or sent, so the two ends need not agree on it.
  # `local` is the address this pod binds to, `remote` is the peer's. Both have to appear
  # in the application config, and the chart refuses to render if they do not.
  # @default -- `{}`
  connections: {}

  # -- Carry N2 in a tunnel too, to a core-side peer that terminates IKEv2.
  # Add the core as a peer with a connection for N2, and point `cu_cp.amf.addrs` and
  # `cu_cp.amf.bind_addrs` at its protected addresses. The `amf` section is then checked
  # like F1-C and E1, the entrypoint stops binding N2 to the pod address, and the policy
  # allows the core the tunnel instead of plaintext SCTP 38412.
  # @default -- `false`
  protectN2: false

  ike:
    # -- IKE proposal. Exactly one, so there is nothing to fall back to.
    proposal: aes256gcm16-prfsha384-ecp256
    # -- Default ESP proposal. A connection may override it with `espProposal`.
    espProposal: aes256gcm16-ecp256
    # -- How far out of order a packet may arrive and still be accepted, in packets.
    # 32 is the widest the kernel can manage without extended sequence numbers, and it is
    # what the daemon would have used anyway — set here so the width is a number this chart
    # chose rather than one it inherited. A wider window needs `esn` in `espProposal`, and
    # the chart refuses to render a wider one without it, because the kernel would silently
    # fall back to a window of 1.
    # **0 switches replay protection off entirely**, and that is refused too.
    replayWindow: 32
    # -- How long to wait before resending an unanswered IKE message, in seconds.
    # This pair, not `dpdDelay`, decides how fast a peer that has stopped answering is
    # given up on. The daemon's defaults retry for about 165 seconds, and for all of that
    # time this side keeps encrypting into an association the peer no longer has.
    retransmitTimeout: 2
    # -- How many times an unanswered IKE message is resent before the peer is given up on.
    retransmitTries: 3
    # -- How often the peer is checked
    dpdDelay: 10s
    # -- How long an unanswered peer is tolerated
    dpdTimeout: 30s
    # -- How often the IKE association is rekeyed
    rekeyTime: 4h

  # -- Render even when `networkPolicy.enabled` is false.
  # Without a policy the application can still address the peer's pod address directly and
  # send in clear. Set this true only where unprotected traffic is blocked some other way.
  # @default -- `false`
  allowWithoutNetworkPolicy: false

  startupProbe:
    # -- Hold the application container until the sidecar is set up.
    # The sidecar starts before the application and the application does not start until
    # this passes, so this is what stops the application racing a daemon that is still
    # loading. It checks that the daemon accepted every child it was given and that every
    # tunnel interface exists and carries its address — **not** that a tunnel is up, which
    # a side waiting to be dialled cannot satisfy. A failing startup probe restarts the
    # container, so a stricter check here would turn a slow peer into a crash loop.
    # @default -- `true`
    enabled: true
    initialDelaySeconds: 2
    periodSeconds: 3
    timeoutSeconds: 5
    # 30 tries at 3 seconds gives the daemon 90 seconds to load before the container is
    # restarted. Loading normally takes a second or two.
    failureThreshold: 30
    successThreshold: 1

  readinessProbe:
    # -- Enable the sidecar readiness probe.
    # Ready means every protected interface is protected by the kernel — an installed
    # association, or an installed policy for one that has no traffic yet. An interface
    # that has never carried a packet is still protected, so it counts as ready.
    # Off by default, because a side that waits for its peer has neither until the peer
    # connects, and a probe there would hold the pod unready waiting for something that
    # cannot have happened yet. Safe to turn on for the side that starts the connection.
    # Traffic is protected either way: the probe reports, it does not enforce.
    # @default -- `false`
    enabled: false
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1

  # -- Daemon log level: 0 silent, 1 negotiation, 2 more detail, 4 very verbose.
  # Raise it to follow a negotiation that is not completing; 4 prints key material
  # references and is not for a running deployment.
  logLevel: 1

  # -- Annotations for the headless service that publishes this pod's outer address.
  serviceAnnotations: {}

  # -- Resources for the sidecar.
  # On a node whose kubelet runs the `static` CPU manager policy, set requests equal to
  # limits here. A container is given exclusive CPUs only while the whole pod is
  # Guaranteed, and that needs every container — the sidecar included — to match. Leave
  # them unequal there and adding the sidecar drops the pod to Burstable, taking the
  # application container's pinning with it.
  resources: {}

  # -- Security context for the sidecar.
  # It runs as uid 0 on purpose. Kubernetes does not fill the ambient capability set, so a
  # non-root sidecar would need file capabilities on `ip`, `swanctl` and the daemon, plus
  # `allowPrivilegeEscalation: true` — that is strictly worse than uid 0 with escalation
  # switched off. The application container is untouched and gains nothing.
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    privileged: false
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
      add:
        - NET_ADMIN
        - NET_BIND_SERVICE
    seccompProfile:
      type: RuntimeDefault

# -- Persistent storage configuration
# Disabled by default: logs go to an `emptyDir`, which keeps the pod reschedulable
# onto any node. Enable it to keep logs across pod restarts.
persistence:
  enabled: false
  # -- Storage type: "pvc" or "hostPath"
  # `hostPath` ties the pod's logs to one node — the pod can then only be
  # rescheduled there, and a node-bound StorageClass (e.g. local-path) has the
  # same effect. Prefer a network-backed StorageClass for a drainable pod, and
  # treat hostPath as a local-debugging option.
  type: pvc
  pvc:
    storageClassName: ""
    accessMode: ReadWriteOnce
    size: 10Gi
  hostPath:
    path: "/mnt/debugging-logs"
    type: DirectoryOrCreate
  mountPath: "/var/log/ocudu"
  preserveOldLogs: false

# -- CU-CP configuration file
config:
  cu-cp-config.yml: |-
    cu_cp:
      amf:
        addrs: 127.0.1.100
        bind_addrs: 127.0.0.1
        supported_tracking_areas:
          - tac: 7
            plmn_list:
              - plmn: "00101"
                tai_slice_support_list:
                  - sst: 1
      e1ap:
        bind_addrs: 127.0.20.1
      f1ap:
        bind_addrs: 127.0.10.1

    log:
      filename: /var/log/ocudu/cu_cp.log
      all_level: warning

    pcap:
      ngap_enable: false
      ngap_filename: /var/log/ocudu/cu_cp_ngap.pcap
      f1ap_enable: false
      f1ap_filename: /var/log/ocudu/cu_cp_f1ap.pcap
      e1ap_enable: false
      e1ap_filename: /var/log/ocudu/cu_cp_e1ap.pcap
