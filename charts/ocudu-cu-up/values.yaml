# -- Container image configuration
image:
  # -- Container image repository
  repository: registry.gitlab.com/ocudu/ocudu/images/cu-up
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image tag. Always quote in values files — tags like ubuntu-24.04-avx2-20260624_2b3cf68e are parsed as floats by YAML.
  # @default -- Chart appVersion
  tag: ""

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- Number of CU-UP replicas
# The CU-UP is stateful and instances do not coordinate with each other — keep
# this at 1 unless running several CU-UPs behind the same Services has been
# validated.
replicaCount: 1

# -- Override the name of the chart
nameOverride: ""

# -- Override the full name of resources
fullnameOverride: ""

# -- ConfigMap name overrides
configmap:
  main: { nameOverride: "" }
  entrypoint: { nameOverride: "" }

# -- Service account configuration
serviceAccount:
  create: true
  annotations: {}
  name: ""
  # -- Mount the service account token into the pod
  # Neither entrypoint.sh nor the ocuup binary talks to the Kubernetes API, so
  # the token is not mounted by default. Applied to both the ServiceAccount and
  # the pod spec (the pod-level setting takes precedence).
  # @default -- `false`
  automountServiceAccountToken: false

# -- RBAC configuration
# Nothing in the CU-UP pod uses the Kubernetes API, so no Role/RoleBinding is
# created by default. Set `create: true` if extraRules or a sidecar genuinely
# need API access — and then also allow the token to be mounted via
# `serviceAccount.automountServiceAccountToken`.
rbac:
  create: false
  extraRules: []

# -- Pod Disruption Budget configuration
podDisruptionBudget:
  enabled: true
  minAvailable: 0
  unhealthyPodEvictionPolicy: AlwaysAllow

# -- Additional pod annotations
podAnnotations: {}

# -- Extra labels applied to the Deployment and Pod template
extraLabels: {}

# -- Deployment update strategy
# OCUDU CU-UP is stateful and normally should not run overlapping old/new pods.
# Use RollingUpdate only when the runtime/config/storage behavior has been validated
# for overlapping pods.
deploymentStrategy:
  type: Recreate

# -- CU-UP startup probe configuration
# Holds off the liveness and readiness probes until ocuup is running, so neither
# of them needs padding on initialDelaySeconds and the pod reports Ready within
# one probe period of the process appearing. Startup budget is
# periodSeconds * failureThreshold (180s by default), which also covers O1 mode
# where the entrypoint waits for the adapter-generated config first.
startupProbe:
  enabled: true
  periodSeconds: 2
  timeoutSeconds: 1
  failureThreshold: 90

# -- CU-UP liveness probe configuration
# initialDelaySeconds stays at 90 even though startupProbe already gates this
# probe. It costs nothing while the startup probe is enabled, and it preserves
# the original tolerance if someone disables it — at 0 the thresholds below would
# kill a still-starting container ~60s after start (probes at 0s/30s/60s), which
# is tighter than the pre-startupProbe behaviour rather than looser.
livenessProbe:
  enabled: true
  initialDelaySeconds: 90
  periodSeconds: 30
  timeoutSeconds: 1
  failureThreshold: 3
  successThreshold: 1

# -- CU-UP readiness probe configuration
# startupProbe gates this probe, so initialDelaySeconds is not needed. The
# timeout and failureThreshold are deliberately not minimal: this is an exec
# probe, and under node pressure spawning pgrep can exceed a 1s timeout. With a
# single replica there is no second endpoint, so flapping readiness is a real
# E1/N3/F1-U outage rather than a cosmetic blip. 6 * 5s gives ~30s of tolerance
# while still detecting a dead process far sooner than the old 150s.
readinessProbe:
  enabled: true
  initialDelaySeconds: 0
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 6
  successThreshold: 1

# -- Pod-level security context. Runs the container as a non-root user by default.
# @default -- see below
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# -- Init process command used as container PID 1.
# Reaps zombie processes and forwards signals to the CU-UP process.
# @default -- `["/usr/bin/catatonit", "-g", "--"]`
initCommand:
  - /usr/bin/catatonit
  - -g
  - --

# -- Container-level security context
# The three added capabilities are functional requirements of the ocuup binary,
# not an artifact of how they are granted: SYS_NICE for real-time thread
# priorities, IPC_LOCK for locked memory, PERFMON for the performance and RAPL
# counters. Dropping them does not harden the workload, it breaks it.
#
# They are additionally baked into /usr/local/bin/ocuup as file capabilities
# (setcap cap_sys_nice,cap_ipc_lock,cap_perfmon+ep), which makes both settings
# below load-bearing: with the `+ep` bits set the kernel fails the exec with
# EPERM unless every one of those capabilities is in the container's bounding
# set, and NO_NEW_PRIVS (allowPrivilegeEscalation: false) makes the kernel
# ignore file capabilities altogether.
#
# PERFMON is on kubescape's insecure-capability list, so the CNTI
# privilege_escalation and insecure_capabilities checks fail here by design.
securityContext:
  allowPrivilegeEscalation: true
  privileged: false
  capabilities:
    drop: ["ALL"]
    add:
      - SYS_NICE
      - IPC_LOCK
      - PERFMON

# -- Resource requests and limits
resources: {}

# -- Network configuration
network:
  # -- Enable host network mode
  # false (default): Uses CNI network (NetworkPolicy supported)
  # true: Uses host network namespace directly (NetworkPolicy NOT supported)
  # @default -- `false`
  hostNetwork: false

# -- Node selector for pod assignment
# Prefer a capability label (e.g. a node labelled for real-time workloads) over
# `kubernetes.io/hostname`: pinning to a single host means the pod cannot be
# rescheduled when that node is drained.
nodeSelector: {}

# -- Tolerations for pod assignment
tolerations: {}

# -- Pod affinity configuration
affinity: {}

# -- Topology spread constraints for pod assignment
topologySpreadConstraints: []

# -- Priority class assigned to the pod
# A high-priority class helps the CU-UP get rescheduled ahead of best-effort
# workloads after a node drain or under node pressure.
priorityClassName: ""

# -- Metrics service configuration
# Exposes CU-UP metrics endpoint for Telegraf collection
metricsService:
  # -- Enable metrics service
  enabled: false
  # -- Enable power consumption metrics via RAPL
  # @default -- `false`
  powercap:
    enabled: false
  # -- Service type (ClusterIP, NodePort, or LoadBalancer)
  # @default -- `ClusterIP`
  type: ClusterIP
  # -- LoadBalancer IP address (optional, when type is LoadBalancer)
  # @default -- `""` (auto-assign)
  loadBalancerIP: ""
  # -- LoadBalancer class (optional, for clusters with multiple LB implementations)
  # @default -- `""` (use default)
  loadBalancerClass: ""
  # -- External traffic policy (Cluster or Local)
  # @default -- `Cluster`
  externalTrafficPolicy: Cluster
  # -- Session affinity (None or ClientIP)
  # @default -- `None`
  sessionAffinity: None
  # -- NodePort (optional, only used when type is NodePort)
  # @default -- `""` (auto-assign)
  nodePort: ""
  # -- Service port (must match the port in cu-up-config.yml)
  port: 8001
  # -- Target port (container port)
  targetPort: 8001

# -- E1 service configuration (E1AP toward CU-CP, SCTP port 38462)
e1Service:
  # -- Enable E1 service
  enabled: false
  # -- Service type (ClusterIP, NodePort, or LoadBalancer)
  # @default -- `ClusterIP`
  type: ClusterIP
  loadBalancerIP: ""
  loadBalancerClass: ""
  externalTrafficPolicy: Cluster
  sessionAffinity: None
  nodePort: ""
  # -- Service port
  port: 38462

# -- N3 service configuration (GTP-U toward UPF, UDP port 2152)
n3Service:
  # -- Enable N3 service
  enabled: true
  # -- Service type (ClusterIP, NodePort, or LoadBalancer)
  # @default -- `ClusterIP`
  type: ClusterIP
  loadBalancerIP: ""
  loadBalancerClass: ""
  externalTrafficPolicy: Cluster
  sessionAffinity: None
  nodePort: ""
  # -- Service port
  port: 2152

# -- F1-U service configuration (GTP-U toward DU, UDP port 2152 external → 2151 container)
# Only rendered when network.hostNetwork is false (port clash avoidance).
# Must match cu_up.f1u.bind_port in the config.
f1uService:
  # -- Enable F1-U service (only rendered when network.hostNetwork is false)
  enabled: true
  # -- Service type (ClusterIP, NodePort, or LoadBalancer)
  # @default -- `ClusterIP`
  type: ClusterIP
  loadBalancerIP: ""
  loadBalancerClass: ""
  externalTrafficPolicy: Cluster
  sessionAffinity: None
  nodePort: ""
  # -- External service port
  port: 2152
  # -- Container target port (offset to avoid clash with NGU on the same IP)
  targetPort: 2151

# -- NetworkPolicy configuration
# Restricts network traffic to/from the CU-UP pod for enhanced security.
# IMPORTANT: NetworkPolicy only works when network.hostNetwork is false.
networkPolicy:
  # -- Enable NetworkPolicy (only effective when network.hostNetwork is false)
  # @default -- `false`
  enabled: false

  ingress:
    # -- Allow ingress from CU-CP (E1AP)
    cuCp:
      enabled: true
      from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ocudu-cu-cp
        - ipBlock:
            cidr: 10.0.0.0/8
    # -- Allow ingress from 5G core (N3/GTP-U)
    fiveGCore:
      enabled: true
      from:
        - ipBlock:
            cidr: 10.0.0.0/8
    # -- Allow ingress from DU (F1-U/GTP-U)
    du:
      enabled: true
      from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ocudu-du
        - ipBlock:
            cidr: 10.0.0.0/8
    # -- Allow ingress from monitoring systems
    monitoring:
      enabled: true
      from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
        - podSelector:
            matchLabels:
              app: telegraf
    # -- Custom ingress rules
    custom: []

  egress:
    # -- Allow egress to CU-CP (E1AP)
    cuCp:
      enabled: true
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ocudu-cu-cp
        - ipBlock:
            cidr: 10.0.0.0/8
    # -- Allow egress to 5G core (N3/GTP-U)
    fiveGCore:
      enabled: true
      to:
        - ipBlock:
            cidr: 10.0.0.0/8
    # -- Allow egress to DU (F1-U/GTP-U)
    du:
      enabled: true
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ocudu-du
        - ipBlock:
            cidr: 10.0.0.0/8
    # -- Allow egress to monitoring systems
    monitoring:
      enabled: true
      to:
        - namespaceSelector:
            matchLabels:
              name: monitoring
        - podSelector:
            matchLabels:
              app: influxdb
    # -- Custom egress rules
    custom: []

# -- Persistent storage configuration
# Disabled by default: logs go to an `emptyDir`, which keeps the pod reschedulable
# onto any node. Enable it to keep logs across pod restarts.
persistence:
  enabled: false
  # -- Storage type: "pvc" or "hostPath"
  # `hostPath` ties the pod's logs to one node — the pod can then only be
  # rescheduled there, and a node-bound StorageClass (e.g. local-path) has the
  # same effect. Prefer a network-backed StorageClass for a drainable pod, and
  # treat hostPath as a local-debugging option.
  type: pvc
  pvc:
    storageClassName: ""
    accessMode: ReadWriteOnce
    size: 10Gi
  hostPath:
    path: "/mnt/debugging-logs"
    type: DirectoryOrCreate
  mountPath: "/var/log/ocudu"
  preserveOldLogs: false

# -- CU-UP configuration file
config:
  cu-up-config.yml: |-
    cu_up:
      e1ap:
        addrs: 127.0.20.1
        bind_addrs: 127.0.20.2
      ngu:
        socket:
          - bind_addr: 127.0.0.1
      f1u:
        bind_port: 2151
        socket:
          - bind_addr: 127.0.10.1

    log:
      filename: /var/log/ocudu/cu_up.log
      all_level: warning

    pcap:
      e1ap_enable: false
      e1ap_filename: /var/log/ocudu/cu_up_e1ap.pcap
      f1u_enable: false
      f1u_filename: /var/log/ocudu/cu_up_f1u.pcap
      n3_enable: false
      n3_filename: /var/log/ocudu/cu_up_n3.pcap
