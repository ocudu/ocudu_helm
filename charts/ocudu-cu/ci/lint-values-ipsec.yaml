# Minimal values for linting the IPsec path. `ipsec.enabled` is false in the shipped
# defaults, so without this file none of the IPsec templates is ever rendered and none of
# the render-time guards is ever reached.
#
# This is a lint fixture, not a deployment example. The application config below carries
# only the keys the guards read; `docs/ipsec.md` has the worked example.
#
# cert-manager stays off on purpose: its custom resource definitions have no schema here,
# and an unknown kind fails the manifest check.

# Both publish an unprotected path to the pod address, so the chart refuses to render
# while either is on.
f1cService:
  enabled: false
f1uService:
  enabled: false

networkPolicy:
  enabled: true

ipsec:
  enabled: true
  certSecret: ocudu-cu-ipsec
  localId: cu.example.com
  peers:
    du:
      id: du.example.com
      # No address, so this side waits for the DU to connect. The DU fixture sets one and
      # exercises the other branch.
    xn:
      id: gnb-b.example.com
      # Set, so this side starts the Xn connection.
      address: ocudu-gnb-ipsec
  # Every connection names its peer, which is what a pod with more than one has to do. The
  # DU fixture has a single peer and exercises the branch that leaves the key out.
  connections:
    f1c:
      peer: du
      protocol: sctp
      local: 100.64.10.1
      remote: 100.64.10.2
    f1u:
      peer: du
      protocol: udp
      local: 100.64.30.1
      remote: 100.64.30.2
    xnc:
      peer: xn
      protocol: sctp
      local: 100.64.40.1
      remote: 100.64.40.2
    xnu:
      peer: xn
      protocol: udp
      local: 100.64.50.1
      remote: 100.64.50.2

config:
  cu-config.yml: |-
    cu_cp:
      f1ap:
        bind_addrs: 100.64.10.1

      # Xn-C is shaped as a list of gateways, each with a list of peer connections, and
      # the addresses inside are lists too. Written here in that form on purpose: an
      # address on its own line is checked the same as one written beside its key.
      xnap:
        gateways:
          - bind_addrs:
              - 100.64.40.1
            connections:
              - peer_addrs:
                  - 100.64.40.2

    cu_up:
      f1u:
        bind_port: 2151
        peer_port: 2151
        socket:
          - bind_addr: 100.64.30.1

      # Off the core's GTP-U port, which the chart refuses to share with a protected
      # interface. Both ends have to agree on this number.
      xnu:
        bind_port: 2153
        peer_port: 2153
        socket:
          - bind_addr: 100.64.50.1
