{{- $ssh := ((.Values.o1).netconfServer).ssh | default dict }}
{{- if and (.Values.o1).enable_ocudu_o1 $ssh.username (not $ssh.passwordSecret) $ssh.password }}

# SPDX-FileCopyrightText: Copyright (C) 2021-2026 Software Radio Systems Limited
# SPDX-License-Identifier: BSD-3-Clause-Open-MPI

# Dev/test tier: the chart renders the cleartext password from values into this
# Secret. Production should pass a pre-provisioned Secret via
# o1.netconfServer.ssh.passwordSecret instead, keeping the password out of the
# chart's values and helm metadata entirely.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ocudu-cu.netconfSshCredentialsSecretName" . }}
  labels:
    {{- include "ocudu-cu.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ $ssh.password | quote }}
{{- end }}
