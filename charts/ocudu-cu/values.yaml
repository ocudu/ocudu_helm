# -- Container image configuration
image:
  # -- Container image repository
  # See https://gitlab.com/ocudu/ocudu/container_registry for available images
  repository: registry.gitlab.com/ocudu/ocudu/images/cu
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image tag. Always quote in values files — tags like 20260529_abc123e1 are parsed as floats by YAML.
  # @default -- Chart appVersion
  tag: ""

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- Number of CU replicas
# The CU is stateful and instances do not coordinate with each other — keep this
# at 1 unless running several CUs behind the same Services has been validated.
replicaCount: 1

# -- Override the name of the chart
nameOverride: ""

# -- Override the full name of resources
fullnameOverride: ""

# -- ConfigMap name overrides
configmap:
  main: { nameOverride: "" }
  entrypoint: { nameOverride: "" }

# -- Service account configuration
serviceAccount:
  create: true
  annotations: {}
  name: ""
  # -- Mount the service account token into the pod
  # Neither entrypoint.sh nor the ocu binary talks to the Kubernetes API, so the
  # token is not mounted by default. Applied to both the ServiceAccount and the
  # pod spec (the pod-level setting takes precedence).
  # @default -- `false`
  automountServiceAccountToken: false

# -- RBAC configuration
# Nothing in the CU pod uses the Kubernetes API, so no Role/RoleBinding is
# created by default. Set `create: true` if extraRules or a sidecar genuinely
# need API access — and then also allow the token to be mounted via
# `serviceAccount.automountServiceAccountToken`.
rbac:
  create: false
  extraRules: []

# -- Pod Disruption Budget configuration
podDisruptionBudget:
  enabled: true
  minAvailable: 0
  unhealthyPodEvictionPolicy: AlwaysAllow

# -- Additional pod annotations
podAnnotations: {}

# -- Extra labels applied to the Deployment and Pod template
extraLabels: {}

# -- Deployment update strategy
# OCUDU CU is stateful and normally should not run overlapping old/new pods.
# Use RollingUpdate only when the runtime/config/storage behavior has been validated
# for overlapping pods.
deploymentStrategy:
  type: Recreate

# -- CU startup probe configuration
# Holds off the liveness and readiness probes until ocu is running, so neither
# needs padding on initialDelaySeconds and the pod reports Ready within one probe
# period of the process appearing. Startup budget is
# periodSeconds * failureThreshold (180s by default), which also covers O1 mode
# where the entrypoint waits for the adapter-generated config first.
startupProbe:
  enabled: true
  periodSeconds: 2
  timeoutSeconds: 1
  failureThreshold: 90

# -- CU liveness probe configuration
# initialDelaySeconds stays at 90 even though startupProbe already gates this
# probe. It costs nothing while the startup probe is enabled, and it preserves
# the original tolerance if someone disables it.
livenessProbe:
  enabled: true
  initialDelaySeconds: 90
  periodSeconds: 30
  timeoutSeconds: 1
  failureThreshold: 3
  successThreshold: 1

# -- CU readiness probe configuration
# startupProbe gates this probe, so initialDelaySeconds is not needed. The
# timeout and failureThreshold are deliberately not minimal: this is an exec
# probe, and under node pressure spawning pgrep can exceed a 1s timeout. With a
# single replica there is no second endpoint, so flapping readiness is a real
# N2/N3/F1 outage rather than a cosmetic blip.
readinessProbe:
  enabled: true
  initialDelaySeconds: 0
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 6
  successThreshold: 1

# -- Pod-level security context. Runs the container as a non-root user by default.
# @default -- see below
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# -- Init process command used as container PID 1.
# Reaps zombie processes and forwards signals to the CU process.
# @default -- `["/usr/bin/catatonit", "-g", "--"]`
initCommand:
  - /usr/bin/catatonit
  - -g
  - --

# -- Container-level security context.
securityContext:
  allowPrivilegeEscalation: true
  privileged: false
  capabilities:
    drop: ["ALL"]
    add:
      - SYS_NICE
      - IPC_LOCK

# -- Resource requests and limits
resources: {}

# -- Network configuration
network:
  # -- Enable host network mode
  # false (default): Uses CNI network (NetworkPolicy supported)
  # true: Uses host network namespace directly (NetworkPolicy NOT supported)
  # @default -- `false`
  hostNetwork: false

# -- Node selector for pod assignment
# Prefer a capability label (e.g. a node labelled for real-time workloads) over
# `kubernetes.io/hostname`: pinning to a single host means the pod cannot be
# rescheduled when that node is drained.
nodeSelector: {}

# -- Tolerations for pod assignment
tolerations: {}

# -- Pod affinity configuration
affinity: {}

# -- Topology spread constraints for pod assignment
topologySpreadConstraints: []

# -- Priority class assigned to the pod
# A high-priority class helps the CU get rescheduled ahead of best-effort
# workloads after a node drain or under node pressure.
priorityClassName: ""

# -- Metrics service configuration
# Exposes CU metrics endpoint for Telegraf collection
metricsService:
  # -- Enable metrics service
  enabled: false
  # -- Enable power consumption metrics via RAPL
  # When true, adds CAP_PERFMON to the container to allow perf_event_open() RAPL reads.
  # The binary tries three methods in order:
  #   1. sysfs powercap (/sys/class/powercap) — works if the host exposes it in the container
  #   2. perf_event_open() — requires CAP_PERFMON and kernel >= 5.8 (no host mounts needed)
  #   3. MSR (/dev/cpu/0/msr) — requires CAP_SYS_RAWIO (not added by this chart)
  # If none succeed, energy metrics are silently unavailable (no crash).
  # @default -- `false`
  powercap:
    enabled: false

  # -- Service type (ClusterIP, NodePort, or LoadBalancer)
  # @default -- `ClusterIP`
  type: ClusterIP

  # -- LoadBalancer IP address (optional, when type is LoadBalancer)
  # @default -- `""` (auto-assign)
  loadBalancerIP: ""

  # -- LoadBalancer class (optional, for clusters with multiple LB implementations)
  # @default -- `""` (use default)
  loadBalancerClass: ""

  # -- External traffic policy (Cluster or Local)
  # @default -- `Cluster`
  externalTrafficPolicy: Cluster

  # -- Session affinity (None or ClientIP)
  # @default -- `None`
  sessionAffinity: None

  # -- NodePort (optional, only used when type is NodePort)
  # @default -- `""` (auto-assign)
  nodePort: ""

  # -- Service port (must match the port in cu-config.yml)
  port: 8001

  # -- Target port (container port)
  targetPort: 8001

# -- Service for N2 interface (NGAP - SCTP:38412 to AMF)
n2Service:
  # -- Enable N2 service
  enabled: true
  # -- Service type (ClusterIP, NodePort, or LoadBalancer)
  # @default -- `ClusterIP`
  type: ClusterIP
  # -- LoadBalancer IP address (optional)
  loadBalancerIP: ""
  # -- LoadBalancer class (optional)
  loadBalancerClass: ""
  # -- External traffic policy (Cluster or Local)
  externalTrafficPolicy: Cluster
  # -- Session affinity (None or ClientIP)
  sessionAffinity: None
  # -- Service port
  port: 38412
  # -- NodePort (optional, only used when type is NodePort)
  nodePort: ""

# -- Service for N3 interface (NGU/GTP-U - UDP:2152 to UPF)
n3Service:
  # -- Enable N3 service
  enabled: true
  # -- Service type (ClusterIP, NodePort, or LoadBalancer)
  # @default -- `ClusterIP`
  type: ClusterIP
  # -- LoadBalancer IP address (optional)
  loadBalancerIP: ""
  # -- LoadBalancer class (optional)
  loadBalancerClass: ""
  # -- External traffic policy (Cluster or Local)
  externalTrafficPolicy: Cluster
  # -- Session affinity (None or ClientIP)
  sessionAffinity: None
  # -- Service port
  port: 2152
  # -- NodePort (optional, only used when type is NodePort)
  nodePort: ""

# -- Service for F1-C interface (F1AP - SCTP:38472 to DU)
f1cService:
  # -- Enable F1-C service
  enabled: true
  # -- Service type (ClusterIP, NodePort, or LoadBalancer)
  # @default -- `ClusterIP`
  type: ClusterIP
  # -- LoadBalancer IP address (optional)
  loadBalancerIP: ""
  # -- LoadBalancer class (optional)
  loadBalancerClass: ""
  # -- External traffic policy (Cluster or Local)
  externalTrafficPolicy: Cluster
  # -- Session affinity (None or ClientIP)
  sessionAffinity: None
  # -- Service port
  port: 38472
  # -- NodePort (optional, only used when type is NodePort)
  nodePort: ""

# -- Service for F1-U interface (GTP-U - UDP:2152→2151 to DU, hostNetwork=false only)
# Maps external UDP:2152 to pod UDP:2151 so F1-U and NGU can coexist on the same pod IP.
# Must match cu_up.f1u.bind_port in the config.
f1uService:
  # -- Enable F1-U service (only rendered when network.hostNetwork is false)
  enabled: true
  # -- Service type (ClusterIP, NodePort, or LoadBalancer)
  # @default -- `ClusterIP`
  type: ClusterIP
  # -- LoadBalancer IP address (optional)
  loadBalancerIP: ""
  # -- LoadBalancer class (optional)
  loadBalancerClass: ""
  # -- External traffic policy (Cluster or Local)
  externalTrafficPolicy: Cluster
  # -- Session affinity (None or ClientIP)
  sessionAffinity: None
  # -- External port (what the DU connects to)
  port: 2152
  # -- Container target port (must match cu_up.f1u.bind_port in the config)
  targetPort: 2151
  # -- NodePort (optional, only used when type is NodePort)
  nodePort: ""

# -- NetworkPolicy configuration
# Restricts network traffic to/from the CU pod for enhanced security
# IMPORTANT: NetworkPolicy only works when network.hostNetwork is false
networkPolicy:
  # -- Enable NetworkPolicy
  # Only effective when network.hostNetwork is false
  # @default -- `false`
  enabled: false

  # -- Ingress rules (incoming traffic to CU)
  ingress:
    # -- Allow traffic from 5G core (N2/N3 interfaces)
    fiveGCore:
      # -- Enable 5G core ingress
      # @default -- `true`
      enabled: true
      # -- Source selectors for 5G core traffic
      from:
        - ipBlock:
            cidr: 10.0.0.0/8  # Adjust for your network CIDR

    # -- Allow traffic from DU (F1-C/F1-U interfaces)
    du:
      # -- Enable DU ingress
      # @default -- `true`
      enabled: true
      # -- Source selectors for DU traffic
      from:
        - podSelector:
            matchLabels:
              app: ocudu-du
        - ipBlock:
            cidr: 10.0.0.0/8  # Adjust for your network CIDR

    # -- Allow traffic from monitoring systems
    monitoring:
      # -- Enable monitoring ingress
      # @default -- `true`
      enabled: true
      # -- Source selectors for monitoring traffic
      from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
        - podSelector:
            matchLabels:
              app: telegraf

    # -- Custom ingress rules
    # @default -- `[]`
    custom: []

  # -- Egress rules (outgoing traffic from CU)
  egress:
    # -- Allow traffic to 5G core (N2/N3)
    fiveGCore:
      # -- Enable 5G core egress
      # @default -- `true`
      enabled: true
      # -- Destination selectors for 5G core traffic
      to:
        - ipBlock:
            cidr: 10.0.0.0/8  # Adjust for your network CIDR

    # -- Allow traffic to DU (F1-C/F1-U)
    du:
      # -- Enable DU egress
      # @default -- `true`
      enabled: true
      # -- Destination selectors for DU traffic
      to:
        - podSelector:
            matchLabels:
              app: ocudu-du
        - ipBlock:
            cidr: 10.0.0.0/8  # Adjust for your network CIDR

    # -- Allow traffic to monitoring systems
    monitoring:
      # -- Enable monitoring egress
      # @default -- `true`
      enabled: true
      # -- Destination selectors for monitoring traffic
      to:
        - namespaceSelector:
            matchLabels:
              name: monitoring
        - podSelector:
            matchLabels:
              app: influxdb

    # -- Custom egress rules
    # @default -- `[]`
    custom: []

# -- Persistent storage configuration
# Disabled by default: logs go to an `emptyDir`, which keeps the pod reschedulable
# onto any node. Enable it to keep logs across pod restarts.
persistence:
  enabled: false
  # -- Storage type: "pvc" or "hostPath"
  # `hostPath` ties the pod's logs to one node — the pod can then only be
  # rescheduled there, and a node-bound StorageClass (e.g. local-path) has the
  # same effect. Prefer a network-backed StorageClass for a drainable pod, and
  # treat hostPath as a local-debugging option.
  type: pvc
  pvc:
    storageClassName: ""
    accessMode: ReadWriteOnce
    size: 10Gi
  hostPath:
    path: "/mnt/debugging-logs"
    type: DirectoryOrCreate
  mountPath: "/var/log/ocudu"
  preserveOldLogs: false

# -- CU configuration file
config:
  cu-config.yml: |-
    cu_cp:
      amf:
        addrs: 127.0.1.100
        bind_addrs: 127.0.0.1
        supported_tracking_areas:
          - tac: 7
            plmn_list:
              - plmn: "00101"
                tai_slice_support_list:
                  - sst: 1
      f1ap:
        bind_addrs: 127.0.10.1

    cu_up:
      f1u:
        bind_port: 2151
        socket:
          - bind_addr: 127.0.10.1

    log:
      filename: /var/log/ocudu/cu.log
      all_level: warning

    metrics:
      enable_json: false
      enable_log: false

    pcap:
      ngap_enable: false
      ngap_filename: /var/log/ocudu/cu_ngap.pcap
