# Minimal values for linting the IPsec path. `ipsec.enabled` is false in the shipped
# defaults, so without this file none of the IPsec templates is ever rendered and none of
# the render-time guards is ever reached.
#
# This is a lint fixture, not a deployment example. The application config below carries
# only the keys the guards read; `docs/ipsec.md` has the worked example.
#
# cert-manager stays off on purpose: its custom resource definitions have no schema here,
# and an unknown kind fails the manifest check.

# Both publish an unprotected path to the pod address, so the chart refuses to render
# while either is on.
f1cService:
  enabled: false
f1uService:
  enabled: false

networkPolicy:
  enabled: true

ipsec:
  enabled: true
  certSecret: ocudu-du-ipsec
  localId: du.example.com
  peer:
    id: cu.example.com
    # Set, so this side starts the connection. The CU fixture leaves it empty and
    # exercises the other branch.
    address: ocudu-cu-ipsec
  connections:
    f1c:
      ifName: ipsec-f1c
      ifId: 257
      local: 100.64.10.2
      remote: 100.64.10.1
    f1u:
      ifName: ipsec-f1u
      ifId: 258
      local: 100.64.30.2
      remote: 100.64.30.1

config:
  du-config.yml: |-
    f1ap:
      addrs: 100.64.10.1
      bind_addrs: 100.64.10.2

    f1u:
      socket:
        - bind_addr: 100.64.30.2
      bind_port: 2151
      peer_port: 2151
