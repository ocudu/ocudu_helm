# -- Container image configuration
image:
  # -- Container image repository
  # See https://gitlab.com/ocudu/ocudu/container_registry for available images
  repository: registry.gitlab.com/ocudu/ocudu/images/du-dpdk
  # repository: repository: registry.gitlab.com/ocudu/ocudu/images/du-uhd
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image tag. Always quote in values files — tags like 20260529_abc123e1 are parsed as floats by YAML.
  # @default -- Chart appVersion
  tag: ""

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- Number of DU replicas
# The DU is stateful and instances do not coordinate with each other — keep this
# at 1. A DU driving real radio hardware cannot be replicated at all, since the
# fronthaul device is bound to one pod.
replicaCount: 1

# -- Override the name of the chart
nameOverride: ""

# -- Override the full name of resources
fullnameOverride: ""

# -- ConfigMap name overrides
configmap:
  main: { nameOverride: "" }
  entrypoint: { nameOverride: "" }

# -- Service account configuration
serviceAccount:
  create: true
  annotations: {}
  name: ""
  # -- Mount the service account token into the pod
  # Neither entrypoint.sh nor the odu binary talks to the Kubernetes API, so the
  # token is not mounted by default. Applied to both the ServiceAccount and the
  # pod spec (the pod-level setting takes precedence).
  # @default -- `false`
  automountServiceAccountToken: false

# -- RBAC configuration
# Nothing in the DU pod uses the Kubernetes API, so no Role/RoleBinding is
# created by default. Set `create: true` if extraRules or a sidecar genuinely
# need API access — and then also allow the token to be mounted via
# `serviceAccount.automountServiceAccountToken`.
rbac:
  create: false
  extraRules: []

# -- Pod Disruption Budget configuration
podDisruptionBudget:
  enabled: true
  minAvailable: 0
  unhealthyPodEvictionPolicy: AlwaysAllow

# -- Additional pod annotations
podAnnotations: {}

# -- RuntimeClass used for the DU pod (for example, an OpenShift PerformanceProfile RuntimeClass)
runtimeClassName: ""

# -- Extra labels applied to the Deployment and Pod template
extraLabels: {}

# -- Deployment update strategy
# OCUDU DU is stateful and normally should not run overlapping old/new pods.
# Use RollingUpdate only when the runtime/config/storage behavior has been validated
# for overlapping pods.
deploymentStrategy:
  type: Recreate

# -- DU startup probe configuration
# Holds off the liveness and readiness probes until odu is running, so neither
# needs padding on initialDelaySeconds and the pod reports Ready within one probe
# period of the process appearing. Startup budget is
# periodSeconds * failureThreshold (180s by default), which also covers O1 mode
# where the entrypoint waits for the adapter-generated config first, and DPDK
# builds where EAL initialization adds to startup.
startupProbe:
  enabled: true
  periodSeconds: 2
  timeoutSeconds: 1
  failureThreshold: 90

# -- DU liveness probe configuration
# initialDelaySeconds stays at 90 even though startupProbe already gates this
# probe. It costs nothing while the startup probe is enabled, and it preserves
# the original tolerance if someone disables it.
livenessProbe:
  enabled: true
  initialDelaySeconds: 90
  periodSeconds: 30
  timeoutSeconds: 1
  failureThreshold: 3
  successThreshold: 1

# -- DU readiness probe configuration
# startupProbe gates this probe, so initialDelaySeconds is not needed. The
# timeout and failureThreshold are deliberately not minimal: this is an exec
# probe, and under node pressure spawning pgrep can exceed a 1s timeout. With a
# single replica there is no second endpoint, so flapping readiness is a real
# F1-C/F1-U outage rather than a cosmetic blip.
readinessProbe:
  enabled: true
  initialDelaySeconds: 0
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 6
  successThreshold: 1

# -- Pod-level security context. Runs the container as a non-root user by default.
# @default -- see below
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# -- Container-level security context.
#
# Default: minimum-privilege shape for SR-IOV Device Plugin + vfio-pci.
# Requires the image to have file capabilities baked into /usr/local/bin/odu
# (setcap cap_sys_nice,cap_ipc_lock,cap_perfmon+ep) and containerd
# `device_ownership_from_security_context = true` on the node.
securityContext:
  allowPrivilegeEscalation: true
  privileged: false
  capabilities:
    drop: ["ALL"]
    add:
      - SYS_NICE
      - IPC_LOCK
      - PERFMON

# -- Resource requests and limits
# Hugepages are automatically configured when defined in limits or requests.
# The chart detects hugepages-1Gi or hugepages-2Mi and creates volumes accordingly.
#
# Example with 1Gi hugepages (recommended):
# ```yaml
# resources:
#   limits:
#     cpu: 12
#     memory: 16Gi
#     hugepages-1Gi: 2Gi
#   requests:
#     cpu: 12
#     memory: 16Gi
#     hugepages-1Gi: 2Gi
# ```
#
# Example with 2Mi hugepages:
# ```yaml
# resources:
#   limits:
#     cpu: 12
#     memory: 16Gi
#     hugepages-2Mi: 2Gi
#   requests:
#     cpu: 12
#     memory: 16Gi
#     hugepages-2Mi: 2Gi
# ```
resources:
  # -- Resource limits for the DU container
  # Include hugepages-1Gi or hugepages-2Mi to automatically enable hugepage volumes
  limits: {}
    # cpu: 12
    # memory: 16Gi
    # hugepages-1Gi: 2Gi
    # hugepages-2Mi: 2Gi

  # -- Resource requests for the DU container
  # Include hugepages-1Gi or hugepages-2Mi to automatically enable hugepage volumes
  requests: {}
    # cpu: 12
    # memory: 16Gi
    # hugepages-1Gi: 2Gi
    # hugepages-2Mi: 2Gi

# -- Network configuration
network:
  # -- Enable host network mode
  # false (default): Uses CNI network with SR-IOV for production (NetworkPolicy supported)
  # true: Uses host network namespace directly (simple setup, NetworkPolicy NOT supported)
  # @default -- `false`
  hostNetwork: false

# -- Node selector for pod assignment
# A DU driving real radio hardware legitimately has to be pinned to the node
# holding the fronthaul NIC, and then `node_drain` cannot pass by definition.
# With `ru_dummy` there is no hardware to be near, so leave this empty and let
# the pod be rescheduled. Prefer a capability label over `kubernetes.io/hostname`
# where a pin is genuinely needed.
nodeSelector: {}

# -- Tolerations for pod assignment
tolerations: {}

# -- Pod affinity configuration
affinity: {}

# -- Topology spread constraints for pod assignment
topologySpreadConstraints: []

# -- Priority class assigned to the pod
# A high-priority class helps the DU get rescheduled ahead of best-effort
# workloads after a node drain or under node pressure.
priorityClassName: ""

# -- Metrics service configuration
# Exposes DU metrics endpoint for Telegraf collection
metricsService:
  # -- Enable metrics service
  enabled: false
  # -- Enable power consumption metrics via RAPL
  # When true, adds CAP_PERFMON to the container to allow perf_event_open() RAPL reads.
  # The binary tries three methods in order:
  #   1. sysfs powercap (/sys/class/powercap) — works if the host exposes it in the container
  #   2. perf_event_open() — requires CAP_PERFMON and kernel >= 5.8 (no host mounts needed)
  #   3. MSR (/dev/cpu/0/msr) — requires CAP_SYS_RAWIO (not added by this chart)
  # If none succeed, energy metrics are silently unavailable (no crash).
  # @default -- `false`
  powercap:
    enabled: false

  # -- Service type (ClusterIP, NodePort, or LoadBalancer)
  # @default -- `ClusterIP`
  type: ClusterIP

  # -- LoadBalancer IP address (optional, when type is LoadBalancer)
  # @default -- `""` (auto-assign)
  loadBalancerIP: ""

  # -- LoadBalancer class (optional, for clusters with multiple LB implementations)
  # @default -- `""` (use default)
  loadBalancerClass: ""

  # -- External traffic policy (Cluster or Local)
  # @default -- `Cluster`
  externalTrafficPolicy: Cluster

  # -- Session affinity (None or ClientIP)
  # @default -- `None`
  sessionAffinity: None

  # -- NodePort (optional, only used when type is NodePort)
  # @default -- `""` (auto-assign)
  nodePort: ""

  # -- Service port (must match the port in du-config.yml)
  port: 8001

  # -- Target port (container port)
  targetPort: 8001

# -- Service for F1-C interface (F1AP - SCTP:38472 to CU-CP)
f1cService:
  # -- Enable F1-C service
  enabled: true
  # -- Service type (ClusterIP, NodePort, or LoadBalancer)
  # @default -- `ClusterIP`
  type: ClusterIP
  # -- LoadBalancer IP address (optional)
  loadBalancerIP: ""
  # -- LoadBalancer class (optional)
  loadBalancerClass: ""
  # -- External traffic policy (Cluster or Local)
  externalTrafficPolicy: Cluster
  # -- Session affinity (None or ClientIP)
  sessionAffinity: None
  # -- Service port
  port: 38472
  # -- NodePort (optional, only used when type is NodePort)
  nodePort: ""

# -- Service for F1-U interface (GTP-U - UDP:2152 to CU-UP)
f1uService:
  # -- Enable F1-U service
  enabled: true
  # -- Service type (ClusterIP, NodePort, or LoadBalancer)
  # @default -- `ClusterIP`
  type: ClusterIP
  # -- LoadBalancer IP address (optional)
  loadBalancerIP: ""
  # -- LoadBalancer class (optional)
  loadBalancerClass: ""
  # -- External traffic policy (Cluster or Local)
  externalTrafficPolicy: Cluster
  # -- Session affinity (None or ClientIP)
  sessionAffinity: None
  # -- Service port
  port: 2152
  # -- NodePort (optional, only used when type is NodePort)
  nodePort: ""

# -- NetworkPolicy configuration
# Restricts network traffic to/from the DU pod for enhanced security
# IMPORTANT: NetworkPolicy only works when network.hostNetwork is false
networkPolicy:
  # -- Enable NetworkPolicy
  # Only effective when network.hostNetwork is false
  # @default -- `false`
  enabled: false

  # -- Ingress rules (incoming traffic to DU)
  ingress:
    # -- Allow traffic from CU (F1-C/F1-U interfaces)
    cu:
      # -- Enable CU ingress
      # @default -- `true`
      enabled: true
      # -- Source selectors for CU traffic
      from:
        - podSelector:
            matchLabels:
              app: ocudu-cu
        - ipBlock:
            cidr: 10.0.0.0/8  # Adjust for your network CIDR

    # -- Allow traffic from monitoring systems
    monitoring:
      # -- Enable monitoring ingress
      # @default -- `true`
      enabled: true
      # -- Source selectors for monitoring traffic
      from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
        - podSelector:
            matchLabels:
              app: telegraf

    # -- Custom ingress rules
    # @default -- `[]`
    custom: []

  # -- Egress rules (outgoing traffic from DU)
  egress:
    # -- Allow traffic to CU (F1-C/F1-U)
    cu:
      # -- Enable CU egress
      # @default -- `true`
      enabled: true
      # -- Destination selectors for CU traffic
      to:
        - podSelector:
            matchLabels:
              app: ocudu-cu
        - ipBlock:
            cidr: 10.0.0.0/8  # Adjust for your network CIDR

    # -- Allow traffic to monitoring systems
    monitoring:
      # -- Enable monitoring egress
      # @default -- `true`
      enabled: true
      # -- Destination selectors for monitoring traffic
      to:
        - namespaceSelector:
            matchLabels:
              name: monitoring
        - podSelector:
            matchLabels:
              app: influxdb

    # -- Custom egress rules
    # @default -- `[]`
    custom: []

# -- SR-IOV configuration
sriovConfig:
  # -- Enable SR-IOV device plugin resource allocation
  # When enabled, requests one SR-IOV VF from the device plugin.
  # @default -- `true`
  enabled: true
  # -- Extended resource name advertised by the SR-IOV device plugin
  # Common values:
  #   intel.com/intel_sriov_dpdk     (DPDK / vfio-pci, for use with hal section)
  #   intel.com/intel_sriov_netdevice (kernel netdev — NOT supported for DU, use DPDK only)
  # @default -- `intel.com/intel_sriov_dpdk`
  extendedResourceName: "intel.com/intel_sriov_dpdk"

# -- Persistent storage configuration
# Disabled by default: logs go to an `emptyDir`, which keeps the pod reschedulable
# onto any node. Enable it to keep logs across pod restarts — worth doing on a
# DU that is pinned to radio hardware anyway.
persistence:
  enabled: false
  # -- Storage type: "pvc" or "hostPath"
  # `hostPath` ties the pod's logs to one node — the pod can then only be
  # rescheduled there, and a node-bound StorageClass (e.g. local-path) has the
  # same effect. Prefer a network-backed StorageClass for a drainable pod, and
  # treat hostPath as a local-debugging option.
  type: pvc
  pvc:
    storageClassName: ""
    accessMode: ReadWriteOnce
    size: 10Gi
  hostPath:
    path: "/mnt/debugging-logs"
    type: DirectoryOrCreate
  mountPath: "/var/log/ocudu"
  preserveOldLogs: true

# -- DU configuration file
config:
  du-config.yml: |-
    f1ap:
      addrs: 127.0.10.1
      bind_addrs: 127.0.10.2

    f1u:
      socket:
        - bind_addr: 127.0.10.2

    ru_sdr:
      device_driver: uhd
      device_args: type=b200,num_recv_frames=64,num_send_frames=64
      srate: 23.04
      otw_format: sc12
      tx_gain: 80
      rx_gain: 40

    cell_cfg:
      dl_arfcn: 650000
      band: 78
      channel_bandwidth_MHz: 20
      common_scs: 30
      plmn: "00101"
      tac: 7
      pci: 1

    log:
      filename: /var/log/ocudu/du.log
      all_level: warning

    metrics:
      autostart_stdout_metrics: false
      enable_json: false
      enable_log: false

    pcap:
      mac_enable: false
      mac_filename: /var/log/ocudu/du_mac.pcap
      f1ap_enable: false
      f1ap_filename: /var/log/ocudu/du_f1ap.pcap
      f1u_enable: false
      f1u_filename: /var/log/ocudu/du_f1u.pcap
