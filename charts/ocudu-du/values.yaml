# -- Container image configuration
image:
  # -- Container image repository
  # See https://gitlab.com/ocudu/ocudu/container_registry for available images
  repository: registry.gitlab.com/ocudu/ocudu/images/du-dpdk
  # repository: registry.gitlab.com/ocudu/ocudu/images/du-uhd
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image tag, `ubuntu-24.04-<avx512|avx2|neon>-<date>_<commit>`. Pick the CPU variant
  # the node supports. Always quote in values files.
  tag: "ubuntu-24.04-avx512-20261007_2e9f5671"

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- Number of DU replicas
# The DU is stateful and instances do not coordinate with each other — keep this
# at 1. A DU driving real radio hardware cannot be replicated at all, since the
# fronthaul device is bound to one pod.
replicaCount: 1

# -- Override the name of the chart
nameOverride: ""

# -- Override the full name of resources
fullnameOverride: ""

# -- ConfigMap name overrides
configmap:
  main: { nameOverride: "" }
  entrypoint: { nameOverride: "" }

# -- Service account configuration
serviceAccount:
  create: true
  annotations: {}
  name: ""
  # -- Mount the service account token into the pod
  # Neither entrypoint.sh nor the odu binary talks to the Kubernetes API, so the
  # token is not mounted by default. Applied to both the ServiceAccount and the
  # pod spec (the pod-level setting takes precedence).
  # @default -- `false`
  automountServiceAccountToken: false

# -- RBAC configuration
# Nothing in the DU pod uses the Kubernetes API, so no Role/RoleBinding is
# created by default. Set `create: true` if extraRules or a sidecar genuinely
# need API access — and then also allow the token to be mounted via
# `serviceAccount.automountServiceAccountToken`.
rbac:
  create: false
  extraRules: []

# -- Pod Disruption Budget configuration
podDisruptionBudget:
  enabled: true
  minAvailable: 0
  unhealthyPodEvictionPolicy: AlwaysAllow

# -- Additional pod annotations
podAnnotations: {}

# -- RuntimeClass used for the DU pod (for example, an OpenShift PerformanceProfile RuntimeClass)
runtimeClassName: ""

# -- Extra labels applied to the Deployment and Pod template
extraLabels: {}

# -- Deployment update strategy
# OCUDU DU is stateful and normally should not run overlapping old/new pods.
# Use RollingUpdate only when the runtime/config/storage behavior has been validated
# for overlapping pods.
deploymentStrategy:
  type: Recreate

# -- DU startup probe configuration
# Holds off the liveness and readiness probes until odu is running, so neither
# needs padding on initialDelaySeconds and the pod reports Ready within one probe
# period of the process appearing. Startup budget is
# periodSeconds * failureThreshold (180s by default), which also covers O1 mode
# where the entrypoint waits for the adapter-generated config first, and DPDK
# builds where EAL initialization adds to startup.
startupProbe:
  enabled: true
  periodSeconds: 2
  timeoutSeconds: 1
  failureThreshold: 90

# -- DU liveness probe configuration
# initialDelaySeconds stays at 90 even though startupProbe already gates this
# probe. It costs nothing while the startup probe is enabled, and it preserves
# the original tolerance if someone disables it.
livenessProbe:
  enabled: true
  initialDelaySeconds: 90
  periodSeconds: 30
  timeoutSeconds: 1
  failureThreshold: 3
  successThreshold: 1

# -- DU readiness probe configuration
# startupProbe gates this probe, so initialDelaySeconds is not needed. The
# timeout and failureThreshold are deliberately not minimal: this is an exec
# probe, and under node pressure spawning pgrep can exceed a 1s timeout. With a
# single replica there is no second endpoint, so flapping readiness is a real
# F1-C/F1-U outage rather than a cosmetic blip.
readinessProbe:
  enabled: true
  initialDelaySeconds: 0
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 6
  successThreshold: 1

# -- Pod-level security context. Runs the container as a non-root user by default.
# @default -- see below
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# -- Init process command used as container PID 1.
# Reaps zombie processes and forwards signals to the DU process.
# @default -- `["/usr/bin/catatonit", "-g", "--"]`
initCommand:
  - /usr/bin/catatonit
  - -g
  - --

# -- Container-level security context.
#
# Default: minimum-privilege shape for SR-IOV Device Plugin + vfio-pci.
# Requires the image to have file capabilities baked into /usr/local/bin/odu
# (setcap cap_sys_nice,cap_ipc_lock,cap_perfmon+p) and containerd
# `device_ownership_from_security_context = true` on the node. odu starts with
# whichever of the three the container grants; without PERFMON only the power
# metric is missing.
securityContext:
  allowPrivilegeEscalation: true
  privileged: false
  capabilities:
    drop: ["ALL"]
    add:
      - SYS_NICE
      - IPC_LOCK
      - PERFMON

# -- Resource requests and limits. Required: requests and limits must each set cpu and memory.
# Hugepages are automatically configured when defined in limits or requests.
# The chart detects hugepages-1Gi or hugepages-2Mi and creates volumes accordingly.
#
# Example with 1Gi hugepages (recommended):
# ```yaml
# resources:
#   limits:
#     cpu: 12
#     memory: 16Gi
#     hugepages-1Gi: 2Gi
#   requests:
#     cpu: 12
#     memory: 16Gi
#     hugepages-1Gi: 2Gi
# ```
#
# Example with 2Mi hugepages:
# ```yaml
# resources:
#   limits:
#     cpu: 12
#     memory: 16Gi
#     hugepages-2Mi: 2Gi
#   requests:
#     cpu: 12
#     memory: 16Gi
#     hugepages-2Mi: 2Gi
# ```
resources:
  # -- Resource limits for the DU container
  # Include hugepages-1Gi or hugepages-2Mi to automatically enable hugepage volumes
  limits: {}
    # cpu: 12
    # memory: 16Gi
    # hugepages-1Gi: 2Gi
    # hugepages-2Mi: 2Gi

  # -- Resource requests for the DU container
  # Include hugepages-1Gi or hugepages-2Mi to automatically enable hugepage volumes
  requests: {}
    # cpu: 12
    # memory: 16Gi
    # hugepages-1Gi: 2Gi
    # hugepages-2Mi: 2Gi

# -- Network configuration
network:
  # -- Enable host network mode
  # false (default): Uses CNI network with SR-IOV for production (NetworkPolicy supported)
  # true: Uses host network namespace directly (simple setup, NetworkPolicy NOT supported)
  # @default -- `false`
  hostNetwork: false

# -- Node selector for pod assignment
# A DU driving real radio hardware legitimately has to be pinned to the node
# holding the fronthaul NIC, and then `node_drain` cannot pass by definition.
# With `ru_dummy` there is no hardware to be near, so leave this empty and let
# the pod be rescheduled. Prefer a capability label over `kubernetes.io/hostname`
# where a pin is genuinely needed.
nodeSelector: {}

# -- Tolerations for pod assignment
tolerations: {}

# -- Pod affinity configuration
affinity: {}

# -- Topology spread constraints for pod assignment
topologySpreadConstraints: []

# -- Priority class assigned to the pod
# A high-priority class helps the DU get rescheduled ahead of best-effort
# workloads after a node drain or under node pressure.
priorityClassName: ""

# -- Metrics service configuration
# Exposes DU metrics endpoint for Telegraf collection
metricsService:
  # -- Enable metrics service
  enabled: false

  # -- Service type (ClusterIP, NodePort, or LoadBalancer)
  # @default -- `ClusterIP`
  type: ClusterIP

  # -- LoadBalancer IP address (optional, when type is LoadBalancer)
  # @default -- `""` (auto-assign)
  loadBalancerIP: ""

  # -- LoadBalancer class (optional, for clusters with multiple LB implementations)
  # @default -- `""` (use default)
  loadBalancerClass: ""

  # -- External traffic policy (Cluster or Local)
  # @default -- `Cluster`
  externalTrafficPolicy: Cluster

  # -- Session affinity (None or ClientIP)
  # @default -- `None`
  sessionAffinity: None

  # -- NodePort (optional, only used when type is NodePort)
  # @default -- `""` (auto-assign)
  nodePort: ""

  # -- Service port (must match the port in du-config.yml)
  port: 8001

  # -- Target port (container port)
  targetPort: 8001

# -- Service for F1-C interface (F1AP - SCTP:38472 to CU-CP)
f1cService:
  # -- Enable F1-C service
  enabled: true
  # -- Service type (ClusterIP, NodePort, or LoadBalancer)
  # @default -- `ClusterIP`
  type: ClusterIP
  # -- LoadBalancer IP address (optional)
  loadBalancerIP: ""
  # -- LoadBalancer class (optional)
  loadBalancerClass: ""
  # -- External traffic policy (Cluster or Local)
  externalTrafficPolicy: Cluster
  # -- Session affinity (None or ClientIP)
  sessionAffinity: None
  # -- Service port
  port: 38472
  # -- NodePort (optional, only used when type is NodePort)
  nodePort: ""

# -- Service for F1-U interface (GTP-U - UDP:2152 to CU-UP)
f1uService:
  # -- Enable F1-U service
  enabled: true
  # -- Service type (ClusterIP, NodePort, or LoadBalancer)
  # @default -- `ClusterIP`
  type: ClusterIP
  # -- LoadBalancer IP address (optional)
  loadBalancerIP: ""
  # -- LoadBalancer class (optional)
  loadBalancerClass: ""
  # -- External traffic policy (Cluster or Local)
  externalTrafficPolicy: Cluster
  # -- Session affinity (None or ClientIP)
  sessionAffinity: None
  # -- Service port
  port: 2152
  # -- NodePort (optional, only used when type is NodePort)
  nodePort: ""

# -- NetworkPolicy configuration
# Restricts network traffic to/from the DU pod for enhanced security
# IMPORTANT: NetworkPolicy only works when network.hostNetwork is false
networkPolicy:
  # -- Enable NetworkPolicy
  # Only effective when network.hostNetwork is false
  # @default -- `false`
  enabled: false

  # -- Ingress rules (incoming traffic to DU)
  ingress:
    # -- Allow traffic from CU (F1-C/F1-U interfaces)
    cu:
      # -- Enable CU ingress
      # @default -- `true`
      enabled: true
      # -- Source selectors for CU traffic
      from:
        - podSelector:
            matchLabels:
              app: ocudu-cu
        - ipBlock:
            cidr: 10.0.0.0/8  # Adjust for your network CIDR

    # -- Allow traffic from monitoring systems
    monitoring:
      # -- Enable monitoring ingress
      # @default -- `true`
      enabled: true
      # -- Source selectors for monitoring traffic
      from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
        - podSelector:
            matchLabels:
              app: telegraf

    # -- Custom ingress rules
    # @default -- `[]`
    custom: []

  # -- Egress rules (outgoing traffic from DU)
  egress:
    # -- Allow traffic to CU (F1-C/F1-U)
    cu:
      # -- Enable CU egress
      # @default -- `true`
      enabled: true
      # -- Destination selectors for CU traffic
      to:
        - podSelector:
            matchLabels:
              app: ocudu-cu
        - ipBlock:
            cidr: 10.0.0.0/8  # Adjust for your network CIDR

    # -- Allow traffic to monitoring systems
    monitoring:
      # -- Enable monitoring egress
      # @default -- `true`
      enabled: true
      # -- Destination selectors for monitoring traffic
      to:
        - namespaceSelector:
            matchLabels:
              name: monitoring
        - podSelector:
            matchLabels:
              app: influxdb

    # -- Custom egress rules
    # @default -- `[]`
    custom: []

# -- IPsec protection for the F1 interfaces.
# Adds a strongSwan sidecar to this pod. The pod becomes its own IPsec endpoint: one
# daemon, one IKE association, and one child association per protected interface. Every
# pod has its own network namespace, so two pods on the same node are still two separate
# endpoints and the traffic between them is still encrypted.
#
# The application is not modified and never sees the private key. It binds to the
# protected addresses listed under `connections`, and that is what sends its traffic
# through the tunnel.
ipsec:
  # -- Enable the IPsec sidecar.
  # Requires Kubernetes 1.29 or newer, `network.hostNetwork: false`, and a node whose
  # kernel provides XFRM interfaces and ESP.
  # @default -- `false`
  enabled: false

  image:
    # -- Container image repository
    repository: registry.gitlab.com/ocudu/ocudu_elements/ocudu_helm/ipsec-sidecar
    # -- Image tag
    tag: "6.0.4"
    # -- Image pull policy
    pullPolicy: IfNotPresent

  # -- Secret holding this pod's identity: `tls.crt`, `tls.key` and `ca.crt`.
  # Bring your own. It is mounted read-only into the sidecar and nowhere else.
  certSecret: ""

  # -- IKE identity this pod presents. It must match a subject or subject alternative
  # name of `tls.crt` in `certSecret`.
  localId: ""

  peer:
    # -- IKE identity the peer must present. The connection is refused if the peer
    # presents anything else.
    id: ""
    # -- Address or name of the peer's outer endpoint.
    # Set it and this side starts the connection. Leave it empty and this side waits for
    # the peer, which is what a side with no stable peer address should do.
    # Use a headless service name, never a cluster IP service: a cluster IP forwards only
    # the ports it declares and rewrites addresses, which breaks address detection.
    address: ""

  # -- How ESP is carried: `udp` (ESP inside UDP port 4500) or `native` (IP protocol 50).
  # `udp` is the default because every CNI carries UDP, and because a NetworkPolicy cannot
  # name IP protocol 50. With `native` the policy has to allow every protocol to the peer,
  # which re-opens the plaintext path this feature exists to close.
  # @default -- `udp`
  encapsulation: udp

  # -- The address range the protected addresses are taken from.
  # The sidecar installs a route that refuses this whole range before any tunnel exists,
  # so a protected address is never reachable by another path, not even for a moment.
  protectedSupernet: 100.64.0.0/16

  # -- The interfaces to protect: one child association each, all under a single IKE
  # association. Required when `enabled` is true. For example:
  #
  #   connections:
  #     f1c:
  #       ifName: ipsec-f1c
  #       ifId: 257
  #       local: 100.64.10.1
  #       remote: 100.64.10.2
  #     f1u:
  #       ifName: ipsec-f1u
  #       ifId: 258
  #       local: 100.64.30.1
  #       remote: 100.64.30.2
  #       espProposal: aes256gcm16-ecp256-esn-noesn
  #
  # `ifId` is a local number only. Nothing about it is negotiated or sent, so the two ends
  # need not agree on it, but it must be unique inside the pod and must not be 0.
  # `local` is the address this pod binds to, `remote` is the peer's. Both have to appear
  # in the application config, and the chart refuses to render if they do not.
  # @default -- `{}`
  connections: {}

  ike:
    # -- IKE proposal. Exactly one, so there is nothing to fall back to.
    proposal: aes256gcm16-prfsha384-ecp256
    # -- Default ESP proposal. A connection may override it with `espProposal`.
    espProposal: aes256gcm16-ecp256
    # -- How often the peer is checked
    dpdDelay: 10s
    # -- How long an unanswered peer is tolerated
    dpdTimeout: 30s
    # -- How often the IKE association is rekeyed
    rekeyTime: 4h

  # -- Render even when `networkPolicy.enabled` is false.
  # Without a policy the application can still address the peer's pod address directly and
  # send in clear. Set this true only where unprotected traffic is blocked some other way.
  # @default -- `false`
  allowWithoutNetworkPolicy: false

  readinessProbe:
    # -- Enable the sidecar readiness probe.
    # Off by default. A side that waits for its peer has no association until the peer
    # connects, so a readiness probe there would hold the pod unready waiting for
    # something that cannot have happened yet. It is safe on a side that starts the
    # connection. Traffic is protected either way: the probe reports, it does not enforce.
    # @default -- `false`
    enabled: false
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1

  # -- Annotations for the headless service that publishes this pod's outer address.
  serviceAnnotations: {}

  # -- Resources for the sidecar.
  resources: {}

  # -- Security context for the sidecar.
  # It runs as uid 0 on purpose. Kubernetes does not fill the ambient capability set, so a
  # non-root sidecar would need file capabilities on `ip`, `swanctl` and the daemon, plus
  # `allowPrivilegeEscalation: true` — that is strictly worse than uid 0 with escalation
  # switched off. The application container is untouched and gains nothing.
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    privileged: false
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
      add:
        - NET_ADMIN
        - NET_BIND_SERVICE
    seccompProfile:
      type: RuntimeDefault

# -- SR-IOV configuration
sriovConfig:
  # -- Enable SR-IOV device plugin resource allocation
  # When enabled, requests one SR-IOV VF from the device plugin.
  # @default -- `true`
  enabled: true
  # -- Extended resource name advertised by the SR-IOV device plugin
  # Common values:
  #   intel.com/intel_sriov_dpdk     (DPDK / vfio-pci, for use with hal section)
  #   intel.com/intel_sriov_netdevice (kernel netdev — NOT supported for DU, use DPDK only)
  # @default -- `intel.com/intel_sriov_dpdk`
  extendedResourceName: "intel.com/intel_sriov_dpdk"

# -- Persistent storage configuration
# Disabled by default: logs go to an `emptyDir`, which keeps the pod reschedulable
# onto any node. Enable it to keep logs across pod restarts — worth doing on a
# DU that is pinned to radio hardware anyway.
persistence:
  enabled: false
  # -- Storage type: "pvc" or "hostPath"
  # `hostPath` ties the pod's logs to one node — the pod can then only be
  # rescheduled there, and a node-bound StorageClass (e.g. local-path) has the
  # same effect. Prefer a network-backed StorageClass for a drainable pod, and
  # treat hostPath as a local-debugging option.
  type: pvc
  pvc:
    storageClassName: ""
    accessMode: ReadWriteOnce
    size: 10Gi
  hostPath:
    path: "/mnt/debugging-logs"
    type: DirectoryOrCreate
  mountPath: "/var/log/ocudu"
  preserveOldLogs: true

# -- DU configuration file
config:
  du-config.yml: |-
    f1ap:
      addrs: 127.0.10.1
      bind_addrs: 127.0.10.2

    f1u:
      socket:
        - bind_addr: 127.0.10.2

    ru_sdr:
      device_driver: uhd
      device_args: type=b200,num_recv_frames=64,num_send_frames=64
      srate: 23.04
      otw_format: sc12
      tx_gain: 80
      rx_gain: 40

    cell_cfg:
      dl_arfcn: 650000
      band: 78
      channel_bandwidth_MHz: 20
      common_scs: 30
      plmn: "00101"
      tac: 7
      pci: 1

    log:
      filename: /var/log/ocudu/du.log
      all_level: warning

    metrics:
      autostart_stdout_metrics: false
      enable_json: false
      enable_log: false

    pcap:
      mac_enable: false
      mac_filename: /var/log/ocudu/du_mac.pcap
      f1ap_enable: false
      f1ap_filename: /var/log/ocudu/du_f1ap.pcap
      f1u_enable: false
      f1u_filename: /var/log/ocudu/du_f1u.pcap
