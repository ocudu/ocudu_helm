include:
  - local: .gitlab/ci/helm_utils.yml
  # CNTi Test Suite essential tests of the chart: install it on a kind cluster
  # on the runner in gNB test mode and run the essential tests.
  - component: $CI_SERVER_FQDN/lfn-cnti/testsuite-component/cnti-testsuite@1.1.0
    inputs:
      stage: static
      version: v2.2.0
      cnf_config: .gitlab/cnti/ocudu-gnb/cnti-testsuite.yaml
      install_timeout: "900"

stages:
  - static
  - publish

# The component's job has no rules of its own, and a job without rules does
# not run in merge request pipelines. Run it on merge requests and on main.
cnti-testsuite:
  rules:
    - if: $ON_MR
    - if: $ON_DEFAULT_BRANCH

helm lint:
  extends: .helm lint
  variables:
    CHART_PATH: charts/ocudu-gnb
    LINT_VALUES_FILE: charts/ocudu-gnb/ci/lint-values.yaml

helm version check:
  extends: .helm version check
  variables:
    CHART_PATH: charts/ocudu-gnb
    CHART_NAME: ocudu-gnb

helm publish-dev:
  extends: .helm publish-dev
  variables:
    CHART_PATH: charts/ocudu-gnb
    CHART_NAME: ocudu-gnb
  needs:
    - job: helm lint
    - job: helm version check

helm publish-prod:
  extends: .helm publish-prod
  variables:
    CHART_PATH: charts/ocudu-gnb
    CHART_NAME: ocudu-gnb
