# Minimal values for linting the IPsec path. `ipsec.enabled` is false in the shipped
# defaults, so without this file none of the IPsec templates is ever rendered and none of
# the render-time guards is ever reached.
#
# This is a lint fixture, not a deployment example. The application config below carries
# only the keys the guards read; `docs/ipsec.md` has the worked example.
#
# cert-manager stays off on purpose: its custom resource definitions have no schema here,
# and an unknown kind fails the manifest check.

networkPolicy:
  enabled: true
  egress:
    ric:
      enabled: true
      to:
        - ipBlock:
            cidr: 10.0.0.0/8

ipsec:
  enabled: true
  # E2 to a RIC that terminates IKEv2, so the `e2` section is checked too.
  protectE2: true
  certSecret: ocudu-gnb-ipsec
  localId: gnb-a.example.com
  # Two peers, so every connection names its own. The other gNB in the pair leaves
  # `address` out and waits, with `cu_cp.xnap.no_connection_init` set to match.
  peers:
    ric:
      id: ric.example.com
      address: ric-e2term-ipsec
    xn:
      id: gnb-b.example.com
      address: ocudu-gnb-b-ipsec
  connections:
    e2:
      peer: ric
      protocol: sctp
      local: 100.64.60.1
      remote: 100.64.60.2
    xnc:
      peer: xn
      protocol: sctp
      local: 100.64.40.1
      remote: 100.64.40.2
    xnu:
      peer: xn
      protocol: udp
      local: 100.64.50.1
      remote: 100.64.50.2

config:
  gnb-config.yml: |-
    cu_cp:
      # Xn-C is shaped as a list of gateways, each with a list of peer connections, and
      # the addresses inside are lists too. Written here in that form on purpose: an
      # address on its own line is checked the same as one written beside its key.
      xnap:
        gateways:
          - bind_addrs:
              - 100.64.40.1
            connections:
              - peer_addrs:
                  - 100.64.40.2

    cu_up:
      # Off the core's GTP-U port, which the chart refuses to share with a protected
      # interface. Both ends have to agree on this number.
      xnu:
        bind_port: 2153
        peer_port: 2153
        socket:
          - bind_addr: 100.64.50.1

    e2:
      enable_du_e2: true
      enable_cu_cp_e2: true
      addrs: 100.64.60.2
      bind_addrs: 100.64.60.1
