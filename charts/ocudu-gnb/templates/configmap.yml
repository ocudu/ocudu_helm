{{- if .Values.o1.enable_ocudu_o1 }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ocudu-gnb.o1ConfigmapName" . }}
  labels:
    {{- include "ocudu-gnb.labels" . | nindent 4 }}
{{- if not (include "ocudu-gnb.configmapOverride" (dict "root" . "key" "o1")) }}
immutable: true
{{- end }}
data:
  {{- include "ocudu-gnb.o1ConfigData" . | nindent 2 }}
{{- else }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ocudu-gnb.mainConfigmapName" . }}
  labels:
    {{- include "ocudu-gnb.labels" . | nindent 4 }}
{{- if not (include "ocudu-gnb.configmapOverride" (dict "root" . "key" "main")) }}
immutable: true
{{- end }}
data:
  {{- include "ocudu-gnb.mainConfigData" . | nindent 2 }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ocudu-gnb.entrypointConfigmapName" . }}
  labels:
    {{- include "ocudu-gnb.labels" . | nindent 4 }}
{{- if not (include "ocudu-gnb.configmapOverride" (dict "root" . "key" "entrypoint")) }}
immutable: true
{{- end }}
data:
  {{- include "ocudu-gnb.entrypointData" . | nindent 2 }}
