apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ocudu-gnb.fullname" . }}
  labels:
    {{- include "ocudu-gnb.labels" . | nindent 4 }}
    {{- with .Values.extraLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.deploymentStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ocudu-gnb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if not .Values.o1.enable_ocudu_o1 }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "ocudu-gnb.selectorLabels" . | nindent 8 }}
        {{- with .Values.extraLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "ocudu-gnb.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.network.hostNetwork }}
      hostNetwork: true
      {{- end }}
      volumes:
        - name: entrypoint-volume-ocudu-gnb
          configMap:
            name: {{ include "ocudu-gnb.entrypointConfigmapName" . }}
            defaultMode: 0777
        {{- if .Values.o1.enable_ocudu_o1 }}
        - name: o1-gnb-config
          emptyDir:
            sizeLimit: 2Mi
        - name: netconf-running-config-volume
          emptyDir:
            sizeLimit: 2Mi
        - name: o1-config-volume
          configMap:
            name: {{ include "ocudu-gnb.o1ConfigmapName" . }}
            defaultMode: 0777
        {{- if and .Values.o1.netconfServer.tls.enabled .Values.o1.netconfServer.tls.certSecret }}
        # Production: separate server and client identities, each mounted only where needed
        # so neither container holds the other's private key.
        - name: netconf-tls-certs
          secret:
            secretName: {{ .Values.o1.netconfServer.tls.certSecret }}
        - name: netconf-tls-client-certs
          secret:
            secretName: {{ required "o1.netconfServer.tls.clientCertSecret is required when certSecret is set (the o1 adapter needs client.crt/client.key/ca.crt for mutual TLS)" .Values.o1.netconfServer.tls.clientCertSecret }}
        {{- else if .Values.o1.netconfServer.tls.enabled }}
        # Dev/test: one shared volume. The netconf-server bootstraps a self-signed CA + server
        # + client cert into it and the o1 adapter reads client.crt/client.key/ca.crt back out.
        - name: netconf-tls-certs
          emptyDir:
            sizeLimit: 2Mi
        {{- end }}
        {{- else }}
        - name: config-volume
          configMap:
            name: {{ include "ocudu-gnb.mainConfigmapName" . }}
        {{- end }}
        {{- if .Values.persistence.enabled }}
          {{- if eq .Values.persistence.type "pvc" }}
        - name: ocudu-logs
          persistentVolumeClaim:
            claimName: {{ include "ocudu-gnb.fullname" . }}-logs
          {{- else if eq .Values.persistence.type "hostPath" }}
        - name: ocudu-logs
          hostPath:
            path: {{ .Values.persistence.hostPath.path }}
            type: {{ .Values.persistence.hostPath.type }}
          {{- end }}
        {{- else }}
        - name: ocudu-logs
          emptyDir: {}
        {{- end }}
        - name: ocudu-work
          emptyDir: {}
          {{- if or (and .Values.resources.limits (index .Values.resources.limits "hugepages-1Gi")) (and .Values.resources.requests (index .Values.resources.requests "hugepages-1Gi")) }}
        - name: hugepage-1gi
          emptyDir:
            medium: HugePages-1Gi
        {{- end }}
        {{- if or (and .Values.resources.limits (index .Values.resources.limits "hugepages-2Mi")) (and .Values.resources.requests (index .Values.resources.requests "hugepages-2Mi")) }}
        - name: hugepage-2mi
          emptyDir:
            medium: HugePages-2Mi
        {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          tty: true
          stdin: true
          securityContext:
            {{- if and .Values.metricsService.enabled .Values.metricsService.powercap.enabled }}
            {{- $ctx := deepCopy .Values.securityContext }}
            {{- $_ := set $ctx.capabilities "add" (append $ctx.capabilities.add "PERFMON") }}
            {{- toYaml $ctx | nindent 12 }}
            {{- else }}
            {{- toYaml .Values.securityContext | nindent 12 }}
            {{- end }}
          image: "{{ template "ocudu-gnb.image" .Values.image }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- $hasLimits := and .Values.resources .Values.resources.limits (gt (len .Values.resources.limits) 0) }}
          {{- $hasRequests := and .Values.resources .Values.resources.requests (gt (len .Values.resources.requests) 0) }}
          {{- if or $hasLimits $hasRequests .Values.sriovConfig.enabled }}
          resources:
            {{- if or $hasLimits .Values.sriovConfig.enabled }}
            limits:
              {{- if $hasLimits }}
              {{- $res := .Values.resources }}
              {{- $cleanRes := omit $res "enable_hugepages_1gi" "enable_hugepages_2mi" }}
              {{- toYaml $cleanRes.limits | nindent 14 }}
              {{- end }}
              {{- if .Values.sriovConfig.enabled }}
              {{ .Values.sriovConfig.extendedResourceName }}: 1
              {{- end }}
            {{- end }}
            {{- if or $hasRequests .Values.sriovConfig.enabled }}
            requests:
              {{- if $hasRequests }}
              {{- $res := .Values.resources }}
              {{- $cleanRes := omit $res "enable_hugepages_1gi" "enable_hugepages_2mi" }}
              {{- toYaml $cleanRes.requests | nindent 14 }}
              {{- end }}
              {{- if .Values.sriovConfig.enabled }}
              {{ .Values.sriovConfig.extendedResourceName }}: 1
              {{- end }}
            {{- end }}
          {{- end }}
          {{- if and .Values.o1.enable_ocudu_o1 .Values.livenessProbe.enabled }}
          # O1 mode: liveness is tied to the O1 adapter's /config-healthy endpoint.
          livenessProbe:
            httpGet:
              path: /config-healthy
              port: {{ .Values.o1.healthcheckPort }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
            successThreshold: {{ .Values.livenessProbe.successThreshold }}
          {{- else if and (not .Values.o1.enable_ocudu_o1) .Values.livenessProbe.enabled }}
          livenessProbe:
            exec:
              command: ["pgrep", "gnb"]
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
            successThreshold: {{ .Values.livenessProbe.successThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            exec:
              command: ["pgrep", "gnb"]
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
            successThreshold: {{ .Values.readinessProbe.successThreshold }}
          {{- end }}
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: USE_EXT_CORE
              value: {{ include "useExtCore" . }}
            - name: HOSTNETWORK
              value: '{{ .Values.network.hostNetwork }}'
          {{- if and .Values.service .Values.service.type (eq .Values.service.type "LoadBalancer") }}
            - name: LB_IP
              value: {{ .Values.service.loadBalancerIP | quote }}
          {{- end }}
          {{- if and .Values.sriovConfig .Values.sriovConfig.enabled }}
            - name: RESOURCE_EXTENDED
              value: {{ .Values.sriovConfig.extendedResourceName | quote }}
          {{- end }}
            - name: OCUDU_LOG_DIR
              value: {{ .Values.persistence.mountPath | quote }}
            - name: OCUDU_WORK_DIR
              value: /run/ocudu
          {{- if .Values.persistence.enabled }}
            - name: PRESERVE_OLD_LOGS
              value: {{ .Values.persistence.preserveOldLogs | quote }}
          {{- end }}
            - name: ENABLE_OCUDU_O1
              value: '{{ default false .Values.o1.enable_ocudu_o1 }}'
          command:
            {{- toYaml .Values.initCommand | nindent 12 }}
          args: [ "/bin/bash", "-c", "/etc/entrypoint/entrypoint-ocudu-gnb.sh /etc/config/gnb-config.yml" ]
          volumeMounts:
            - name: entrypoint-volume-ocudu-gnb
              mountPath: /etc/entrypoint
            {{- if .Values.o1.enable_ocudu_o1 }}
            - name: o1-gnb-config
              mountPath: /etc/config/
            {{- else }}
            - name: config-volume
              mountPath: /etc/config/
            {{- end }}
            - name: ocudu-logs
              mountPath: {{ .Values.persistence.mountPath }}
            - name: ocudu-work
              mountPath: /run/ocudu
            {{- if or (and .Values.resources.limits (index .Values.resources.limits "hugepages-1Gi")) (and .Values.resources.requests (index .Values.resources.requests "hugepages-1Gi")) }}
            - name: hugepage-1gi
              mountPath: /hugepages-1Gi
            {{- end }}
            {{- if or (and .Values.resources.limits (index .Values.resources.limits "hugepages-2Mi")) (and .Values.resources.requests (index .Values.resources.requests "hugepages-2Mi")) }}
            - name: hugepage-2mi
              mountPath: /hugepages-2Mi
            {{- end }}
          {{- if .Values.o1.enable_ocudu_o1 }}
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    timeout=30
                    elapsed=0
                    while [ $elapsed -lt $timeout ]; do
                      response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:{{ .Values.o1.healthcheckPort }}/config-healthy)
                      echo "Health check response: $response"
                      if [[ "$response" =~ 200 || "$response" =~ 400 ]]; then
                        echo "API server is healthy."
                        curl -H "Content-Type: application/json" -d "{restarted:true}" -X POST http://localhost:{{ .Values.o1.healthcheckPort }}/restarted
                        exit 0
                      fi
                      sleep 5
                      elapsed=$((elapsed + 5))
                    done
                    echo "Netconf server not available, last response: $response. Exiting postStart hook."
                    exit 1
          {{- end }}
        {{- if .Values.o1.enable_ocudu_o1 }}
        {{- $adapterFileLog := (.Values.o1.o1Adapter.fileLog).enabled }}
        {{- $adapterLogFile := printf "%s/%s" .Values.persistence.mountPath ((.Values.o1.o1Adapter.fileLog).filename | default "o1-adapter.log") }}
        - name: ocudu-o1-adapter
          securityContext:
            {{- toYaml .Values.o1.o1Adapter.securityContext | nindent 12 }}
          image: "{{ template "ocudu-gnb.o1.o1Adapter.image" .Values.o1.o1Adapter.image }}"
          imagePullPolicy: {{ .Values.o1.o1Adapter.image.pullPolicy }}
          resources:
            {{- toYaml .Values.o1.o1Adapter.resources | nindent 12 }}
          {{- if $adapterFileLog }}
          # Tee the adapter's output onto the shared log volume. The adapter timestamps
          # its own lines, so they are copied verbatim. Handing the flags to the shell as
          # positional parameters ("$0" is the script, "$@" the flags) keeps the list
          # below identical for both invocations.
          command: [ "/bin/sh", "-c" ]
          {{- else }}
          command: [ "/usr/local/bin/python3" ]
          {{- end }}
          args:
            {{- if $adapterFileLog }}
            # -u line-flushes the stream now that stdout is a pipe and not the pod log.
            - exec /usr/local/bin/python3 -u "$0" "$@" 2>&1 | tee -a {{ $adapterLogFile | quote }}
            {{- end }}
            - "/usr/src/app/src/o1_adapter.py"
            - "--netconf_host"
            - {{ .Values.o1.netconfServerAddr }}
            - "--netconf_port"
            - {{ .Values.o1.o1Port | quote }}
            - "--ves_host"
            - {{ .Values.o1.ves.host | quote }}
            - "--ves_port"
            - {{ .Values.o1.ves.port | quote }}
            - "--ves_username"
            - {{ .Values.o1.ves.username | quote }}
            - "--ves_password"
            - {{ .Values.o1.ves.password | quote }}
            - "--ves_scheme"
            - {{ .Values.o1.ves.scheme | quote }}
            - "--ws_host"
            - {{ .Values.o1.ws.host | quote }}
            - "--ws_port"
            - {{ .Values.o1.ws.port | quote }}
            {{- if .Values.o1.oamIpv4Address }}
            - "--oam_ipv4_address"
            - {{ .Values.o1.oamIpv4Address | quote }}
            {{- end }}
            - "--loglevel"
            - {{ .Values.o1.log_level | quote }}
            - "--config"
            - "/etc/config/gnb-config.yml"
            - "--template"
            - "gnb.yaml"
            {{- if .Values.o1.netconfServer.tls.enabled }}
            - "--netconf_tls"
            - "--netconf_tls_port"
            - "6513"
            - "--netconf_tls_cert_dir"
            - "/etc/netconf-tls-client"
            {{- end }}
          volumeMounts:
            - name: o1-gnb-config
              mountPath: /etc/config
            {{- if $adapterFileLog }}
            # Shared log volume (same as the ocu binary logs) so the adapter's
            # output persists alongside them.
            - name: ocudu-logs
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
            {{- if .Values.o1.netconfServer.tls.enabled }}
            - name: {{ if .Values.o1.netconfServer.tls.certSecret }}netconf-tls-client-certs{{ else }}netconf-tls-certs{{ end }}
              mountPath: /etc/netconf-tls-client
              readOnly: true
            {{- end }}
        - name: netconf-server
          securityContext:
            {{- toYaml .Values.o1.netconfServer.securityContext | nindent 12 }}
          image: "{{ template "ocudu-gnb.o1.netconfServer.image" .Values.o1.netconfServer.image }}"
          imagePullPolicy: {{ .Values.o1.netconfServer.image.pullPolicy }}
          resources:
            {{- toYaml .Values.o1.netconfServer.resources | nindent 12 }}
          ports:
            - name: netconf
              containerPort: {{ .Values.o1.o1Port }}
              protocol: TCP
            {{- if .Values.o1.netconfServer.tls.enabled }}
            - name: netconf-tls
              containerPort: 6513
              protocol: TCP
            {{- end }}
          {{- if (.Values.o1.netconfServer.fileLog).enabled }}
          {{- $tlsFlags := "" }}
          {{- if .Values.o1.netconfServer.tls.enabled }}
          {{- $tlsFlags = "--enable-tls --tls-cert-dir /etc/netconf-tls" }}
          {{- end }}
          {{- $ncLogFile := printf "%s/%s" .Values.persistence.mountPath (.Values.o1.netconfServer.fileLog.filename | default "netconf.log") }}
          command: [ "/bin/sh", "-c" ]
          args:
            - >-
              /usr/local/bin/entrypoint.sh --config gnb --custom-config /etc/netconf/o1-config.xml {{ $tlsFlags }} 2>&1
              | while IFS= read -r line || [ -n "$line" ]; do printf '[%s] %s\n' "$(date '+%Y-%m-%d %H:%M:%S')" "$line"; done
              | tee -a {{ $ncLogFile | quote }}
          {{- else }}
          command: [ "/usr/local/bin/entrypoint.sh" ]
          args:
            - "--config"
            - "gnb"
            - "--custom-config"
            - "/etc/netconf/o1-config.xml"
            {{- if .Values.o1.netconfServer.tls.enabled }}
            - "--enable-tls"
            - "--tls-cert-dir"
            - "/etc/netconf-tls"
            {{- end }}
          {{- end }}
          volumeMounts:
            - name: o1-config-volume
              mountPath: /etc/netconf
            - name: netconf-running-config-volume
              mountPath: /etc/netconf-running
            {{- if .Values.o1.netconfServer.tls.enabled }}
            - name: netconf-tls-certs
              mountPath: /etc/netconf-tls
              {{- if .Values.o1.netconfServer.tls.certSecret }}
              readOnly: true
              {{- end }}
            {{- end }}
            {{- if (.Values.o1.netconfServer.fileLog).enabled }}
            # Shared log volume (same as the ocu binary logs) so the timestamped
            # netconf-server output persists alongside them.
            - name: ocudu-logs
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
        {{- end }}
      dnsPolicy: ClusterFirstWithHostNet
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
