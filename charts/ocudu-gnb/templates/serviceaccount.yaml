# The gNB pod's own identity, so it never runs as the namespace's default
# service account. Nothing in the pod uses the Kubernetes API, so no token is
# mounted and no Role is bound.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ocudu-gnb.serviceAccountName" . }}
  labels:
    {{- include "ocudu-gnb.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
