# -- Number of pod replicas
# Note: OCUDU gNB is stateful and requires replicaCount: 1
# @default -- `1` (do not change for stateful workload)
replicaCount: 1

# -- Container image configuration
image:
  # -- Container image repository
  # See https://gitlab.com/ocudu/ocudu/container_registry/ for available images
  repository: registry.gitlab.com/ocudu/ocudu/images/gnb-dpdk
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image tag, `ubuntu-24.04-<avx512|avx2|neon>-<date>_<commit>`. Pick the CPU variant
  # the node supports. Always quote in values files.
  tag: "ubuntu-24.04-avx512-20261007_2e9f5671"

# -- Image pull secrets for private registries
# @default -- See values.yaml
imagePullSecrets: []

# -- Override the name of the chart
# Leaving empty allows Helm to use the chart name for resource naming
# @default -- Chart name (`ocudu-gnb`)
nameOverride: ""

# -- Override the full name of resources
# IMPORTANT: Keep empty to allow multiple instances in the same namespace
# When empty, Helm generates unique names using: <release-name>-<chart-name>
# Example: "gnb1-ocudu-gnb", "gnb2-ocudu-gnb"
# @default -- `<release-name>-<chart-name>`
fullnameOverride: ""

# -- ConfigMap name overrides for different components
# Allows customization of ConfigMap names for advanced use cases
configmap:
  # -- Main gNB configuration ConfigMap name override
  main: { nameOverride: "" }
  # -- O1 adapter configuration ConfigMap name override
  o1: { nameOverride: "" }
  # -- Entrypoint script ConfigMap name override
  entrypoint: { nameOverride: "" }

# -- Service account configuration
# The chart always creates a ServiceAccount for the gNB pod, named after the
# release, so the pod never runs as the namespace's default account. Nothing in
# the pod (entrypoint.sh, the gnb binary) uses the Kubernetes API, so the token
# is never mounted and no Role or RoleBinding is created.
serviceAccount:
  # -- Additional service account annotations, e.g. a cloud identity binding
  # @default -- `{}` (no annotations)
  annotations: {}

# -- Pod Disruption Budget configuration
# Ensures cluster stability during node maintenance and upgrades
# ref: https://kubernetes.io/docs/tasks/run-application/configure-pdb/
podDisruptionBudget:
  # -- Enable PodDisruptionBudget resource
  enabled: true
  # -- Minimum number of available pods
  # Use 0 for single-replica deployments to allow disruption
  # Use only one: minAvailable OR maxUnavailable (not both)
  minAvailable: 0
  # -- Maximum number of unavailable pods
  # Uncomment to use maxUnavailable instead of minAvailable
  # maxUnavailable: 1
  # -- Unhealthy pod eviction policy
  # AlwaysAllow: Allows eviction of unhealthy pods (recommended for production)
  # IfHealthyBudget: Protects unhealthy pods (may block node drains)
  # @default -- `AlwaysAllow`
  unhealthyPodEvictionPolicy: AlwaysAllow

# -- Additional pod annotations
# @default -- `{}` (no additional annotations)
podAnnotations: {}

# -- RuntimeClass used for the gNB pod (for example, an OpenShift PerformanceProfile RuntimeClass)
runtimeClassName: ""

# -- Extra labels applied to the Deployment and Pod template
# @default -- `{}` (no extra labels)
extraLabels: {}

# -- Deployment update strategy
# OCUDU gNB is stateful and normally should not run overlapping old/new pods.
# Use RollingUpdate only when the runtime/config/storage behavior has been validated
# for overlapping pods.
deploymentStrategy:
  type: Recreate

# -- Pod-level security context
# -- Pod-level security context. Runs the container as a non-root user by default.
# @default -- see below
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# -- Init process command used as container PID 1.
# Reaps zombie processes and forwards signals to the gNB process.
# @default -- `["/usr/bin/catatonit", "-g", "--"]`
initCommand:
  - /usr/bin/catatonit
  - -g
  - --

# -- Container-level security context.
#
# Default: minimum-privilege shape for SR-IOV Device Plugin + vfio-pci.
# Requires the image to have file capabilities baked into /usr/local/bin/gnb
# (setcap cap_sys_nice,cap_ipc_lock,cap_perfmon+p) and containerd
# `device_ownership_from_security_context = true` on the node. gnb starts with
# whichever of the three the container grants; without PERFMON only the power
# metric is missing. See docs/security.md for details.
securityContext:
  allowPrivilegeEscalation: true
  privileged: false
  capabilities:
    drop: ["ALL"]
    add:
      - SYS_NICE
      - IPC_LOCK
      - PERFMON

# -- gNB liveness probe configuration.
livenessProbe:
  enabled: true
  initialDelaySeconds: 90
  periodSeconds: 30
  timeoutSeconds: 1
  failureThreshold: 3
  successThreshold: 1

# -- gNB readiness probe configuration.
readinessProbe:
  enabled: true
  initialDelaySeconds: 15
  periodSeconds: 5
  timeoutSeconds: 1
  failureThreshold: 30
  successThreshold: 1

# -- Network configuration
network:
  # -- Enable host network mode
  # false (default): Uses CNI network with SR-IOV for production (NetworkPolicy supported)
  # true: Uses host network namespace directly (simple setup, NetworkPolicy NOT supported)
  # @default -- `false`
  hostNetwork: false

# -- Resource requests and limits. Required: requests and limits must each set cpu and memory.
# Hugepages are automatically configured when defined in limits or requests.
# The chart detects hugepages-1Gi or hugepages-2Mi and creates volumes accordingly.
#
# Example with 1Gi hugepages (recommended for DPDK):
# ```yaml
# resources:
#   limits:
#     cpu: 12
#     memory: 16Gi
#     hugepages-1Gi: 2Gi
#   requests:
#     cpu: 12
#     memory: 16Gi
#     hugepages-1Gi: 2Gi
# ```
#
# Example with 2Mi hugepages (alternative):
# ```yaml
# resources:
#   limits:
#     cpu: 12
#     memory: 16Gi
#     hugepages-2Mi: 2Gi
#   requests:
#     cpu: 12
#     memory: 16Gi
#     hugepages-2Mi: 2Gi
# ```

# The default 4Gi leaves room for the 2 GiB buffer pool OCUDU allocates at startup.
resources:
  # -- Resource limits for the gNB container
  # Include hugepages-1Gi or hugepages-2Mi to automatically enable hugepage volumes
  limits:
    cpu: 4
    memory: 4Gi
    # hugepages-1Gi: 2Gi
    # hugepages-2Mi: 2Gi

  # -- Resource requests for the gNB container
  # Should match limits for guaranteed QoS and CPU pinning
  # Include hugepages-1Gi or hugepages-2Mi to automatically enable hugepage volumes
  requests:
    cpu: 4
    memory: 4Gi
    # hugepages-1Gi: 2Gi
    # hugepages-2Mi: 2Gi

# -- Node selector for pod assignment
# Schedule pods only on nodes with matching labels
# Example:
# ```yaml
# nodeSelector:
#   node-role.kubernetes.io/worker: ""
#   feature.node.kubernetes.io/cpu-cpuid.AVX512F: "true"
# ```
# @default -- `{}` (no node selector)
nodeSelector: {}

# -- Tolerations for pod assignment
# Allows pods to be scheduled on nodes with matching taints
# @default -- `{}` (no tolerations)
tolerations: {}

# -- Pod affinity configuration for advanced scheduling
# @default -- `{}` (no affinity rules)
affinity: {}

# -- Metrics service configuration
# Exposes gNB metrics endpoint for Telegraf collection
metricsService:
  # -- Enable metrics service
  enabled: false

  # -- Service type (ClusterIP, NodePort, or LoadBalancer)
  # @default -- `ClusterIP`
  type: ClusterIP

  # -- LoadBalancer IP address (optional, when type is LoadBalancer)
  # Leave empty for automatic assignment
  # Example: "10.0.0.101"
  # @default -- `""` (auto-assign)
  loadBalancerIP: ""

  # -- LoadBalancer class (optional, for clusters with multiple LB implementations)
  # Example: "metallb" or "cloud-provider-lb"
  # @default -- `""` (use default)
  loadBalancerClass: ""

  # -- External traffic policy (Cluster or Local)
  # Only applies when type is LoadBalancer or NodePort
  # - Cluster: Load balances across all nodes (default)
  # - Local: Preserves source IP, only routes to local pods
  # @default -- `Cluster`
  externalTrafficPolicy: Cluster

  # -- Session affinity (None or ClientIP)
  # @default -- `None`
  sessionAffinity: None

  # -- NodePort (optional, only used when type is NodePort)
  # If not specified, Kubernetes will auto-assign a port from the NodePort range
  # Example: 30555
  # @default -- `""` (auto-assign)
  nodePort: ""

  # -- Service port (must match the port in gnb-config.yml)
  port: 8001

  # -- Target port (container port)
  targetPort: 8001

# -- LoadBalancer service configuration for N2/N3 interfaces
# Used for exposing gNB to external 5G Core network
# ref: https://kubernetes.io/docs/concepts/services-networking/service/#loadbalancer
service:
  # -- Enable service for N2/N3 interfaces (5G Core connectivity)
  # When enabled, creates a service for external 5G Core connectivity
  enabled: false

  # -- Service type (ClusterIP, NodePort, or LoadBalancer)
  # @default -- `LoadBalancer`
  type: LoadBalancer

  # -- IP addresses routed to this Service by the surrounding network
  externalIPs: []

  # -- N3 address advertised by the gNB to the core while it binds to the pod IP
  # Defaults to loadBalancerIP when empty
  advertisedAddress: ""

  # -- LoadBalancer IP address (optional, cluster-dependent)
  # Leave empty for automatic assignment
  # Example: "10.0.0.100"
  # @default -- `""` (auto-assign)
  loadBalancerIP: ""

  # -- LoadBalancer class (optional, for clusters with multiple LB implementations)
  # Example: "metallb" or "cloud-provider-lb"
  # @default -- `""` (use default)
  loadBalancerClass: ""

  # -- External traffic policy (Cluster or Local)
  # - Cluster: Load balances across all nodes (default)
  # - Local: Preserves source IP, only routes to local pods
  # @default -- `Cluster`
  externalTrafficPolicy: Cluster

  # -- Session affinity (None or ClientIP)
  # @default -- `None`
  sessionAffinity: None

  # -- Port configuration for N2 and N3 interfaces
  ports:
    # -- N2 interface (NGAP - control plane to AMF)
    n2:
      # -- Enable N2 port
      enabled: true
      # -- External port
      port: 38412
      # -- Container target port (must match gnb-config.yml)
      # @default -- Same as port
      targetPort: 38412
      # -- Protocol (SCTP for NGAP)
      protocol: SCTP
      # -- NodePort (optional, only used when type is NodePort)
      # If not specified, Kubernetes will auto-assign a port from the NodePort range
      # Example: 30412
      # @default -- `""` (auto-assign)
      nodePort: ""

    # -- N3 interface (GTP-U - user plane to UPF)
    n3:
      # -- Enable N3 port
      enabled: true
      # -- External port
      port: 2152
      # -- Container target port (must match gnb-config.yml)
      # @default -- Same as port
      targetPort: 2152
      # -- Protocol (UDP for GTP-U)
      protocol: UDP
      # -- NodePort (optional, only used when type is NodePort)
      # If not specified, Kubernetes will auto-assign a port from the NodePort range
      # Example: 30152
      # @default -- `""` (auto-assign)
      nodePort: ""

# -- Persistent storage configuration
# The chart supports both PVC (with StorageClass) and hostPath storage for debugging logs
persistence:
  # -- Enable persistent storage for debugging logs
  # When disabled, logs are stored in ephemeral pod storage (lost on pod restart)
  # @default -- `true`
  enabled: true
  
  # -- Storage type: "pvc" or "hostPath"
  # - "pvc": Uses PersistentVolumeClaim with dynamic provisioning (recommended for cloud)
  # - "hostPath": Direct mount from host filesystem (recommended for bare-metal)
  # @default -- `hostPath`
  type: hostPath
  
  # -- PVC configuration (used when type is "pvc")
  pvc:
    # -- Storage class name for dynamic provisioning
    # Leave empty to use the cluster's default StorageClass
    # Check available: kubectl get storageclass
    # @default -- `""` (cluster default)
    storageClassName: ""
    
    # -- Access mode for the persistent volume
    # ReadWriteOnce: Volume can be mounted read-write by a single node
    # @default -- `ReadWriteOnce`
    accessMode: ReadWriteOnce
    
    # -- Storage size for the persistent volume
    # @default -- `10Gi`
    size: 10Gi
  
  # -- hostPath configuration (used when type is "hostPath")
  hostPath:
    # -- Path on the host node where logs will be stored
    # Ensure this path exists or can be created on worker nodes
    # @default -- `/mnt/debugging-logs`
    path: "/mnt/debugging-logs"
    
    # -- hostPath type (DirectoryOrCreate, Directory, etc.)
    # DirectoryOrCreate: Creates directory if it doesn't exist
    # @default -- `DirectoryOrCreate`
    type: DirectoryOrCreate
  
  # -- Mount path inside the container where logs are written
  # @default -- `/var/log/ocudu`
  mountPath: "/var/log/ocudu"
  
  # -- Preserve logs from previous runs (append mode)
  # When true, logs are appended; when false, logs are overwritten
  # @default -- `true`
  preserveOldLogs: true

# -- O1 interface configuration
# Enables NETCONF-based management interface for the gNB
o1:
  # -- Enable O1 interface containers (NETCONF server + O1 adapter)
  enable_ocudu_o1: false
  # -- VES collector connection settings (consumed by the O1 adapter)
  ves:
    # -- Connection scheme: http or https
    scheme: https
  netconfServer:
    tls:
      # -- Enable NETCONF-over-TLS endpoint on port 6513 (alongside the default SSH endpoint on o1Port)
      enabled: false
      # -- Name of a Secret containing ca.crt, server.crt, server.key
      # If empty and tls.enabled is true, the container auto-generates self-signed certs at startup (dev/test only)
      # Create with: kubectl create secret generic <name> --from-file=ca.crt=./ca.crt --from-file=server.crt=./server.crt --from-file=server.key=./server.key
      certSecret: ""
      # -- Fixed NodePort for the NETCONF-over-TLS endpoint (port 6513). Leave empty for auto-assignment.
      tlsNodePort: ""

    ssh:
      # -- NETCONF SSH username with password authentication (ietf-ssh-server local
      # user, RFC 9644). Enables the SSH "password" method for clients that only
      # implement password authentication. Empty = disabled (old behavior).
      # The image's setup_ssh_user.sh creates the user and its NACM grant from the
      # NETCONF_SSH_USERNAME/NETCONF_SSH_PASSWORD env vars the chart maps here.
      username: ""
      # -- Existing Secret with key "password" holding the NETCONF user's password
      # (production). Cleartext is stored as $0$<password>; a value starting with $
      # (e.g. $6$... from mkpasswd -m sha-512 / openssl passwd -6) is used verbatim.
      # Create with: kubectl create secret generic <name> --from-literal=password='...'
      passwordSecret: ""
      # -- Dev/test only: cleartext password the chart renders into a Secret itself.
      # Ignored when passwordSecret is set. Username without either fails rendering.
      password: ""

# -- SR-IOV configuration
# Required when network.hostNetwork is false (default)
# Provides high-performance network interfaces via SR-IOV Virtual Functions (VFs)
# See README.md for SR-IOV setup instructions
sriovConfig:
  # -- Enable SR-IOV network device plugin
  # Must be true when hostNetwork is false
  # Requires SR-IOV device plugin deployed in cluster
  # @default -- `true`
  enabled: true

  # -- Extended resource name from SR-IOV device plugin
  # This must match the resource name configured in your SR-IOV device plugin
  # Common values:
  #   - intel.com/intel_sriov_netdevice (Intel NICs)
  #   - intel.com/intel_sriov_dpdk (Intel NICs with DPDK)
  #   - mellanox.com/cx5_sriov_switchdev (Mellanox NICs)
  # Check available resources: kubectl get node <node-name> -o json | jq '.status.allocatable'
  # Note: SR-IOV resources must be manually specified in the resources.limits/requests section
  # @default -- `intel.com/intel_sriov_netdevice`
  extendedResourceName: "intel.com/intel_sriov_netdevice"

# -- NetworkPolicy configuration
# Restricts network traffic to/from the gNB pod for enhanced security
# IMPORTANT: NetworkPolicy only works when network.hostNetwork is false
# When hostNetwork is true, the pod uses the host's network namespace and
# bypasses Kubernetes NetworkPolicy entirely
networkPolicy:
  # -- Enable NetworkPolicy
  # Only effective when network.hostNetwork is false
  # Check cluster support: kubectl api-versions | grep networking.k8s.io/v1
  # @default -- `false`
  enabled: false

  # -- Ingress rules (incoming traffic to gNB)
  ingress:
    # -- Allow traffic from 5G Core (N2/N3 interfaces)
    fiveGCore:
      # -- Enable 5G Core ingress
      # @default -- `true`
      enabled: true
      # -- Source selectors for 5G Core traffic
      # @default -- See values.yaml
      from:
        - podSelector:
            matchLabels:
              app: open5gs
        - ipBlock:
            cidr: 10.0.0.0/8  # Adjust for your core network CIDR

    # -- Allow traffic from monitoring systems
    monitoring:
      # -- Enable monitoring ingress
      # @default -- `true`
      enabled: true
      # -- Source selectors for monitoring traffic
      # @default -- See values.yaml
      from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
        - podSelector:
            matchLabels:
              app: telegraf

    # -- Allow traffic from management systems (O1/NETCONF)
    management:
      # -- Enable management ingress
      # @default -- `false`
      enabled: false
      # -- Source selectors for management traffic
      # @default -- See values.yaml
      from:
        - namespaceSelector:
            matchLabels:
              name: management
        - podSelector:
            matchLabels:
              app: onap-smo

    # -- Allow ingress from an Xn peer (Xn-C/XnAP, Xn-U/GTP-U).
    # Off by default, because most deployments have no Xn peer and a rule for one that
    # does not exist opens a port for nothing. The selectors name the charts that
    # terminate Xn in the same namespace; a peer elsewhere needs its own selector.
    xn:
      enabled: false
      # -- The UDP port Xn-U uses while IPsec is off, matching `cu_up.xnu.bind_port` in the
      # application config. Xn-C's port is fixed in the application, so it needs no key.
      # With IPsec on neither is opened: the peer is allowed the tunnel and nothing else.
      xnuPort: 2152
      from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ocudu-gnb
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ocudu-cu-cp
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ocudu-cu-up

    # -- Custom ingress rules
    # Add additional ingress rules as needed
    # Example:
    # custom:
    #   - from:
    #       - podSelector:
    #           matchLabels:
    #             app: custom-app
    #     ports:
    #       - protocol: TCP
    #         port: 9000
    # @default -- `[]`
    custom: []

  # -- Egress rules (outgoing traffic from gNB)
  egress:
    # -- Allow traffic to 5G Core
    fiveGCore:
      # -- Enable 5G Core egress
      # @default -- `true`
      enabled: true
      # -- Destination selectors for 5G Core traffic
      # @default -- See values.yaml
      to:
        - podSelector:
            matchLabels:
              app: open5gs
        - ipBlock:
            cidr: 10.0.0.0/8  # Adjust for your core network CIDR

    # -- Allow traffic to monitoring systems
    monitoring:
      # -- Enable monitoring egress
      # @default -- `true`
      enabled: true
      # -- Destination selectors for monitoring traffic
      # @default -- See values.yaml
      to:
        - namespaceSelector:
            matchLabels:
              name: monitoring
        - podSelector:
            matchLabels:
              app: influxdb

    # -- Where the cluster DNS lives.
    # The default names the cluster DNS pods. That is the narrow answer, and it works on a
    # CNI that translates a service address before it applies policy. Some CNIs apply
    # policy to the service address itself; there this rule matches nothing, every name
    # lookup fails, and anything that resolves a name at startup never starts. Set it to
    # `[]` to allow port 53 to any destination instead: wider on destinations, still only
    # port 53.
    # @default -- the cluster DNS pods
    dnsTo:
      - namespaceSelector: {}
        podSelector:
          matchLabels:
            k8s-app: kube-dns

    # -- Allow egress to an Xn peer (Xn-C/XnAP, Xn-U/GTP-U).
    # Off by default, because most deployments have no Xn peer and a rule for one that
    # does not exist opens a port for nothing. The selectors name the charts that
    # terminate Xn in the same namespace; a peer elsewhere needs its own selector.
    xn:
      enabled: false
      # -- The UDP port Xn-U uses while IPsec is off, matching `cu_up.xnu.bind_port` in the
      # application config. Xn-C's port is fixed in the application, so it needs no key.
      # With IPsec on neither is opened: the peer is allowed the tunnel and nothing else.
      xnuPort: 2152
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ocudu-gnb
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ocudu-cu-cp
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ocudu-cu-up

    # -- Custom egress rules
    # Add additional egress rules as needed
    # Example:
    # custom:
    #   - to:
    #       - podSelector:
    #           matchLabels:
    #             app: custom-service
    #     ports:
    #       - protocol: TCP
    #         port: 8080
    # @default -- `[]`
    custom: []

ipsec:
  # -- Enable the IPsec sidecar.
  # Requires Kubernetes 1.29 or newer, `network.hostNetwork: false`, and a node whose
  # kernel provides XFRM interfaces and ESP.
  # @default -- `false`
  enabled: false

  image:
    # -- Container image repository
    repository: registry.gitlab.com/ocudu/ocudu_elements/ocudu_helm/ipsec-sidecar
    # -- Image tag
    tag: "6.0.4"
    # -- Image pull policy
    pullPolicy: IfNotPresent

  # -- Secret holding this pod's identity: `tls.crt`, `tls.key` and `ca.crt`.
  # Bring your own, or have `certManager` below issue it. It is mounted read-only into the
  # sidecar and nowhere else.
  certSecret: ""

  certManager:
    # -- Issue `certSecret` with cert-manager instead of bringing your own.
    # Off by default. It renders a `Certificate`, so the cert-manager custom resource
    # definitions have to be installed on the cluster first. The secret cert-manager
    # writes holds `tls.crt`, `tls.key` and `ca.crt`, which is what the sidecar reads.
    # The sidecar reads them once, at start: a renewal replaces the secret but does not
    # restart the daemon, so restart the pod to pick a renewed certificate up.
    # @default -- `false`
    enabled: false

    issuerRef:
      # -- Issuer to sign with. Required when `certManager.enabled` is true.
      name: ""
      # -- `Issuer` for one namespace, or `ClusterIssuer` for the whole cluster
      kind: Issuer
      # -- API group of the issuer
      group: cert-manager.io

    # -- How long an issued certificate is valid for
    duration: 2160h
    # -- How long before expiry it is renewed
    renewBefore: 360h

    privateKey:
      # -- Key algorithm. The default matches the elliptic-curve group in `ike.proposal`.
      algorithm: ECDSA
      # -- Key size
      size: 256
      # -- Whether a renewal also makes a new private key
      rotationPolicy: Always

    # -- Subject alternative names to request.
    # The default asks for `localId`, which is the identity the peer checks, and is right
    # whenever that identity is a name. Where it is not — a distinguished name or an email
    # address — leave this empty and put the matching field in `extraSpec` instead.
    # @default -- `[localId]`
    dnsNames: []

    # -- Extra fields merged into the `Certificate` spec, for anything the keys above do
    # not name, such as `subject`, `emailAddresses` or `ipAddresses`.
    extraSpec: {}

  # -- IKE identity this pod presents. It must match a subject or subject alternative
  # name of `tls.crt` in `certSecret`.
  localId: ""

  # -- The peers this pod builds an IKE association with, keyed by a name you choose.
  # One association per peer, each carrying the connections that name it. Required when
  # `enabled` is true. For example:
  #
  #   peers:
  #     xn:
  #       id: gnb-b.ocudu.example
  #       address: ocudu-gnb-b-ipsec
  #
  # `id` is the identity the peer must present, and the connection is refused if it
  # presents anything else. `address` is the peer's outer endpoint: set it and this side
  # starts the connection, leave it empty and this side waits for the peer, which is what
  # a side with no stable peer address should do. Use a headless service name, never a
  # cluster IP service: a cluster IP forwards only the ports it declares and rewrites
  # addresses, which breaks address detection.
  # @default -- `{}`
  peers: {}

  # -- How ESP is carried: `udp` (ESP inside UDP port 4500) or `native` (IP protocol 50).
  # `udp` is the default because every CNI carries UDP, and because a NetworkPolicy cannot
  # name IP protocol 50. With `native` the policy has to allow every protocol to the peer,
  # which re-opens the plaintext path this feature exists to close.
  # @default -- `udp`
  encapsulation: udp

  # -- The address range the protected addresses are taken from.
  # The sidecar installs a route that refuses this whole range before any tunnel exists,
  # so a protected address is never reachable by another path, not even for a moment.
  protectedSupernet: 100.64.0.0/16

  # -- Move IKE off the privileged port so the sidecar can drop `NET_BIND_SERVICE`.
  # With this on, IKE is carried on UDP 4500 only and UDP 500 is never bound, so the
  # capability that exists to bind a privileged port is not needed. **Both ends have to
  # agree**: a peer still expecting UDP 500 will not connect.
  # @default -- `false`
  ikeOnNatTPortOnly: false

  # -- Allow Xn-U to stay on the core's GTP-U port while IPsec is on.
  # The policy has to let the application reach the core on UDP 2152 for N3, and that rule
  # names a port, not a peer. If Xn-U uses the same port, that one rule also permits
  # plaintext Xn-U to the peer's pod address. Moving Xn-U to any other port closes it.
  # Set this to true only where there is no core to reach.
  # @default -- `false`
  allowXnuOnCorePort: false

  credentialReload:
    # -- Pick up a renewed certificate without a pod restart.
    # The sidecar watches the mounted secret. When it changes it loads the new credentials
    # and closes the IKE association, so the next traffic authenticates with the new
    # certificate. The child policies stay installed throughout, so protected traffic is
    # encrypted or dropped while the association is rebuilt, never sent in clear.
    # @default -- `true`
    enabled: true
    # -- How often the mounted secret is checked, in seconds.
    intervalSeconds: 60

  # -- The interfaces to protect: one child association each, carried by the peer it
  # names. Required when `enabled` is true. For example:
  #
  #   connections:
  #     xnc:
  #       peer: xn
  #       protocol: sctp
  #       local: 100.64.40.1
  #       remote: 100.64.40.2
  #     xnu:
  #       peer: xn
  #       protocol: udp
  #       local: 100.64.50.1
  #       remote: 100.64.50.2
  #       espProposal: aes256gcm16-ecp256-esn-noesn
  #
  # `peer` is a key from `peers`. It may be left out while there is exactly one peer, and
  # is required as soon as there is a second.
  # `protocol` narrows the tunnel to what that interface actually speaks: `sctp` for Xn-C,
  # `udp` for Xn-U. Traffic between the two protected addresses that is not that
  # protocol then matches no policy, so it is dropped rather than encrypted and delivered.
  # Leave it out to admit any protocol, which also admits ICMP and so path-MTU discovery.
  # `ifName` and `ifId` are both derived from the connection name and are only worth setting
  # where a specific value is required. `ifId` is a local number: nothing about it is
  # negotiated or sent, so the two ends need not agree on it.
  # `local` is the address this pod binds to, `remote` is the peer's. Both have to appear
  # in the application config, and the chart refuses to render if they do not.
  # @default -- `{}`
  connections: {}

  ike:
    # -- IKE proposal. Exactly one, so there is nothing to fall back to.
    proposal: aes256gcm16-prfsha384-ecp256
    # -- Default ESP proposal. A connection may override it with `espProposal`.
    espProposal: aes256gcm16-ecp256
    # -- How far out of order a packet may arrive and still be accepted, in packets.
    # 32 is the widest the kernel can manage without extended sequence numbers, and it is
    # what the daemon would have used anyway — set here so the width is a number this chart
    # chose rather than one it inherited. A wider window needs `esn` in `espProposal`, and
    # the chart refuses to render a wider one without it, because the kernel would silently
    # fall back to a window of 1.
    # **0 switches replay protection off entirely**, and that is refused too.
    replayWindow: 32
    # -- How long to wait before resending an unanswered IKE message, in seconds.
    # This pair, not `dpdDelay`, decides how fast a peer that has stopped answering is
    # given up on. The daemon's defaults retry for about 165 seconds, and for all of that
    # time this side keeps encrypting into an association the peer no longer has.
    retransmitTimeout: 2
    # -- How many times an unanswered IKE message is resent before the peer is given up on.
    retransmitTries: 3
    # -- How often the peer is checked
    dpdDelay: 10s
    # -- How long an unanswered peer is tolerated
    dpdTimeout: 30s
    # -- How often the IKE association is rekeyed
    rekeyTime: 4h

  # -- Render even when `networkPolicy.enabled` is false.
  # Without a policy the application can still address the peer's pod address directly and
  # send in clear. Set this true only where unprotected traffic is blocked some other way.
  # @default -- `false`
  allowWithoutNetworkPolicy: false

  startupProbe:
    # -- Hold the application container until the sidecar is set up.
    # The sidecar starts before the application and the application does not start until
    # this passes, so this is what stops the application racing a daemon that is still
    # loading. It checks that the daemon accepted every child it was given and that every
    # tunnel interface exists and carries its address — **not** that a tunnel is up, which
    # a side waiting to be dialled cannot satisfy. A failing startup probe restarts the
    # container, so a stricter check here would turn a slow peer into a crash loop.
    # @default -- `true`
    enabled: true
    initialDelaySeconds: 2
    periodSeconds: 3
    timeoutSeconds: 5
    # 30 tries at 3 seconds gives the daemon 90 seconds to load before the container is
    # restarted. Loading normally takes a second or two.
    failureThreshold: 30
    successThreshold: 1

  readinessProbe:
    # -- Enable the sidecar readiness probe.
    # Ready means every protected interface is protected by the kernel — an installed
    # association, or an installed policy for one that has no traffic yet. An interface
    # that has never carried a packet is still protected, so it counts as ready.
    # Off by default, because a side that waits for its peer has neither until the peer
    # connects, and a probe there would hold the pod unready waiting for something that
    # cannot have happened yet. Safe to turn on for the side that starts the connection.
    # Traffic is protected either way: the probe reports, it does not enforce.
    # @default -- `false`
    enabled: false
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1

  # -- Daemon log level: 0 silent, 1 negotiation, 2 more detail, 4 very verbose.
  # Raise it to follow a negotiation that is not completing; 4 prints key material
  # references and is not for a running deployment.
  logLevel: 1

  # -- Annotations for the headless service that publishes this pod's outer address.
  serviceAnnotations: {}

  # -- Resources for the sidecar.
  # On a node whose kubelet runs the `static` CPU manager policy, set requests equal to
  # limits here. A container is given exclusive CPUs only while the whole pod is
  # Guaranteed, and that needs every container — the sidecar included — to match. Leave
  # them unequal there and adding the sidecar drops the pod to Burstable, taking the
  # application container's pinning with it.
  resources: {}

  # -- Security context for the sidecar.
  # It runs as uid 0 on purpose. Kubernetes does not fill the ambient capability set, so a
  # non-root sidecar would need file capabilities on `ip`, `swanctl` and the daemon, plus
  # `allowPrivilegeEscalation: true` — that is strictly worse than uid 0 with escalation
  # switched off. The application container is untouched and gains nothing.
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    privileged: false
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
      add:
        - NET_ADMIN
        - NET_BIND_SERVICE
    seccompProfile:
      type: RuntimeDefault

# -- Persistent storage configuration
# Disabled by default: logs go to an `emptyDir`, which keeps the pod reschedulable
# onto any node. Enable it to keep logs across pod restarts.

# -- gNB configuration file
# This is the main OCUDU gNB configuration in YAML format
# For detailed documentation, see: https://gitlab.com/ocudu/ocudu_elements/ocudu_helm
config:
  # -- Main gNB configuration file
  # @default -- See values.yaml for complete example
  gnb-config.yml: |-
    cu_cp:
      amf:
        addr: 127.0.1.100
        port: 38412
        bind_addr: 127.0.0.1
        supported_tracking_areas:
          - tac: 7
            plmn_list:
              - plmn: "00101"
                # Network slicing configuration
                tai_slice_support_list:
                  - sst: 1

    ru_ofh:
      t1a_max_cp_dl: 535
      t1a_min_cp_dl: 286
      t1a_max_cp_ul: 535
      t1a_min_cp_ul: 286
      t1a_max_up: 390
      t1a_min_up: 80
      ta4_max: 500
      ta4_min: 25
      is_prach_cp_enabled: false
      compr_method_ul: bfp
      compr_bitwidth_ul: 9
      compr_method_dl: bfp
      compr_bitwidth_dl: 9
      compr_method_prach: bfp
      compr_bitwidth_prach: 9
      enable_ul_static_compr_hdr: true
      enable_dl_static_compr_hdr: true
      iq_scaling: 5.5
      cells:
        - network_interface: enp1s0f0
          ru_mac_addr: 70:b3:d5:e1:5b:06
          du_mac_addr: 80:61:5f:0d:df:aa
          vlan_tag_cp: 5
          vlan_tag_up: 5
          prach_port_id: [4, 5]
          dl_port_id: [0, 1, 2, 3]
          ul_port_id: [0, 1]

    cell_cfg:
      dl_arfcn: 637212
      band: 78
      channel_bandwidth_MHz: 20
      common_scs: 30
      plmn: "00101"
      tac: 7
      pci: 1
      nof_antennas_dl: 4
      nof_antennas_ul: 2
      prach:
        prach_config_index: 7
        prach_root_sequence_index: 1
        zero_correlation_zone: 0
        prach_frequency_start: 0
      tdd_ul_dl_cfg:
        dl_ul_tx_period: 10
        nof_dl_slots: 7
        nof_dl_symbols: 6
        nof_ul_slots: 2
        nof_ul_symbols: 4

    log:
      filename: /var/log/ocudu/gnb.log
      all_level: warning

    pcap:
      mac_enable: false
      mac_filename: /var/log/ocudu/gnb_mac.pcap
      ngap_enable: false
      ngap_filename: /var/log/ocudu/gnb_ngap.pcap

    metrics:
      autostart_stdout_metrics: true
      enable_json: false

    remote_control:
      bind_addr: 0.0.0.0
      enabled: false
      port: 8001
