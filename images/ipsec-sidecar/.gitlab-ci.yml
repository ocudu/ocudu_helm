spec:
  inputs:
    ocudu_path:
      type: string
      default: ocudu/ocudu
      description: "OCUDU repository path."
    ocudu_ref:
      type: string
      default: dev
      description: "OCUDU reference branch or tag."
---
include:
  - project: $[[ inputs.ocudu_path ]]
    ref: $[[ inputs.ocudu_ref ]]
    file: .gitlab/ci-shared/docker.yml
  - local: .gitlab/ci/image_utils.yml

stages:
  - test
  - publish
  - manifest

.docker-builder-ipsec-sidecar:
  extends: .docker-builder
  variables:
    CONTEXT: images/ipsec-sidecar
    VERSION: "${STRONGSWAN_VERSION}_${CT_VERSION}"
    BUILD_ARGS: "STRONGSWAN_VERSION=${STRONGSWAN_VERSION}"
    NAME: ipsec-sidecar
    MULTI_ARCH_BUILD: "true"
    REGISTRY_URI: ${CI_REGISTRY}/${CI_PROJECT_PATH}
    REGISTRY_ORG: ""
  parallel:
    matrix:
      - PLATFORM: ["arm64", "amd64"]

build-and-scan-ipsec-sidecar:
  stage: test
  extends:
    - .docker-builder-ipsec-sidecar
    - .image scan
  rules:
    - if: $ON_MR

build-and-publish-ipsec-sidecar:
  stage: publish
  extends: .docker-builder-ipsec-sidecar
  rules:
    - if: $ON_DEFAULT_BRANCH
    - if: $ON_MR
      when: manual
      allow_failure: true
  variables:
    MODE: publish

docker manifest ipsec-sidecar:
  extends: .docker manifest
  stage: manifest
  variables:
    REGISTRY_URI: ${CI_REGISTRY}/${CI_PROJECT_PATH}
    REGISTRY_ORG: ""
    NAME: ipsec-sidecar
    VERSION: "${STRONGSWAN_VERSION}_${CT_VERSION}"
  needs:
    - job: build-and-publish-ipsec-sidecar
      optional: false
