# charon-systemd reads its settings under its own namespace, not under charon. A setting
# written only under charon is accepted and then silently ignored, so both sections are
# kept in step deliberately.
#
# The consequence is larger than it first appears. The packaged strongswan.conf enables
# modular plugin loading and includes the per-plugin configuration under charon, so under
# the other namespace nothing enables them: the daemon starts, reports itself healthy,
# loads its connections, and then cannot send a packet, because even the socket plugin was
# never loaded. Re-stating both below is what makes the daemon functional at all.

charon {
    # The daemon must not write to the routing table. The table is assembled once, at
    # startup, and is then a complete statement of where protected traffic may go; a
    # daemon-managed entry appearing later would be a path nobody declared.
    install_routes = no
    install_virtual_ip = no

    plugins {
        kernel-netlink {
            install_routes_xfrmi = no
        }
    }

    filelog {
        stderr {
            default = 1
            ike_name = yes
            time_format = %b %e %T
            flush_line = yes
        }
    }

    journal {
        default = -1
    }
}

charon-systemd {
    # Without these two the daemon loads no plugins at all. See the note at the top.
    load_modular = yes

    install_routes = no
    install_virtual_ip = no

    plugins {
        include /etc/strongswan.d/charon/*.conf

        kernel-netlink {
            install_routes_xfrmi = no
        }
    }

    filelog {
        stderr {
            default = 1
            ike_name = yes
            time_format = %b %e %T
            flush_line = yes
        }
    }

    journal {
        default = -1
    }
}
